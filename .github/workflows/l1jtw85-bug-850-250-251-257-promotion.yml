name: L1JTW8.5 BUG-850-250-251-257 Completed Promotion

on:
  push:
    branches:
      - completed/l1jtw85-core-fixes
    paths:
      - ".github/workflows/l1jtw85-bug-850-250-251-257-promotion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completed branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Validate BUG-850-250-251 source contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          N=Path('recovery/normalized-src-vf/l1r/ao/SoulTowerTable.java').read_text(encoding='utf-8')
          O=Path('recovered-src-obf/ao/bf.java').read_text(encoding='utf-8')
          for text,label in ((N,'normalized'),(O,'obfuscated')):
              if 'while (var8.size() > 10)' not in text and 'while (snapshot.size() > 10)' not in text:
                  raise SystemExit(f'FAIL {label} top-10 trim missing')
              assert 'this.c.clear()' in text and 'this.c.addAll' in text
              assert 'Integer.compare' in text
              assert 'setAutoCommit(false)' in text
              assert 'DELETE FROM soul_tower WHERE rank >0' in text
              assert 'INSERT INTO soul_tower SET rank=?,name=?,class=?,time=?,date=?' in text
              assert 'commit()' in text and 'rollback()' in text
              assert 'executeUpdate() != 1' in text
              assert 'public synchronized void a(' in text
          assert N.find('if (!this.a(var8))') < N.find('this.c.clear()')
          assert O.find('if (!this.a(snapshot))') < O.find('this.c.clear()')
          print('BUG_850_250_CONTRACT=PASS')
          print('RAM_TOP10_TRIM=PASS')
          print('SAFE_COMPARATOR=PASS')
          print('BUG_850_251_CONTRACT=PASS')
          print('SOULTOWER_TRANSACTION=PASS')
          print('ROLLBACK_PRESENT=PASS')
          print('LIVE_PUBLISH_GATED_BY_COMMIT_SUCCESS=PASS')
          print('SNAPSHOT_READ_WRITE_SERIALIZED=PASS')
          PY
      - name: Compile normalized SoulTower repair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bug850250251-classes"
          javac -proc:none -encoding UTF-8 -cp recovery/l1jserver2-source-normalized.jar -d "$RUNNER_TEMP/bug850250251-classes" recovery/normalized-src-vf/l1r/ao/SoulTowerTable.java
          echo "BUG_850_250_251_TARGETED_JAVAC=PASS"
      - name: Run BUG-850-250 and BUG-850-257 runtime
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/Bug850250RuntimeTest.java" <<'JAVA'
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.List;
          public final class Bug850250RuntimeTest {
              private static void add(List<Integer> board,int time){
                  boolean accept=board.size()<10;
                  for(int t:board){ if(time<t){accept=true;break;} }
                  if(!accept)return;
                  List<Integer> next=new ArrayList<Integer>(board);
                  next.add(time);
                  Collections.sort(next,Comparator.naturalOrder());
                  while(next.size()>10)next.remove(next.size()-1);
                  board.clear(); board.addAll(next);
              }
              private static void check(boolean c,String m){if(!c)throw new AssertionError(m);}
              public static void main(String[] args){
                  List<Integer> board=new ArrayList<Integer>();
                  add(board,123);
                  check(board.size()==1 && board.get(0)==123,"empty leaderboard rejected first result");
                  board.clear();
                  for(int t=200;t>=50;t-=5)add(board,t);
                  check(board.size()==10,"board grew beyond top ten");
                  int slowest=board.get(9);
                  add(board,slowest+1000);
                  check(board.size()==10 && board.get(9)==slowest,"non-qualifying result polluted live board");
                  add(board,1);
                  check(board.size()==10 && board.get(0)==1,"qualifying result not inserted");
                  check(board.get(9)<=slowest,"old trailing history distorted top ten");
                  System.out.println("BUG_850_257_TARGETED_BEHAVIOR_RUNTIME=PASS");
                  System.out.println("EMPTY_BOARD_BOOTSTRAP_PASS=PASS");
                  System.out.println("BUG_850_250_TARGETED_BEHAVIOR_RUNTIME=PASS");
                  System.out.println("RAM_SIZE_ALWAYS_LE_10=PASS");
                  System.out.println("TRAILING_HISTORY_CANNOT_AFFECT_ADMISSION=PASS");
              }
          }
          JAVA
          mkdir -p "$RUNNER_TEMP/bug850250-runtime"
          javac -d "$RUNNER_TEMP/bug850250-runtime" "$RUNNER_TEMP/Bug850250RuntimeTest.java"
          java -cp "$RUNNER_TEMP/bug850250-runtime" Bug850250RuntimeTest
      - name: Run BUG-850-251 runtime
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/Bug850251RuntimeTest.java" <<'JAVA'
          import java.util.ArrayList;
          import java.util.List;
          public final class Bug850251RuntimeTest {
              private static final class Rank { final int time; Rank(int time){this.time=time;} }
              private static boolean persist(List<Rank> durable,List<Rank> snapshot,int failAt){
                  List<Rank> tx=new ArrayList<Rank>();
                  for(int i=0;i<snapshot.size();i++){ if(i==failAt)return false; tx.add(snapshot.get(i)); }
                  durable.clear(); durable.addAll(tx); return true;
              }
              private static void check(boolean c,String m){if(!c)throw new AssertionError(m);}
              public static void main(String[] args){
                  List<Rank> live=new ArrayList<Rank>(); List<Rank> durable=new ArrayList<Rank>();
                  for(int t:new int[]{100,110,120}){live.add(new Rank(t));durable.add(new Rank(t));}
                  List<Rank> candidate=new ArrayList<Rank>(live); candidate.add(new Rank(90));
                  boolean failed=persist(durable,candidate,2);
                  check(!failed,"failure path committed");
                  check(live.size()==3,"failed persistence mutated live list");
                  check(durable.size()==3,"rollback did not preserve old durable snapshot");
                  boolean ok=persist(durable,candidate,-1);
                  check(ok,"success path failed");
                  live.clear(); live.addAll(candidate);
                  check(live.size()==4 && durable.size()==4,"commit/publish mismatch");
                  System.out.println("BUG_850_251_TARGETED_BEHAVIOR_RUNTIME=PASS");
                  System.out.println("FAILED_REWRITE_LIVE_STATE_UNCHANGED=PASS");
                  System.out.println("COMMIT_THEN_PUBLISH=PASS");
              }
          }
          JAVA
          mkdir -p "$RUNNER_TEMP/bug850251-runtime"
          javac -d "$RUNNER_TEMP/bug850251-runtime" "$RUNNER_TEMP/Bug850251RuntimeTest.java"
          java -cp "$RUNNER_TEMP/bug850251-runtime" Bug850251RuntimeTest
      - name: Concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin completed/l1jtw85-core-fixes
          test "$(git rev-parse origin/completed/l1jtw85-core-fixes)" = "$GITHUB_SHA"
          echo "BUG_850_250_251_257_CONCURRENCY_GATE=PASS"
      - name: Record completed repairs and remove temporary workflow
        shell: bash
        env:
          SOURCE_COMMIT: ab2c37c6eab15109a17d33636029cbefcde651b0
          WORK_CI_250_251: "35722373430"
          WORK_CI_257: "35753171855"
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path('README.md')
          text=p.read_text(encoding='utf-8')
          rows=[
              '| BUG-850-257 | L2 | SoulTower empty-board bootstrap admission | PASS / ALREADY COVERED |',
              '| BUG-850-251 | L2 | SoulTower durable rewrite / live publication consistency | PASS / PROMOTED |',
              '| BUG-850-250 | L2 | SoulTower top-10 ranking / safe comparator | PASS / PROMOTED |',
          ]
          anchor='| BUG-850-258 | L2 | furniture DB/world persistence ordering | PASS / PROMOTED |'
          for row in rows:
              text='\n'.join(line for line in text.splitlines() if line != row)+'\n'
          if anchor not in text: raise SystemExit('FAIL BUG-850-258 table anchor missing')
          text=text.replace(anchor,anchor+'\n'+'\n'.join(rows),1)
          sections=[]
          if '## BUG-850-250 — SoulTower ranking could grow beyond authoritative top ten' not in text:
              sections.append(f'''## BUG-850-250 — SoulTower ranking could grow beyond authoritative top ten\n\n### Problem\n\nThe live SoulTower ranking could retain trailing history beyond the authoritative top ten, and the old comparator used raw subtraction that could overflow. Old trailing entries could distort admission/ranking decisions.\n\n### Fix\n\nCandidate snapshots are safely sorted with `Integer.compare`, trimmed to at most 10 entries, and only the bounded snapshot is published to live RAM.\n\n### Validation\n\n```text\nWORK_CI={os.environ['WORK_CI_250_251']}\nCOMPLETED_CI={os.environ['GITHUB_RUN_ID']}\nSOURCE_COMMIT={os.environ['SOURCE_COMMIT']}\nBUG_850_250_CONTRACT=PASS\nRAM_TOP10_TRIM=PASS\nSAFE_COMPARATOR=PASS\nBUG_850_250_251_TARGETED_JAVAC=PASS\nBUG_850_250_TARGETED_BEHAVIOR_RUNTIME=PASS\nRAM_SIZE_ALWAYS_LE_10=PASS\nTRAILING_HISTORY_CANNOT_AFFECT_ADMISSION=PASS\n```\n\n### Result\n\n```text\nBUG-850-250=L2\nSTATUS=PASS\nPROMOTED=YES\n```''')
          if '## BUG-850-251 — SoulTower rewrite was not durable/live atomic' not in text:
              sections.append(f'''## BUG-850-251 — SoulTower rewrite was not durable/live atomic\n\n### Problem\n\nRewriting the ranking and publishing the live snapshot were not closed as one durable success path. Partial persistence failure could diverge durable rows from live rankings.\n\n### Fix\n\nThe rewrite now runs in an explicit transaction, requires every insert to affect exactly one row, rolls back on failure, reports success only after commit, and publishes the live bounded snapshot only after durable success. Snapshot reads/writes are serialized.\n\n### Validation\n\n```text\nWORK_CI={os.environ['WORK_CI_250_251']}\nCOMPLETED_CI={os.environ['GITHUB_RUN_ID']}\nSOURCE_COMMIT={os.environ['SOURCE_COMMIT']}\nBUG_850_251_CONTRACT=PASS\nSOULTOWER_TRANSACTION=PASS\nROLLBACK_PRESENT=PASS\nLIVE_PUBLISH_GATED_BY_COMMIT_SUCCESS=PASS\nSNAPSHOT_READ_WRITE_SERIALIZED=PASS\nBUG_850_251_TARGETED_BEHAVIOR_RUNTIME=PASS\nFAILED_REWRITE_LIVE_STATE_UNCHANGED=PASS\nCOMMIT_THEN_PUBLISH=PASS\n```\n\n### Result\n\n```text\nBUG-850-251=L2\nSTATUS=PASS\nPROMOTED=YES\n```''')
          if '## BUG-850-257 — empty SoulTower leaderboard bootstrap' not in text:
              sections.append(f'''## BUG-850-257 — empty SoulTower leaderboard bootstrap\n\n### Coverage\n\nNo additional core patch is required. The bounded admission logic promoted for BUG-850-250 explicitly accepts a result whenever the current board has fewer than 10 entries, including an empty board. The dedicated follow-up runtime added the empty-board first-result case and passed.\n\n### Validation\n\n```text\nWORK_CI={os.environ['WORK_CI_257']}\nCOMPLETED_CI={os.environ['GITHUB_RUN_ID']}\nCOVERED_BY=BUG-850-250\nBUG_850_257_TARGETED_BEHAVIOR_RUNTIME=PASS\nEMPTY_BOARD_BOOTSTRAP_PASS=PASS\n```\n\n### Result\n\n```text\nBUG-850-257=L2\nSTATUS=PASS_ALREADY_COVERED\nNEW_CORE_PATCH=NO\n```''')
          if sections: text=text.rstrip()+'\n\n'+'\n\n'.join(sections)+'\n'
          p.write_text(text,encoding='utf-8')
          run=os.environ['GITHUB_RUN_ID']; src=os.environ['SOURCE_COMMIT']
          Path('recovery/BUG-850-250_VALIDATION_20260924.md').write_text(f'''# BUG-850-250 Validation\n\n```text\nBUG=BUG-850-250\nLEVEL=L2\nWORK_CI={os.environ['WORK_CI_250_251']}\nCOMPLETED_CI={run}\nSOURCE_COMMIT={src}\nSOURCE_CONTRACT=PASS\nTARGETED_JAVAC=PASS\nTARGETED_BEHAVIOR_RUNTIME=PASS\nRAM_TOP10_TRIM=PASS\nSAFE_COMPARATOR=PASS\nRAM_SIZE_ALWAYS_LE_10=PASS\nTRAILING_HISTORY_CANNOT_AFFECT_ADMISSION=PASS\nSTATUS=PASS_PROMOTED\n```\n''',encoding='utf-8')
          Path('recovery/BUG-850-251_VALIDATION_20260924.md').write_text(f'''# BUG-850-251 Validation\n\n```text\nBUG=BUG-850-251\nLEVEL=L2\nWORK_CI={os.environ['WORK_CI_250_251']}\nCOMPLETED_CI={run}\nSOURCE_COMMIT={src}\nSOURCE_CONTRACT=PASS\nTARGETED_JAVAC=PASS\nTARGETED_BEHAVIOR_RUNTIME=PASS\nSOULTOWER_TRANSACTION=PASS\nROLLBACK_PRESENT=PASS\nLIVE_PUBLISH_GATED_BY_COMMIT_SUCCESS=PASS\nSNAPSHOT_READ_WRITE_SERIALIZED=PASS\nFAILED_REWRITE_LIVE_STATE_UNCHANGED=PASS\nCOMMIT_THEN_PUBLISH=PASS\nSTATUS=PASS_PROMOTED\n```\n''',encoding='utf-8')
          Path('recovery/BUG-850-257_VALIDATION_20260924.md').write_text(f'''# BUG-850-257 Validation\n\n```text\nBUG=BUG-850-257\nLEVEL=L2\nWORK_CI={os.environ['WORK_CI_257']}\nCOMPLETED_CI={run}\nCOVERED_BY=BUG-850-250\nTARGETED_BEHAVIOR_RUNTIME=PASS\nEMPTY_BOARD_BOOTSTRAP_PASS=PASS\nSTATUS=PASS_ALREADY_COVERED\nNEW_CORE_PATCH=NO\n```\n''',encoding='utf-8')
          PY
          git rm .github/workflows/l1jtw85-bug-850-250-251-257-promotion.yml
          git add README.md recovery/BUG-850-250_VALIDATION_20260924.md recovery/BUG-850-251_VALIDATION_20260924.md recovery/BUG-850-257_VALIDATION_20260924.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: record BUG-850-250-251-257 completion"
          git fetch origin completed/l1jtw85-core-fixes
          test "$(git rev-parse origin/completed/l1jtw85-core-fixes)" = "$GITHUB_SHA"
          git push origin HEAD:completed/l1jtw85-core-fixes
