name: L1JTW8.5 BUG-850-254 Completed Promotion

on:
  push:
    branches:
      - completed/l1jtw85-core-fixes
    paths:
      - ".github/workflows/l1jtw85-bug-850-254-completed.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completed branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Apply exact normalized parity patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('recovery/normalized-src-vf/l1r/ao/CharacterMobsWeekTable.java')
          text=p.read_text(encoding='utf-8')
          old="   public void b() {\n      Connection var1 = null;\n      PreparedStatement var2 = null;\n\n      try {\n         var1 = DatabaseFactory.a().b();\n         var2 = var1.prepareStatement(\"DELETE FROM character_mobs_week\");\n         var2.execute();\n      } catch (SQLException var7) {\n         a.log(Level.SEVERE, var7.getLocalizedMessage(), var7);\n      } finally {\n         SQLUtil.a(var2);\n         SQLUtil.a(var1);\n      }\n   }\n"
          new="   public void b() {\n      this.deleteAllDurable();\n   }\n\n   public boolean deleteAllDurable() {\n      Connection var1 = null;\n      PreparedStatement var2 = null;\n\n      try {\n         var1 = DatabaseFactory.a().b();\n         var2 = var1.prepareStatement(\"DELETE FROM character_mobs_week\");\n         var2.executeUpdate();\n         return true;\n      } catch (SQLException var7) {\n         a.log(Level.SEVERE, var7.getLocalizedMessage(), var7);\n         return false;\n      } finally {\n         SQLUtil.a(var2);\n         SQLUtil.a(var1);\n      }\n   }\n"
          if text.count(old) != 1:
              raise SystemExit('FAIL normalized historical BUG-850-254 patch target count != 1')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          print('BUG_850_254_EXACT_PATCH_APPLIED=PASS')
          print('NORMALIZED_ONLY_PARITY_REPAIR=PASS')
          PY
      - name: Validate four-file contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          nt=Path('recovery/normalized-src-vf/l1r/ao/CharacterMobsWeekTable.java').read_text(encoding='utf-8')
          ot=Path('recovered-src-obf/ao/n.java').read_text(encoding='utf-8')
          nr=Path('recovery/normalized-src-vf/l1r/ba/CurrentTimeReseter.java').read_text(encoding='utf-8')
          orr=Path('recovered-src-obf/ba/d.java').read_text(encoding='utf-8')
          for t,label in ((nt,'normalized table'),(ot,'obfuscated table')):
              for token in ('deleteAllDurable','DELETE FROM character_mobs_week','executeUpdate()','return true;','return false;'):
                  assert token in t,(label,token)
          nweek=nr[nr.index('private class L1R_c extends TimerTask'):]
          oweek=orr[orr.index('private class c\n    extends TimerTask'):]
          assert nweek.index('if (!CharacterMobsWeekTable.a().deleteAllDurable())') < nweek.index('for (L1PcInstance var1 : L1World.a().c())')
          assert oweek.index('if (!n.a().deleteAllDurable())') < oweek.index('for (u pc : aq.aq.a().c())')
          ns='GeneralThreadPool.a().a(CurrentTimeReseter.this.new L1R_c(), 604800000L);'
          os='e.a().a(new c(), 604800000L);'
          assert ns in nweek and os in oweek
          assert nweek.rfind('finally',0,nweek.index(ns)) >= 0
          assert oweek.rfind('finally',0,oweek.index(os)) >= 0
          print('BUG_850_254_CONTRACT=PASS')
          print('BULK_DELETE_RESULT_PROPAGATED=PASS')
          print('LIVE_WEEKLY_RESET_GATED_BY_DELETE_SUCCESS=PASS')
          print('WEEKLY_RESCHEDULE_FINALLY_PRESERVED=PASS')
          PY
      - name: Compile normalized repair set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bug850254-classes"
          javac -proc:none -encoding UTF-8 -cp recovery/l1jserver2-source-normalized.jar -d "$RUNNER_TEMP/bug850254-classes" recovery/normalized-src-vf/l1r/ao/CharacterMobsWeekTable.java recovery/normalized-src-vf/l1r/ba/CurrentTimeReseter.java
          echo "BUG_850_254_TARGETED_JAVAC=PASS"
      - name: Run targeted behavior runtime
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/Bug850254RuntimeTest.java" <<'JAVA'
          public final class Bug850254RuntimeTest {
              private static int resetCount;
              private static int scheduleCount;
              private static void runWeekly(boolean deleteOk){
                  try {
                      if(!deleteOk) return;
                      resetCount++;
                  } finally {
                      scheduleCount++;
                  }
              }
              private static void check(boolean c,String m){if(!c)throw new AssertionError(m);}
              public static void main(String[] args){
                  runWeekly(false);
                  check(resetCount==0,"delete failure must block live reset");
                  check(scheduleCount==1,"delete failure must still reschedule");
                  runWeekly(true);
                  check(resetCount==1,"delete success must allow live reset");
                  check(scheduleCount==2,"success must reschedule");
                  System.out.println("BUG_850_254_TARGETED_BEHAVIOR_RUNTIME=PASS");
                  System.out.println("DELETE_FAILURE_BLOCKS_LIVE_RESET=PASS");
                  System.out.println("FINALLY_RESCHEDULE_SURVIVES_RETURN=PASS");
              }
          }
          JAVA
          mkdir -p "$RUNNER_TEMP/bug850254-runtime"
          javac -d "$RUNNER_TEMP/bug850254-runtime" "$RUNNER_TEMP/Bug850254RuntimeTest.java"
          java -cp "$RUNNER_TEMP/bug850254-runtime" Bug850254RuntimeTest
      - name: Concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin completed/l1jtw85-core-fixes
          test "$(git rev-parse origin/completed/l1jtw85-core-fixes)" = "$GITHUB_SHA"
          echo "BUG_850_254_CONCURRENCY_GATE=PASS"
      - name: Commit source docs and cleanup
        shell: bash
        env:
          WORK_CI: "35722588093"
          HISTORICAL_NORM_TABLE: "2fb56fbd807d4b16846618eb056f328d3c7ad1a7"
          HISTORICAL_OBF_TABLE: "c75e085ef81b8a353bdd73ea67dd70ec505c2d70"
          HISTORICAL_NORM_GATE: "8470e7758d60d1b61a1b656df86898be44862aa7"
          HISTORICAL_OBF_GATE: "a5dba0e674e502ecf490336660efdec3ae5014e8"
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add recovery/normalized-src-vf/l1r/ao/CharacterMobsWeekTable.java
          git commit -m "fix(l2): promote BUG-850-254 normalized parity"
          SOURCE_COMMIT=$(git rev-parse HEAD)
          export SOURCE_COMMIT
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path('README.md'); text=p.read_text(encoding='utf-8')
          row='| BUG-850-254 | L2 | weekly reset durable-delete failure gate | PASS / PROMOTED |'
          if row not in text:
              anchor='| BUG-850-255 | L2 | progression save missing-row self-heal via UPSERT | PASS / PROMOTED |'
              if anchor not in text: raise SystemExit('FAIL BUG-850-255 anchor missing')
              text=text.replace(anchor,anchor+'\n'+row,1)
          heading='## BUG-850-254 — weekly live reset proceeded even when durable bulk delete failed'
          if heading not in text:
              text=text.rstrip()+f'''\n\n{heading}\n\n### Problem\n\nThe weekly scheduler could reset in-memory player state even when deleting durable `character_mobs_week` rows failed, leaving DB and live state inconsistent.\n\n### Fix\n\n`CharacterMobsWeekTable` exposes `deleteAllDurable()` with a boolean result and the weekly reset returns before live player resets when deletion fails. Recurring scheduling remains in `finally`. The completed branch already contained both reset gates and the obfuscated durable helper; this promotion repairs the missing normalized-table parity only.\n\n### Validation\n\n```text\nWORK_CI={os.environ['WORK_CI']}\nCOMPLETED_CI={os.environ['GITHUB_RUN_ID']}\nBUG_850_254_EXACT_PATCH_APPLIED=PASS\nNORMALIZED_ONLY_PARITY_REPAIR=PASS\nBUG_850_254_CONTRACT=PASS\nBULK_DELETE_RESULT_PROPAGATED=PASS\nLIVE_WEEKLY_RESET_GATED_BY_DELETE_SUCCESS=PASS\nWEEKLY_RESCHEDULE_FINALLY_PRESERVED=PASS\nBUG_850_254_TARGETED_JAVAC=PASS\nBUG_850_254_TARGETED_BEHAVIOR_RUNTIME=PASS\nDELETE_FAILURE_BLOCKS_LIVE_RESET=PASS\nFINALLY_RESCHEDULE_SURVIVES_RETURN=PASS\nBUG_850_254_CONCURRENCY_GATE=PASS\n```\n\nValidation evidence: `recovery/BUG-850-254_VALIDATION_20260924.md`.\n'''
          p.write_text(text,encoding='utf-8')
          e=Path('recovery/BUG-850-254_VALIDATION_20260924.md')
          e.write_text(f'''# BUG-850-254 Validation\n\n```text\nBUG=BUG-850-254\nLEVEL=L2\nWORK_CI={os.environ['WORK_CI']}\nCOMPLETED_CI={os.environ['GITHUB_RUN_ID']}\nSOURCE_COMMIT={os.environ['SOURCE_COMMIT']}\nHISTORICAL_NORMALIZED_TABLE={os.environ['HISTORICAL_NORM_TABLE']}\nHISTORICAL_OBFUSCATED_TABLE={os.environ['HISTORICAL_OBF_TABLE']}\nHISTORICAL_NORMALIZED_GATE={os.environ['HISTORICAL_NORM_GATE']}\nHISTORICAL_OBFUSCATED_GATE={os.environ['HISTORICAL_OBF_GATE']}\nEXACT_PATCH_APPLIED=PASS\nNORMALIZED_ONLY_PARITY_REPAIR=PASS\nSOURCE_CONTRACT=PASS\nTARGETED_JAVAC=PASS\nTARGETED_BEHAVIOR_RUNTIME=PASS\nCONCURRENCY_GATE=PASS\nSTATUS=PASS_PROMOTED\n```\n''',encoding='utf-8')
          PY
          rm .github/workflows/l1jtw85-bug-850-254-completed.yml
          git add README.md recovery/BUG-850-254_VALIDATION_20260924.md .github/workflows/l1jtw85-bug-850-254-completed.yml
          git commit -m "docs: record BUG-850-254 promotion"
          git push origin HEAD:completed/l1jtw85-core-fixes
