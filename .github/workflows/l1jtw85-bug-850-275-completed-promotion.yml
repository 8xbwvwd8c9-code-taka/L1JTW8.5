name: L1JTW8.5 BUG-850-275 Completed Promotion

on:
  push:
    branches:
      - completed/l1jtw85-core-fixes
    paths:
      - ".github/workflows/l1jtw85-bug-850-275-completed-promotion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completed branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Apply scoped BUG-850-275 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin work/l1jtw85-core-fixes completed/l1jtw85-core-fixes
          test "$(git rev-parse origin/completed/l1jtw85-core-fixes)" = "$GITHUB_SHA"
          echo "BUG_850_275_PRE_APPLY_CONCURRENCY=PASS"

          # These five historical commits apply cleanly to completed and contain only
          # the migration + transactional item helpers + commit-only inventory publication.
          for c in \
            1dedda57877a106921cace193d2c6185b838f06d \
            fa79fb92e5f1e13bb98b232a96e3d5e99b962eea \
            49a18c9019a52cbb5223a2fd30d5398c47c6f451 \
            096157cdf7fb62a56b988276eea57ad31393d949 \
            b25d425a5d0151f1bf8547d0b721bb3da3398214; do
            git cherry-pick -n "$c"
          done

          # 275 final QuestNew already contains 277 + 276, but predates 255.
          # Use exactly the validated 275 final sources, then re-apply only the later
          # completed BUG-850-255 UPSERT delta so no completed QuestNew repair is lost.
          git show 5c29a9848f572b2fcf362f0f9485c6856ffd2fe8:recovery/normalized-src-vf/l1r/ao/QuestNewTable.java > recovery/normalized-src-vf/l1r/ao/QuestNewTable.java
          git show ab38c16a271242ddb0f7f3394138c18ce2dc7667:recovered-src-obf/ao/az.java > recovered-src-obf/ao/az.java

          python - <<'PY'
          from pathlib import Path
          patches={
            'recovery/normalized-src-vf/l1r/ao/QuestNewTable.java':[
              ('var3 = var2.prepareStatement("UPDATE character_quests_new SET data=? WHERE objid=?");',
               'var3 = var2.prepareStatement("INSERT INTO character_quests_new (objid,data) VALUES (?,?) ON DUPLICATE KEY UPDATE data=VALUES(data)");'),
              ('var3.setBytes(1, this.f(var1));','var3.setBytes(2, this.f(var1));'),
              ('var3.setInt(2, var1.fr());','var3.setInt(1, var1.fr());'),
            ],
            'recovered-src-obf/ao/az.java':[
              ('pstm = con.prepareStatement("UPDATE character_quests_new SET data=? WHERE objid=?");',
               'pstm = con.prepareStatement("INSERT INTO character_quests_new (objid,data) VALUES (?,?) ON DUPLICATE KEY UPDATE data=VALUES(data)");'),
              ('pstm.setBytes(1, this.f(pc));','pstm.setBytes(2, this.f(pc));'),
              ('pstm.setInt(2, pc.fr());','pstm.setInt(1, pc.fr());'),
            ],
          }
          for f,reps in patches.items():
              p=Path(f); t=p.read_text(encoding='utf-8')
              for old,new in reps:
                  n=t.count(old)
                  if n != 1:
                      raise SystemExit(f'FAIL BUG-850-255 overlay {f}: expected 1 got {n}: {old}')
                  t=t.replace(old,new,1)
              p.write_text(t,encoding='utf-8')

          n=Path('recovery/normalized-src-vf/l1r/ao/QuestNewTable.java').read_text(encoding='utf-8')
          o=Path('recovered-src-obf/ao/az.java').read_text(encoding='utf-8')
          assert 'var5.a(var1.ev());' in n, 'BUG-850-276 normalized lost'
          assert 'for (int objectiveIndex = 0; objectiveIndex < var5.r().length; objectiveIndex++)' in n, 'BUG-850-277 normalized lost'
          assert 'quest.a(pc.ev());' in o, 'BUG-850-276 obfuscated lost'
          assert 'while (objectiveIndex < quest.r().length)' in o, 'BUG-850-277 obfuscated lost'
          assert 'INSERT INTO character_quests_new (objid,data) VALUES (?,?) ON DUPLICATE KEY UPDATE data=VALUES(data)' in n
          assert 'INSERT INTO character_quests_new (objid,data) VALUES (?,?) ON DUPLICATE KEY UPDATE data=VALUES(data)' in o
          print('BUG_850_255_276_277_OVERLAYS_PRESERVED=PASS')
          PY
          git add recovery/normalized-src-vf/l1r/ao/QuestNewTable.java recovered-src-obf/ao/az.java

          # Route only cmd524 through the atomic helper; these historical commits touch
          # only the normalized/obfuscated protocol files.
          git cherry-pick -n 92ac8fe09fa8574d999ba9d40d0ce0961d232d2a
          git cherry-pick -n 1210cd2d22f191e769ce91a112429550d41cb474

          git diff --cached --name-only | sort > "$RUNNER_TEMP/bug850275-files.txt"
          cat > "$RUNNER_TEMP/bug850275-expected.txt" <<'EOF'
          db/migrations/BUG-850-275_quest_reward_atomicity.sql
          recovered-src-obf/aj/bs.java
          recovered-src-obf/ao/az.java
          recovered-src-obf/ao/l.java
          recovered-src-obf/au/g.java
          recovery/normalized-src-vf/l1r/aj/C_ProtoBuffers.java
          recovery/normalized-src-vf/l1r/ao/CharacterItemTable.java
          recovery/normalized-src-vf/l1r/ao/QuestNewTable.java
          recovery/normalized-src-vf/l1r/au/L1PcInventory.java
          EOF
          diff -u "$RUNNER_TEMP/bug850275-expected.txt" "$RUNNER_TEMP/bug850275-files.txt"
          echo "BUG_850_275_SCOPED_SOURCE_APPLIED=PASS"
          echo "BUG_850_275_UNRELATED_SOURCE_REPLAY=NO"

      - name: Validate original work source contract
        shell: bash
        run: |
          set -euo pipefail
          git show origin/work/l1jtw85-core-fixes:tools/core-fix/validate_bug_850_275.py > "$RUNNER_TEMP/validate_bug_850_275.py"
          python "$RUNNER_TEMP/validate_bug_850_275.py"

      - name: Compile atomic quest route with ABI overlay
        shell: bash
        run: |
          set -euo pipefail
          BASELINE_SHA=92ac8fe09fa8574d999ba9d40d0ce0961d232d2a
          mkdir -p "$RUNNER_TEMP/qstubs/l1r/ao" "$RUNNER_TEMP/qstubs/l1r/au" "$RUNNER_TEMP/qoverlay" "$RUNNER_TEMP/qclasses"
          mkdir -p "$RUNNER_TEMP/pstubs/l1r/ao" "$RUNNER_TEMP/poverlay" "$RUNNER_TEMP/baseline/l1r/aj" "$RUNNER_TEMP/baseclasses" "$RUNNER_TEMP/currentclasses"
          cat > "$RUNNER_TEMP/qstubs/l1r/ao/CharacterItemTable.java" <<'JAVA'
          package l1r.ao;
          import java.sql.Connection; import java.sql.SQLException; import l1r.ap.L1ItemInstance;
          public class CharacterItemTable {
            public static CharacterItemTable a(){return null;}
            public void deleteQuestRewardItem(Connection c,int id,L1ItemInstance i,int n)throws SQLException{}
            public void updateQuestRewardCount(Connection c,int id,L1ItemInstance i,int o,int n)throws SQLException{}
            public void insertQuestReward(Connection c,int id,L1ItemInstance i)throws SQLException{}
          }
          JAVA
          cat > "$RUNNER_TEMP/qstubs/l1r/au/L1PcInventory.java" <<'JAVA'
          package l1r.au;
          import java.util.List; import l1r.ap.L1ItemInstance;
          public class L1PcInventory {
            public List<L1ItemInstance> d(){return null;} public int e(){return 0;} public int c(){return 0;}
            public L1ItemInstance d(int id,int n){return null;}
            public void publishCommittedQuestDelete(L1ItemInstance i){}
            public void publishCommittedQuestUpdate(L1ItemInstance i,int n){}
            public void publishCommittedQuestInsert(L1ItemInstance i){}
          }
          JAVA
          javac -proc:none -encoding UTF-8 -cp recovery/l1jserver2-source-normalized.jar -d "$RUNNER_TEMP/qoverlay" "$RUNNER_TEMP/qstubs/l1r/ao/CharacterItemTable.java" "$RUNNER_TEMP/qstubs/l1r/au/L1PcInventory.java"
          javac -proc:none -encoding UTF-8 -cp "$RUNNER_TEMP/qoverlay:recovery/l1jserver2-source-normalized.jar" -d "$RUNNER_TEMP/qclasses" recovery/normalized-src-vf/l1r/ao/QuestNewTable.java
          echo "BUG_850_275_QUESTNEW_JAVAC=PASS"

          cat > "$RUNNER_TEMP/pstubs/l1r/ao/QuestNewTable.java" <<'JAVA'
          package l1r.ao;
          import l1r.ap.L1PcInstance; import l1r.bh.L1QuestNew;
          public class QuestNewTable { public static QuestNewTable a(){return null;} public boolean claimReward(L1PcInstance p,L1QuestNew q,int s){return false;} }
          JAVA
          javac -proc:none -encoding UTF-8 -cp recovery/l1jserver2-source-normalized.jar -d "$RUNNER_TEMP/poverlay" "$RUNNER_TEMP/pstubs/l1r/ao/QuestNewTable.java"
          git show "$BASELINE_SHA:recovery/normalized-src-vf/l1r/aj/C_ProtoBuffers.java" > "$RUNNER_TEMP/baseline/l1r/aj/C_ProtoBuffers.java"
          set +e
          javac -proc:none -encoding UTF-8 -cp "$RUNNER_TEMP/poverlay:recovery/l1jserver2-source-normalized.jar" -d "$RUNNER_TEMP/baseclasses" "$RUNNER_TEMP/baseline/l1r/aj/C_ProtoBuffers.java" 2> "$RUNNER_TEMP/base.err"; B=$?
          javac -proc:none -encoding UTF-8 -cp "$RUNNER_TEMP/poverlay:recovery/l1jserver2-source-normalized.jar" -d "$RUNNER_TEMP/currentclasses" recovery/normalized-src-vf/l1r/aj/C_ProtoBuffers.java 2> "$RUNNER_TEMP/current.err"; C=$?
          set -e
          grep 'error:' "$RUNNER_TEMP/base.err" | sed -E 's#^.*error:#error:#' > "$RUNNER_TEMP/base.sig" || true
          grep 'error:' "$RUNNER_TEMP/current.err" | sed -E 's#^.*error:#error:#' > "$RUNNER_TEMP/current.sig" || true
          diff -u "$RUNNER_TEMP/base.sig" "$RUNNER_TEMP/current.sig"
          echo "BASELINE_JAVAC_RC=$B"; echo "CURRENT_JAVAC_RC=$C"
          echo "BUG_850_275_PROTO_ROUTE_NO_NEW_JAVAC_REGRESSION=PASS"

      - name: Run original targeted behavior runtime
        shell: bash
        run: |
          set -euo pipefail
          git show origin/work/l1jtw85-core-fixes:tools/core-fix/Bug850275RuntimeTest.java > "$RUNNER_TEMP/Bug850275RuntimeTest.java"
          mkdir -p "$RUNNER_TEMP/runtime"
          javac -d "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/Bug850275RuntimeTest.java"
          java -cp "$RUNNER_TEMP/runtime" Bug850275RuntimeTest

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "fix(l2): promote BUG-850-275 atomic quest reward claim"
          echo "BUG_850_275_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Final concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin completed/l1jtw85-core-fixes
          test "$(git rev-parse origin/completed/l1jtw85-core-fixes)" = "$GITHUB_SHA"
          echo "BUG_850_275_CONCURRENCY_GATE=PASS"

      - name: Record completed repair and push
        shell: bash
        env:
          WORK_CI: "35726686125"
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path('README.md'); text=p.read_text(encoding='utf-8')
          row='| BUG-850-275 | L2 | new quest reward claim transactional atomicity | PASS / PROMOTED |'
          if row not in text:
              anchor='| BUG-850-276 | L2 | new quest level-objective completion evaluation | PASS / PROMOTED |'
              if anchor not in text: raise SystemExit('FAIL BUG-850-276 table anchor missing')
              text=text.replace(anchor,anchor+'\n'+row,1)
          heading='## BUG-850-275 — new quest reward claim was not transactionally atomic'
          if heading not in text:
              text=text.rstrip()+f'''\n\n{heading}\n\n### Problem\n\nThe cmd524 reward path could persist item reward/consumption, quest claimed state and EXP separately from live inventory publication. Partial failure could split durable and live state.\n\n### Fix\n\ncmd524 now delegates to `QuestNewTable.claimReward(...)`. Item mutations, objective consumption, claimed quest blob and EXP are one InnoDB transaction with affected-row/count gates and rollback; live inventory/EXP/packets publish only after commit. Existing BUG-850-255/276/277 QuestNew behavior is preserved in both normalized and obfuscated sources.\n\nMigration: `db/migrations/BUG-850-275_quest_reward_atomicity.sql`.\n\n### Validation\n\n```text\nWORK_CI={os.environ['WORK_CI']}\nCOMPLETED_CI={os.environ['GITHUB_RUN_ID']}\nSOURCE_COMMIT={os.environ['BUG_850_275_SOURCE_COMMIT']}\nSCOPED_SOURCE_APPLIED=PASS\nUNRELATED_SOURCE_REPLAY=NO\nBUG_850_255_276_277_OVERLAYS_PRESERVED=PASS\nBUG_850_275_CONTRACT=PASS\nQUESTNEW_JAVAC=PASS\nPROTO_ROUTE_NO_NEW_JAVAC_REGRESSION=PASS\nTARGETED_BEHAVIOR_RUNTIME=PASS\nCONCURRENCY_GATE=PASS\n```\n\nValidation evidence: `recovery/BUG-850-275_VALIDATION_20260924.md`.\n\n### Result\n\n```text\nBUG-850-275=L2\nSTATUS=PASS_PROMOTED\n```\n'''
          p.write_text(text,encoding='utf-8')
          Path('recovery/BUG-850-275_VALIDATION_20260924.md').write_text(f'''# BUG-850-275 Validation\n\n```text\nBUG=BUG-850-275\nLEVEL=L2\nWORK_CI={os.environ['WORK_CI']}\nCOMPLETED_CI={os.environ['GITHUB_RUN_ID']}\nSOURCE_COMMIT={os.environ['BUG_850_275_SOURCE_COMMIT']}\nSCOPED_SOURCE_APPLIED=PASS\nUNRELATED_SOURCE_REPLAY=NO\nPRESERVE_255_276_277=PASS\nSOURCE_CONTRACT=PASS\nQUESTNEW_JAVAC=PASS\nPROTO_ROUTE_NO_NEW_JAVAC_REGRESSION=PASS\nTARGETED_BEHAVIOR_RUNTIME=PASS\nCONCURRENCY_GATE=PASS\nSTATUS=PASS_PROMOTED\n```\n''',encoding='utf-8')
          PY
          git rm .github/workflows/l1jtw85-bug-850-275-completed-promotion.yml
          git add README.md recovery/BUG-850-275_VALIDATION_20260924.md
          git commit -m "docs: record BUG-850-275 promotion"
          git push origin HEAD:completed/l1jtw85-core-fixes
