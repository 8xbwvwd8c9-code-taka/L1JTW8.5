name: L1JTW8.5 BUG-850-275 Completed Promotion

on:
  push:
    branches:
      - completed/l1jtw85-core-fixes
    paths:
      - ".github/workflows/l1jtw85-bug-850-275-completed-promotion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completed branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Apply exact historical BUG-850-275 chain
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin work/l1jtw85-core-fixes completed/l1jtw85-core-fixes
          test "$(git rev-parse origin/completed/l1jtw85-core-fixes)" = "$GITHUB_SHA"
          echo "BUG_850_275_PRE_APPLY_CONCURRENCY=PASS"

          CHAIN=(
            1dedda57877a106921cace193d2c6185b838f06d
            fa79fb92e5f1e13bb98b232a96e3d5e99b962eea
            49a18c9019a52cbb5223a2fd30d5398c47c6f451
            096157cdf7fb62a56b988276eea57ad31393d949
            b25d425a5d0151f1bf8547d0b721bb3da3398214
            49ba71d388c5d9c5a5b087a81f6d8cf6a2f1ff11
            10b580ad0c79ccb78b9b580f9be4037d2c5632e2
            92ac8fe09fa8574d999ba9d40d0ce0961d232d2a
            1210cd2d22f191e769ce91a112429550d41cb474
            5c29a9848f572b2fcf362f0f9485c6856ffd2fe8
            ab38c16a271242ddb0f7f3394138c18ce2dc7667
          )
          for c in "${CHAIN[@]}"; do
            echo "APPLY=$c"
            git cherry-pick -n "$c"
          done

          git diff --cached --name-only | sort > "$RUNNER_TEMP/bug850275-files.txt"
          cat "$RUNNER_TEMP/bug850275-files.txt"
          cat > "$RUNNER_TEMP/bug850275-expected.txt" <<'EOF'
          db/migrations/BUG-850-275_quest_reward_atomicity.sql
          recovered-src-obf/aj/bs.java
          recovered-src-obf/ao/az.java
          recovered-src-obf/ao/l.java
          recovered-src-obf/au/g.java
          recovery/normalized-src-vf/l1r/aj/C_ProtoBuffers.java
          recovery/normalized-src-vf/l1r/ao/CharacterItemTable.java
          recovery/normalized-src-vf/l1r/ao/QuestNewTable.java
          recovery/normalized-src-vf/l1r/au/L1PcInventory.java
          EOF
          diff -u "$RUNNER_TEMP/bug850275-expected.txt" "$RUNNER_TEMP/bug850275-files.txt"
          echo "BUG_850_275_EXACT_CHAIN_APPLIED=PASS"
          echo "BUG_850_275_UNRELATED_SOURCE_REPLAY=NO"

      - name: Validate original work source contract
        shell: bash
        run: |
          set -euo pipefail
          git show origin/work/l1jtw85-core-fixes:tools/core-fix/validate_bug_850_275.py > "$RUNNER_TEMP/validate_bug_850_275.py"
          python "$RUNNER_TEMP/validate_bug_850_275.py"

      - name: Compile atomic quest route with ABI overlay
        shell: bash
        run: |
          set -euo pipefail
          BASELINE_SHA=92ac8fe09fa8574d999ba9d40d0ce0961d232d2a
          mkdir -p "$RUNNER_TEMP/bug850275-qstubs/l1r/ao" "$RUNNER_TEMP/bug850275-qstubs/l1r/au" "$RUNNER_TEMP/bug850275-qoverlay" "$RUNNER_TEMP/bug850275-qclasses"
          mkdir -p "$RUNNER_TEMP/bug850275-pstubs/l1r/ao" "$RUNNER_TEMP/bug850275-poverlay" "$RUNNER_TEMP/bug850275-baseline/l1r/aj" "$RUNNER_TEMP/bug850275-baseline-classes" "$RUNNER_TEMP/bug850275-current-classes"

          cat > "$RUNNER_TEMP/bug850275-qstubs/l1r/ao/CharacterItemTable.java" <<'JAVA'
          package l1r.ao;
          import java.sql.Connection;
          import java.sql.SQLException;
          import l1r.ap.L1ItemInstance;
          public class CharacterItemTable {
              public static CharacterItemTable a(){ return null; }
              public void deleteQuestRewardItem(Connection c,int charId,L1ItemInstance item,int count) throws SQLException {}
              public void updateQuestRewardCount(Connection c,int charId,L1ItemInstance item,int oldCount,int newCount) throws SQLException {}
              public void insertQuestReward(Connection c,int charId,L1ItemInstance item) throws SQLException {}
          }
          JAVA

          cat > "$RUNNER_TEMP/bug850275-qstubs/l1r/au/L1PcInventory.java" <<'JAVA'
          package l1r.au;
          import java.util.List;
          import l1r.ap.L1ItemInstance;
          public class L1PcInventory {
              public List<L1ItemInstance> d(){ return null; }
              public int e(){ return 0; }
              public int c(){ return 0; }
              public L1ItemInstance d(int itemId,int count){ return null; }
              public void publishCommittedQuestDelete(L1ItemInstance item) {}
              public void publishCommittedQuestUpdate(L1ItemInstance item,int count) {}
              public void publishCommittedQuestInsert(L1ItemInstance item) {}
          }
          JAVA

          javac -proc:none -encoding UTF-8 -cp recovery/l1jserver2-source-normalized.jar -d "$RUNNER_TEMP/bug850275-qoverlay" "$RUNNER_TEMP/bug850275-qstubs/l1r/ao/CharacterItemTable.java" "$RUNNER_TEMP/bug850275-qstubs/l1r/au/L1PcInventory.java"
          javac -proc:none -encoding UTF-8 -cp "$RUNNER_TEMP/bug850275-qoverlay:recovery/l1jserver2-source-normalized.jar" -d "$RUNNER_TEMP/bug850275-qclasses" recovery/normalized-src-vf/l1r/ao/QuestNewTable.java
          echo "BUG_850_275_QUESTNEW_JAVAC=PASS"

          cat > "$RUNNER_TEMP/bug850275-pstubs/l1r/ao/QuestNewTable.java" <<'JAVA'
          package l1r.ao;
          import l1r.ap.L1PcInstance;
          import l1r.bh.L1QuestNew;
          public class QuestNewTable {
              public static QuestNewTable a(){ return null; }
              public boolean claimReward(L1PcInstance pc,L1QuestNew quest,int selectedIndex){ return false; }
          }
          JAVA

          javac -proc:none -encoding UTF-8 -cp recovery/l1jserver2-source-normalized.jar -d "$RUNNER_TEMP/bug850275-poverlay" "$RUNNER_TEMP/bug850275-pstubs/l1r/ao/QuestNewTable.java"
          git show "$BASELINE_SHA:recovery/normalized-src-vf/l1r/aj/C_ProtoBuffers.java" > "$RUNNER_TEMP/bug850275-baseline/l1r/aj/C_ProtoBuffers.java"

          set +e
          javac -proc:none -encoding UTF-8 -cp "$RUNNER_TEMP/bug850275-poverlay:recovery/l1jserver2-source-normalized.jar" -d "$RUNNER_TEMP/bug850275-baseline-classes" "$RUNNER_TEMP/bug850275-baseline/l1r/aj/C_ProtoBuffers.java" 2> "$RUNNER_TEMP/bug850275-baseline.err"
          BASE_RC=$?
          javac -proc:none -encoding UTF-8 -cp "$RUNNER_TEMP/bug850275-poverlay:recovery/l1jserver2-source-normalized.jar" -d "$RUNNER_TEMP/bug850275-current-classes" recovery/normalized-src-vf/l1r/aj/C_ProtoBuffers.java 2> "$RUNNER_TEMP/bug850275-current.err"
          CUR_RC=$?
          set -e
          grep 'error:' "$RUNNER_TEMP/bug850275-baseline.err" | sed -E 's#^.*error:#error:#' > "$RUNNER_TEMP/bug850275-baseline.sig" || true
          grep 'error:' "$RUNNER_TEMP/bug850275-current.err" | sed -E 's#^.*error:#error:#' > "$RUNNER_TEMP/bug850275-current.sig" || true
          diff -u "$RUNNER_TEMP/bug850275-baseline.sig" "$RUNNER_TEMP/bug850275-current.sig"
          echo "BASELINE_JAVAC_RC=$BASE_RC"
          echo "CURRENT_JAVAC_RC=$CUR_RC"
          echo "BUG_850_275_PROTO_ROUTE_NO_NEW_JAVAC_REGRESSION=PASS"

      - name: Run original targeted behavior runtime
        shell: bash
        run: |
          set -euo pipefail
          git show origin/work/l1jtw85-core-fixes:tools/core-fix/Bug850275RuntimeTest.java > "$RUNNER_TEMP/Bug850275RuntimeTest.java"
          mkdir -p "$RUNNER_TEMP/bug850275-runtime"
          javac -d "$RUNNER_TEMP/bug850275-runtime" "$RUNNER_TEMP/Bug850275RuntimeTest.java"
          java -cp "$RUNNER_TEMP/bug850275-runtime" Bug850275RuntimeTest

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "fix(l2): promote BUG-850-275 atomic quest reward claim"
          echo "BUG_850_275_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Final concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin completed/l1jtw85-core-fixes
          test "$(git rev-parse origin/completed/l1jtw85-core-fixes)" = "$GITHUB_SHA"
          echo "BUG_850_275_CONCURRENCY_GATE=PASS"

      - name: Record completed repair and push
        shell: bash
        env:
          WORK_CI: "35726686125"
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path('README.md')
          text=p.read_text(encoding='utf-8')
          row='| BUG-850-275 | L2 | new quest reward claim transactional atomicity | PASS / PROMOTED |'
          if row not in text:
              anchor='| BUG-850-276 | L2 | new quest level-objective completion evaluation | PASS / PROMOTED |'
              if anchor not in text:
                  raise SystemExit('FAIL BUG-850-276 table anchor missing')
              text=text.replace(anchor, anchor+'\n'+row, 1)
          heading='## BUG-850-275 — new quest reward claim was not transactionally atomic'
          if heading not in text:
              text=text.rstrip()+f'''\n\n{heading}\n\n### Problem\n\nThe cmd524 quest-reward path could mutate rewards, consumed objective items, claimed state, EXP and live inventory as separate operations. A failure between them could leave durable state and live state split, or permit partial reward/consume publication.\n\n### Fix\n\nThe completed source now routes cmd524 through `QuestNewTable.claimReward(...)`. Reward planning, objective consumption, `character_items`, `character_quests_new` claimed state and `characters.Exp` persist in one InnoDB transaction; durable affected-row/count gates fail closed; live inventory, EXP and quest packets publish only after commit. Normalized and obfuscated sources are kept in parity.\n\nMigration: `db/migrations/BUG-850-275_quest_reward_atomicity.sql`.\n\n### Validation\n\n```text\nWORK_CI={os.environ['WORK_CI']}\nCOMPLETED_CI={os.environ['GITHUB_RUN_ID']}\nSOURCE_COMMIT={os.environ['BUG_850_275_SOURCE_COMMIT']}\nEXACT_HISTORICAL_CHAIN=PASS\nUNRELATED_SOURCE_REPLAY=NO\nBUG_850_275_CONTRACT=PASS\nCMD524_ATOMIC_ROUTE_ONLY=PASS\nTHREE_TABLE_INNODB_GATE=PASS\nITEM_COUNT_CAS=PASS\nQUEST_AUTOSAVE_LOCKED=PASS\nCOMMIT_BEFORE_LIVE_PUBLICATION=PASS\nROLLBACK_PATH_PRESENT=PASS\nSTACK_PLAN_MERGE=PASS\nOBJECTIVE_CONSUMPTION_IN_TRANSACTION=PASS\nEXP_IN_TRANSACTION=PASS\nBUG_850_275_QUESTNEW_JAVAC=PASS\nBUG_850_275_PROTO_ROUTE_NO_NEW_JAVAC_REGRESSION=PASS\nBUG_850_275_TARGETED_BEHAVIOR_RUNTIME=PASS\nBUG_850_275_CONCURRENCY_GATE=PASS\n```\n\nValidation evidence: `recovery/BUG-850-275_VALIDATION_20260924.md`.\n\n### Result\n\n```text\nBUG-850-275=L2\nSTATUS=PASS_PROMOTED\n```\n'''
          p.write_text(text,encoding='utf-8')

          ev=Path('recovery/BUG-850-275_VALIDATION_20260924.md')
          ev.write_text(f'''# BUG-850-275 Validation\n\n```text\nBUG=BUG-850-275\nLEVEL=L2\nWORK_CI={os.environ['WORK_CI']}\nCOMPLETED_CI={os.environ['GITHUB_RUN_ID']}\nSOURCE_COMMIT={os.environ['BUG_850_275_SOURCE_COMMIT']}\nEXACT_HISTORICAL_CHAIN=PASS\nUNRELATED_SOURCE_REPLAY=NO\nSOURCE_CONTRACT=PASS\nQUESTNEW_JAVAC=PASS\nPROTO_ROUTE_NO_NEW_JAVAC_REGRESSION=PASS\nTARGETED_BEHAVIOR_RUNTIME=PASS\nCONCURRENCY_GATE=PASS\nSTATUS=PASS_PROMOTED\n```\n''',encoding='utf-8')
          PY
          git rm .github/workflows/l1jtw85-bug-850-275-completed-promotion.yml
          git add README.md recovery/BUG-850-275_VALIDATION_20260924.md
          git commit -m "docs: record BUG-850-275 promotion"
          git push origin HEAD:completed/l1jtw85-core-fixes
