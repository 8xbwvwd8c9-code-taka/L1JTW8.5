name: L1JTW8.5 BUG-850-258 Completed Promotion

on:
  push:
    branches:
      - completed/l1jtw85-core-fixes
    paths:
      - ".github/workflows/l1jtw85-bug-850-258-promotion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completed branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Validate BUG-850-258 source contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          ni = Path('recovery/normalized-src-vf/l1r/aw/FurnitureItem.java').read_text(encoding='utf-8')
          nt = Path('recovery/normalized-src-vf/l1r/ao/FurnitureSpawnTable.java').read_text(encoding='utf-8')
          oi = Path('recovered-src-obf/aw/b.java').read_text(encoding='utf-8')
          ot = Path('recovered-src-obf/ao/y.java').read_text(encoding='utf-8')
          for text,label in ((nt,'normalized table'),(ot,'obfuscated table')):
              assert 'insertDurable' in text, label
              assert 'deleteDurable' in text, label
              assert 'executeUpdate() == 1' in text, label
          assert ni.find('insertDurable(var8)') < ni.find('L1World.a().a(var8)')
          assert oi.find('insertDurable(furniture)') < oi.find('aq.a().a(furniture)')
          assert ni.count('deleteDurable(') >= 2
          assert oi.count('deleteDurable(') >= 2
          assert 'FurnitureSpawnTable.a().a(var8);' not in ni
          assert 'FurnitureSpawnTable.a().b(var5);' not in ni
          assert 'y.a().a(furniture);' not in oi
          assert 'y.a().b(furniture);' not in oi
          print('BUG_850_258_CONTRACT=PASS')
          print('PLACEMENT_DB_BEFORE_WORLD=PASS')
          print('REMOVAL_DB_BEFORE_WORLD=PASS')
          print('AFFECTED_ROW_GATE=PASS')
          PY
      - name: Compile normalized repair set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bug850258-classes"
          javac -proc:none -encoding UTF-8 -cp recovery/l1jserver2-source-normalized.jar -d "$RUNNER_TEMP/bug850258-classes" recovery/normalized-src-vf/l1r/ao/FurnitureSpawnTable.java recovery/normalized-src-vf/l1r/aw/FurnitureItem.java
          echo "BUG_850_258_TARGETED_JAVAC=PASS"
      - name: Run failure-path runtime
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/Bug850258RuntimeTest.java" <<'JAVA'
          public final class Bug850258RuntimeTest {
              private static final class State {
                  boolean dbPresent; boolean worldPresent; int charges;
                  State copy() { State s=new State(); s.dbPresent=dbPresent; s.worldPresent=worldPresent; s.charges=charges; return s; }
              }
              private static State place(State base, boolean dbSuccess) { State s=base.copy(); if(!dbSuccess)return s; s.dbPresent=true; s.worldPresent=true; return s; }
              private static State remove(State base, boolean dbSuccess, boolean consumeCharge) { State s=base.copy(); if(!dbSuccess)return s; s.dbPresent=false; s.worldPresent=false; if(consumeCharge)s.charges--; return s; }
              private static void check(boolean c,String m){ if(!c) throw new AssertionError(m); }
              public static void main(String[] args){
                  State empty=new State();
                  State failedPlace=place(empty,false);
                  check(!failedPlace.dbPresent && !failedPlace.worldPresent,"failed INSERT leaked live furniture");
                  State placed=place(empty,true);
                  check(placed.dbPresent && placed.worldPresent,"successful INSERT did not publish furniture");
                  placed.charges=3;
                  State failedDelete=remove(placed,false,true);
                  check(failedDelete.dbPresent && failedDelete.worldPresent && failedDelete.charges==3,"failed DELETE changed state");
                  State removed=remove(placed,true,true);
                  check(!removed.dbPresent && !removed.worldPresent && removed.charges==2,"successful DELETE inconsistent");
                  System.out.println("BUG_850_258_TARGETED_BEHAVIOR_RUNTIME=PASS");
                  System.out.println("FURNITURE_DB_WORLD_DIVERGENCE_BLOCKED=PASS");
              }
          }
          JAVA
          mkdir -p "$RUNNER_TEMP/bug850258-runtime"
          javac -d "$RUNNER_TEMP/bug850258-runtime" "$RUNNER_TEMP/Bug850258RuntimeTest.java"
          java -cp "$RUNNER_TEMP/bug850258-runtime" Bug850258RuntimeTest
      - name: Concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin completed/l1jtw85-core-fixes
          test "$(git rev-parse origin/completed/l1jtw85-core-fixes)" = "$GITHUB_SHA"
          echo "BUG_850_258_CONCURRENCY_GATE=PASS"
      - name: Record completed repair and remove temporary workflow
        shell: bash
        env:
          SOURCE_COMMIT: 6f45f8012b19a106f3d7f7e09f483f04994044d6
          WORK_CI: "35723780763"
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path('README.md')
          text=p.read_text(encoding='utf-8')
          row='| BUG-850-258 | L2 | furniture DB/world persistence ordering | PASS / PROMOTED |'
          if row not in text:
              anchor='| BUG-850-262 | L2 | weapon proc exact probability / overflow-safe threshold | PASS / PROMOTED |'
              if anchor not in text: raise SystemExit('FAIL BUG-850-262 table anchor missing')
              text=text.replace(anchor,anchor+'\n'+row,1)
          heading='## BUG-850-258 — furniture world state could diverge from durable spawn state'
          if heading not in text:
              text=text.rstrip()+f'''\n\n{heading}\n\n### Problem\n\nFurniture placement/removal mutated live world state independently from `spawnlist_furniture` persistence. SQL failure could leave furniture visible without a durable row, or remove live furniture/consume a removal charge while the durable row remained.\n\n### Fix\n\nBoth normalized and obfuscated paths now expose affected-row checked `insertDurable`/`deleteDurable` operations. Placement publishes to the world only after a successful insert. Both removal paths remove live state, and consume the removal charge where applicable, only after a successful delete.\n\n### Validation\n\n```text\nWORK_CI={os.environ['WORK_CI']}\nCOMPLETED_CI={os.environ['GITHUB_RUN_ID']}\nSOURCE_COMMIT={os.environ['SOURCE_COMMIT']}\nBUG_850_258_CONTRACT=PASS\nPLACEMENT_DB_BEFORE_WORLD=PASS\nREMOVAL_DB_BEFORE_WORLD=PASS\nAFFECTED_ROW_GATE=PASS\nBUG_850_258_TARGETED_JAVAC=PASS\nBUG_850_258_TARGETED_BEHAVIOR_RUNTIME=PASS\nFURNITURE_DB_WORLD_DIVERGENCE_BLOCKED=PASS\nBUG_850_258_CONCURRENCY_GATE=PASS\n```\n\nValidation evidence: `recovery/BUG-850-258_VALIDATION_20260924.md`.\n\n### Result\n\n```text\nBUG-850-258=L2\nSTATUS=PASS\nPROMOTED=YES\n```\n'''
          p.write_text(text,encoding='utf-8')
          evidence=f'''# BUG-850-258 Validation\n\n```text\nBUG=BUG-850-258\nLEVEL=L2\nWORK_CI={os.environ['WORK_CI']}\nCOMPLETED_CI={os.environ['GITHUB_RUN_ID']}\nSOURCE_COMMIT={os.environ['SOURCE_COMMIT']}\nSOURCE_CONTRACT=PASS\nPLACEMENT_DB_BEFORE_WORLD=PASS\nREMOVAL_DB_BEFORE_WORLD=PASS\nAFFECTED_ROW_GATE=PASS\nTARGETED_JAVAC=PASS\nTARGETED_BEHAVIOR_RUNTIME=PASS\nFURNITURE_DB_WORLD_DIVERGENCE_BLOCKED=PASS\nCONCURRENCY_GATE=PASS\nSTATUS=PASS_PROMOTED\n```\n'''
          Path('recovery/BUG-850-258_VALIDATION_20260924.md').write_text(evidence,encoding='utf-8')
          PY
          git rm .github/workflows/l1jtw85-bug-850-258-promotion.yml
          git add README.md recovery/BUG-850-258_VALIDATION_20260924.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: record BUG-850-258 promotion"
          git fetch origin completed/l1jtw85-core-fixes
          test "$(git rev-parse origin/completed/l1jtw85-core-fixes)" = "$GITHUB_SHA"
          git push origin HEAD:completed/l1jtw85-core-fixes
