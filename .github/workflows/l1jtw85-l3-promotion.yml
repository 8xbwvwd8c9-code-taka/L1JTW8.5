name: L1JTW8.5 L3 Completed Validation

on:
  push:
    branches:
      - completed/l1jtw85-core-fixes

permissions:
  contents: write

jobs:
  l3-completed-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Merge protected L3 clan deletion transaction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64

          def replace_section(path, start_marker, end_marker, section_b64):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(start_marker) != 1 or text.count(end_marker) != 1:
                  raise SystemExit(f"PATCH_GATE_FAIL {path}: section markers not unique")
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              if end <= start:
                  raise SystemExit(f"PATCH_GATE_FAIL {path}: bad section order")
              new_section = base64.b64decode(section_b64).decode("utf-8")
              p.write_text(text[:start] + new_section + text[end:], encoding="utf-8")

          replace_section(
              "recovery/normalized-src-vf/l1r/ao/ClanTable.java",
              "   public void b(String var1) {",
              "\n\n   public L1Clan a(int var1)",
              ""
          )

          replace_section(
              "recovered-src-obf/ao/q.java",
              "    public void b(String clan_name) {",
              "\n\n    public i a(int clan_id)",
              ""
          )
          PY
          git diff --check
          if ! git diff --quiet -- recovery/normalized-src-vf/l1r/ao/ClanTable.java recovered-src-obf/ao/q.java; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add recovery/normalized-src-vf/l1r/ao/ClanTable.java recovered-src-obf/ao/q.java
            git commit -m "fix(l3): merge clan deletion transaction with completed hardening"
            git push origin HEAD:completed/l1jtw85-core-fixes
          fi
      - name: Run Batch1-7 source contracts
        shell: bash
        run: |
          set -euo pipefail
          for N in 1 2 3 4 5 6 7; do
            echo "=== BATCH$N ==="
            python "tools/core-fix/validate_l3_batch$N.py"
          done
          echo "L3_COMPLETED_CONTRACTS=PASS"
