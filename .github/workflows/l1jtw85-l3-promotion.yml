name: L1JTW8.5 L3 Completed Validation

on:
  push:
    branches:
      - completed/l1jtw85-core-fixes

permissions:
  contents: write

jobs:
  l3-completed-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Merge protected L3 result bounds hunks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          patches = {
              Path("recovery/normalized-src-vf/l1r/aj/C_Result.java"): [
                  (
                      "int var60 = this.b();\n                                 int var63 = this.b();\n                                 L1PrivateShopSellList var65 = var44.get(var60);",
                      "int var60 = this.b();\n                                 int var63 = this.b();\n                                 if (var60 < 0 || var60 >= var44.size()) {\n                                    var37.h(false);\n                                    return;\n                                 }\n                                 L1PrivateShopSellList var65 = var44.get(var60);",
                  ),
                  (
                      "int var62 = this.c();\n                              L1ItemInstance var64 = var3.j().e(var54);",
                      "int var62 = this.c();\n                              if (var62 < 0 || var62 >= var41.size()) {\n                                 var35.h(false);\n                                 return;\n                              }\n                              L1ItemInstance var64 = var3.j().e(var54);",
                  ),
              ],
              Path("recovered-src-obf/aj/bx.java"): [
                  (
                      "order = this.b();\n                        count = this.b();\n                        pssl = sellList.get(order);",
                      "order = this.b();\n                        count = this.b();\n                        if (order < 0 || order >= sellList.size()) {\n                            targetPc.h(false);\n                            return;\n                        }\n                        pssl = sellList.get(order);",
                  ),
                  (
                      "order = this.c();\n                    item = pc.j().e(itemObjectId);",
                      "order = this.c();\n                    if (order < 0 || order >= buyList.size()) {\n                        targetPc.h(false);\n                        return;\n                    }\n                    item = pc.j().e(itemObjectId);",
                  ),
              ],
          }

          for path, replacements in patches.items():
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  hits = text.count(old)
                  if hits != 1:
                      raise SystemExit(f"PATCH_GATE_FAIL {path}: expected 1 hit, got {hits}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY
          git diff --check
          if ! git diff --quiet -- recovery/normalized-src-vf/l1r/aj/C_Result.java recovered-src-obf/aj/bx.java; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add recovery/normalized-src-vf/l1r/aj/C_Result.java recovered-src-obf/aj/bx.java
            git commit -m "fix(l3): merge result bounds contracts with completed hardening"
            git push origin HEAD:completed/l1jtw85-core-fixes
          fi
      - name: Run Batch1-7 source contracts
        shell: bash
        run: |
          set -euo pipefail
          for N in 1 2 3 4 5 6 7; do
            echo "=== BATCH$N ==="
            python "tools/core-fix/validate_l3_batch$N.py"
          done
          echo "L3_COMPLETED_CONTRACTS=PASS"
