name: L1JTW8.5 L3 Completed Validation

on:
  push:
    branches:
      - completed/l1jtw85-core-fixes

permissions:
  contents: write

jobs:
  l3-completed-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Record validated L3 promotion in completed README
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64

          marker = "## 2026-09-23 — validated L3 promotion integrated into completed"
          payload = ""
          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          if marker not in text:
              text += base64.b64decode(payload).decode("utf-8")
              path.write_text(text, encoding="utf-8")
          PY
          git diff --check
          if ! git diff --quiet -- README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: record validated L3 promotion integration"
            git push origin HEAD:completed/l1jtw85-core-fixes
          fi
      - name: Run Batch1-7 source contracts
        shell: bash
        run: |
          set -euo pipefail
          for N in 1 2 3 4 5 6 7; do
            echo "=== BATCH$N ==="
            python "tools/core-fix/validate_l3_batch$N.py"
          done
          echo "L3_COMPLETED_CONTRACTS=PASS"
