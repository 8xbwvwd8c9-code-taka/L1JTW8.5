name: L1JTW8.5 L3 Completed Validation

on:
  push:
    branches:
      - completed/l1jtw85-core-fixes

permissions:
  contents: write

jobs:
  l3-completed-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Merge protected L3 inventory hunks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          patches = {
              Path("recovery/normalized-src-vf/l1r/au/L1PcInventory.java"): [
                  ("var2.a(var4, var2.B()[var4] - var1.E());", "var2.a(var4, Math.max(0, var2.B()[var4] - var1.E()));"),
                  ("L1PolyMorph.a(this.i.fe(), var2.a().aP())", "L1PolyMorph.a(this.i, var2.a().aP())"),
                  ("L1PolyMorph.b(this.i.fe(), var2.a().aP())", "L1PolyMorph.b(this.i, var2.a().aP())"),
                  ("L1PolyMorph.a(var1, var2.a().aP())", "L1PolyMorph.a(this.i, var2.a().aP())"),
                  ("L1PolyMorph.b(var1, var2.a().aP())", "L1PolyMorph.b(this.i, var2.a().aP())"),
                  ("public L1ItemInstance n() {\n      int var1 = Random.a(this.a.size());", "public L1ItemInstance n() {\n      if (this.a.isEmpty()) {\n         return null;\n      }\n\n      int var1 = Random.a(this.a.size());"),
              ],
              Path("recovered-src-obf/au/g.java"): [
                  ("qn.a(i2, qn.B()[i2] - item.E());", "qn.a(i2, Math.max(0, qn.B()[i2] - item.E()));"),
                  ("ae.a(this.i.fe(), item.a().aP())", "ae.a(this.i, item.a().aP())"),
                  ("ae.b(this.i.fe(), item.a().aP())", "ae.b(this.i, item.a().aP())"),
                  ("ae.a(polyid, item.a().aP())", "ae.a(this.i, item.a().aP())"),
                  ("ae.b(polyid, item.a().aP())", "ae.b(this.i, item.a().aP())"),
                  ("public q n() {\n        int rnd = bi.i.a(this.a.size());", "public q n() {\n        if (this.a.isEmpty()) {\n            return null;\n        }\n        int rnd = bi.i.a(this.a.size());"),
              ],
          }

          for path, replacements in patches.items():
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  hits = text.count(old)
                  if hits != 1:
                      raise SystemExit(f"PATCH_GATE_FAIL {path}: expected 1 hit, got {hits}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY
          git diff --check
          if ! git diff --quiet -- recovery/normalized-src-vf/l1r/au/L1PcInventory.java recovered-src-obf/au/g.java; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add recovery/normalized-src-vf/l1r/au/L1PcInventory.java recovered-src-obf/au/g.java
            git commit -m "fix(l3): merge inventory contracts with completed hardening"
            git push origin HEAD:completed/l1jtw85-core-fixes
          fi
      - name: Run Batch1-7 source contracts
        shell: bash
        run: |
          set -euo pipefail
          for N in 1 2 3 4 5 6 7; do
            echo "=== BATCH$N ==="
            python "tools/core-fix/validate_l3_batch$N.py"
          done
          echo "L3_COMPLETED_CONTRACTS=PASS"
