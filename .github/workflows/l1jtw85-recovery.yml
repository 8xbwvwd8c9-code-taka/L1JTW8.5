name: L1JTW8.5 Recovery

on:
  push:
    branches:
      - analysis/l1jtw85-recovery
    paths:
      - ".github/workflows/l1jtw85-recovery.yml"
      - "tools/recovery/**"
      - "recovery/target_classes.txt"
      - "l1jserver2.jar"
      - "db/8.5.sql"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Audit classfile protection
        shell: bash
        run: python ./tools/recovery/audit-classfile-protection.py

      - name: Commit protection audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recovery/class_inventory.csv recovery/synthetic_members.csv recovery/jvm_signature_collisions.csv \
            recovery/field_name_collisions.csv recovery/protection_audit.json recovery/PROTECTION_AUDIT.md
          if ! git diff --cached --quiet; then
            git commit -m "research: record L1JTW8.5 classfile protection audit [skip ci]"
            git push
          fi

      - name: Export target javap
        shell: pwsh
        run: ./tools/recovery/export-target-javap.ps1

      - name: Extract DB table index
        shell: pwsh
        run: ./tools/recovery/extract-db-table-index.ps1

      - name: Download CFR
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/cfr.jar" \
            "https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar"

      - name: Decompile JAR
        shell: pwsh
        run: |
          $existing = @(Get-ChildItem -LiteralPath "./recovered-src-obf" -Recurse -File -Filter *.java -ErrorAction SilentlyContinue).Count
          if ($existing -gt 0) {
            Write-Host "DECOMPILE=SKIP_EXISTING_BASELINE"
            Write-Host "JAVA_COUNT=$existing"
          } else {
            ./tools/recovery/decompile-cfr.ps1 -CfrJar "$env:RUNNER_TEMP/cfr.jar"
          }

      - name: Keep application core only
        shell: python
        run: |
          from pathlib import Path
          import shutil

          root = Path("recovered-src-obf")
          allowed = {
              "ai","aj","ak","al","am","an","ao","ap","aq","ar","as","at",
              "au","av","aw","ax","ay","az","ba","bb","bc","bd","be","bf",
              "bg","bh","bi","bj"
          }

          for child in list(root.iterdir()):
              if child.name == "l1j":
                  for sub in list(child.iterdir()):
                      if sub.name != "server":
                          if sub.is_dir():
                              shutil.rmtree(sub)
                          else:
                              sub.unlink()
                  continue
              if child.name not in allowed:
                  if child.is_dir():
                      shutil.rmtree(child)
                  else:
                      child.unlink()

      - name: Download Vineflower
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/vineflower.jar" \
            "https://repo1.maven.org/maven2/org/vineflower/vineflower/1.12.0/vineflower-1.12.0.jar"

      - name: Decompile hard-tail with Vineflower
        shell: bash
        run: python ./tools/recovery/decompile-hard-tail-vineflower.py "$RUNNER_TEMP/vineflower.jar"

      - name: Decompile stage2 targets with Vineflower
        shell: bash
        run: python ./tools/recovery/decompile-stage2-vineflower.py "$RUNNER_TEMP/vineflower.jar"

      - name: Scan hard-tail source
        shell: bash
        run: python ./tools/recovery/scan-hard-tail.py

      - name: Build candidate recovery tree
        shell: bash
        run: python ./tools/recovery/build-candidate-stage.py

      - name: Candidate source-only full-tree compile
        shell: bash
        run: python ./tools/recovery/compile-candidate-stage.py

      - name: Write recovery summary
        shell: python
        run: |
          from pathlib import Path
          import csv
          import json
          from collections import Counter

          src = Path("recovered-src-obf")
          java = list(src.rglob("*.java"))
          javap = list(Path("recovery/javap-targets").glob("*.javap.txt"))

          with open("recovery/core_class_map.csv", encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))

          cats = Counter(r["Category"] for r in rows)
          tables = []
          db_index = Path("recovery/db_table_index.csv")
          if db_index.exists():
              with db_index.open(encoding="utf-8-sig", newline="") as f:
                  tables = list(csv.DictReader(f))

          audit = {}
          audit_path = Path("recovery/protection_audit.json")
          if audit_path.exists():
              audit = json.loads(audit_path.read_text(encoding="utf-8"))

          compile_state = {}
          compile_path = Path("recovery/candidate_full_tree_compile.json")
          if compile_path.exists():
              compile_state = json.loads(compile_path.read_text(encoding="utf-8"))

          out = [
              "# Generated Recovery Summary",
              "",
              f"- Core mapping rows: **{len(rows)}**",
              f"- Decompiled top-level Java files retained: **{len(java)}**",
              f"- Application class files: **{audit.get('application_class_files', 'UNKNOWN')}**",
              f"- Top-level classes: **{audit.get('top_level_classes', 'UNKNOWN')}**",
              f"- Inner classes: **{audit.get('inner_classes', 'UNKNOWN')}**",
              f"- Anonymous classes: **{audit.get('anonymous_classes', 'UNKNOWN')}**",
              f"- Synthetic-affected classes: **{audit.get('synthetic_affected_classes', 'UNKNOWN')}**",
              f"- Synthetic fields/methods/constructors: **{audit.get('synthetic_fields', 'UNKNOWN')} / {audit.get('synthetic_methods', 'UNKNOWN')} / {audit.get('synthetic_constructors', 'UNKNOWN')}**",
              f"- JVM return-type-only method collisions: **{audit.get('jvm_return_type_only_method_collisions', 'UNKNOWN')}**",
              f"- Candidate full-tree source compile: **{'PASS' if compile_state.get('compile_exit_code') == 0 else 'FAIL'}**",
              f"- Candidate javac exit: **{compile_state.get('compile_exit_code', 'UNKNOWN')}**",
              f"- Built application classes (normalized): **{compile_state.get('built_application_classes_normalized', 'UNKNOWN')}**",
              f"- Missing / extra application classes (normalized): **{compile_state.get('missing_application_classes_normalized', 'UNKNOWN')} / {compile_state.get('extra_application_classes_normalized', 'UNKNOWN')}**",
              f"- Target javap files: **{len(javap)}**",
              f"- DB tables indexed: **{len(tables)}**",
              "",
              "## Category counts",
              "",
              "| Category | Classes |",
              "|---|---:|",
          ]
          out += [f"| {k} | {v} |" for k, v in sorted(cats.items())]
          out += [
              "",
              "## Notes",
              "",
              "- This output preserves obfuscated package/class identities.",
              "- SourceFile mapping remains the identity authority.",
              "- No gameplay behavior is modified by this workflow.",
          ]
          Path("recovery/GENERATED_SUMMARY.md").write_text("\n".join(out) + "\n", encoding="utf-8")

      - name: Commit generated recovery artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recovery/db_table_index.csv recovery/javap-targets recovery/GENERATED_SUMMARY.md recovered-src-obf \
            recovery/class_inventory.csv recovery/synthetic_members.csv recovery/jvm_signature_collisions.csv \
            recovery/field_name_collisions.csv recovery/protection_audit.json recovery/PROTECTION_AUDIT.md \
            recovery/full_tree_compile.json recovery/FULL_TREE_COMPILE.md recovery/full_tree_javac.log \
            recovery/source_files.txt recovery/class_set_missing.txt recovery/class_set_extra.txt \
            recovery/stage_transform.json recovery/STAGE_TRANSFORM.md \
            recovery/candidate_full_tree_compile.json recovery/CANDIDATE_FULL_TREE_COMPILE.md \
            recovery/candidate_full_tree_javac.log recovery/candidate_source_files.txt \
            recovery/candidate_class_set_missing.txt recovery/candidate_class_set_extra.txt \
            recovery/candidate_class_set_missing_raw.txt recovery/candidate_class_set_extra_raw.txt \
            recovery/hard_tail_markers.csv recovery/hard_tail_files.csv recovery/java_keyword_classes.csv \
            recovery/java_keyword_references.csv recovery/hard_tail_state.json recovery/HARD_TAIL_INVENTORY.md \
            recovery/vineflower-hard-tail recovery/vineflower-stage2
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "research: generate L1JTW8.5 recovered core [skip ci]"
          git push
