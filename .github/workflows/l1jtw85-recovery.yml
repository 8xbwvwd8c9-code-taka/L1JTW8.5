name: L1JTW8.5 Recovery
# recovery-fast trigger: runtime bridge descriptor probe

on:
  push:
    branches:
      - analysis/l1jtw85-recovery
  pull_request:
    branches:
      - analysis/l1jtw85-recovery
    paths:
      - ".github/workflows/l1jtw85-recovery.yml"
      - "tools/recovery/**"
      - "recovery/target_classes.txt"
      - "l1jserver2.jar"
      - "db/8.5.sql"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l1jtw85-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protobuf-runtime-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Rebuild obfuscated Protobuf runtime reference
        shell: bash
        run: python ./tools/recovery/build-protobuf-compile-ref.py

      - name: Relocate Protobuf runtime for recovery source
        shell: bash
        run: python ./tools/recovery/relocate-protobuf-runtime.py

      - name: Download Vineflower
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/vineflower.jar" \
            "https://repo1.maven.org/maven2/org/vineflower/vineflower/1.12.0/vineflower-1.12.0.jar"

      - name: Decompile relocated Protobuf runtime
        shell: bash
        run: python ./tools/recovery/decompile-protobuf-runtime-vineflower.py "$RUNNER_TEMP/vineflower.jar"

      - name: Compile Protobuf runtime from source only
        shell: bash
        run: python ./tools/recovery/compile-protobuf-runtime-source.py

      - name: Download CFR for protobuf runtime A/B
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/cfr.jar" \
            "https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar"

      - name: Download official protobuf-java 2.5.0 sources
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/protobuf-java-2.5.0-sources.jar" \
            "https://repo1.maven.org/maven2/com/google/protobuf/protobuf-java/2.5.0/protobuf-java-2.5.0-sources.jar"

      - name: Download official protobuf-java 2.5.0 binary
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/protobuf-java-2.5.0.jar" \
            "https://repo1.maven.org/maven2/com/google/protobuf/protobuf-java/2.5.0/protobuf-java-2.5.0.jar"

      - name: Probe official protobuf-java 2.5.0 fingerprint
        shell: bash
        run: python ./tools/recovery/probe-protobuf-2.5.0-official.py "$RUNNER_TEMP/protobuf-java-2.5.0-sources.jar"

      - name: Setup Java 8 for legacy protobuf compiler probe
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Probe protobuf 2.5 source with JDK8 target 1.5
        shell: bash
        run: python ./tools/recovery/probe-protobuf-2.5.0-jdk8-target5.py "$RUNNER_TEMP/protobuf-java-2.5.0-sources.jar" "$JAVA_HOME/bin/javac"

      - name: Restore Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compare donor runtime to protobuf-java 2.5.0 binary structure
        shell: bash
        run: python ./tools/recovery/probe-protobuf-2.5.0-binary-structural.py "$RUNNER_TEMP/protobuf-java-2.5.0.jar"

      - name: Map donor protobuf classes to official 2.5 identities
        shell: bash
        run: python ./tools/recovery/map-protobuf-2.5.0-classes.py "$RUNNER_TEMP/protobuf-java-2.5.0.jar"

      - name: Map protobuf classes by SourceFile and InnerClasses tree
        shell: bash
        run: python ./tools/recovery/map-protobuf-2.5.0-inner-tree.py "$RUNNER_TEMP/protobuf-java-2.5.0.jar"

      - name: Refine protobuf mapping from stable seed
        shell: bash
        run: python ./tools/recovery/map-protobuf-2.5.0-candidates.py "$RUNNER_TEMP/protobuf-java-2.5.0.jar"

      - name: Validate and apply protobuf InnerClasses order mapping
        shell: bash
        run: python ./tools/recovery/map-protobuf-2.5.0-order.py "$RUNNER_TEMP/protobuf-java-2.5.0.jar"

      - name: Map protobuf donor members to official ABI
        shell: bash
        run: python ./tools/recovery/map-protobuf-2.5.0-members.py "$RUNNER_TEMP/protobuf-java-2.5.0.jar"

      - name: Refine protobuf member mapping by ABI and preserved names
        shell: bash
        run: python ./tools/recovery/map-protobuf-2.5.0-members-v2.py "$RUNNER_TEMP/protobuf-java-2.5.0.jar"

      - name: Validate member-table order and close protobuf ABI map
        shell: bash
        run: python ./tools/recovery/map-protobuf-2.5.0-members-v3.py

      - name: Normalize source-built protobuf 2.5 runtime to donor ABI
        shell: bash
        run: python ./tools/recovery/normalize-protobuf-2.5.0-source-built-abi.py

      - name: Validate source-built protobuf donor ABI
        shell: bash
        run: python ./tools/recovery/validate-protobuf-2.5.0-source-built-abi.py

      - name: Close donor-to-official protobuf class mapping
        shell: bash
        run: python ./tools/recovery/map-protobuf-2.5.0-closure.py "$RUNNER_TEMP/protobuf-java-2.5.0.jar"

      - name: Compare protobuf 2.5 semantic constants
        shell: bash
        run: python ./tools/recovery/probe-protobuf-2.5.0-semantic-constants.py "$RUNNER_TEMP/protobuf-java-2.5.0.jar"

      - name: Compare protobuf 2.5 opcode fingerprints
        shell: bash
        run: python ./tools/recovery/probe-protobuf-2.5.0-opcodes.py "$RUNNER_TEMP/protobuf-java-2.5.0.jar"

      - name: Compare compiler-insensitive protobuf opcode tiers
        shell: bash
        run: python ./tools/recovery/probe-protobuf-2.5.0-opcodes-tiered.py "$RUNNER_TEMP/protobuf-java-2.5.0.jar"

      - name: Refine protobuf 2.5 class mapping by reference graph
        shell: bash
        run: python ./tools/recovery/map-protobuf-2.5.0-graph.py "$RUNNER_TEMP/protobuf-java-2.5.0.jar"

      - name: Decompile relocated Protobuf runtime with CFR
        shell: bash
        run: python ./tools/recovery/decompile-protobuf-runtime-cfr.py "$RUNNER_TEMP/cfr.jar"

      - name: Compile CFR Protobuf runtime from source only
        shell: bash
        run: python ./tools/recovery/compile-protobuf-runtime-source-cfr.py

      - name: Decompile relocated Protobuf runtime with renamed CFR
        shell: bash
        run: python ./tools/recovery/decompile-protobuf-runtime-cfr-renamed.py "$RUNNER_TEMP/cfr.jar"

      - name: Compile renamed CFR Protobuf runtime from source only
        shell: bash
        run: python ./tools/recovery/compile-protobuf-runtime-source-cfr-renamed.py

      - name: Decompile relocated Protobuf runtime with flat CFR
        shell: bash
        run: python ./tools/recovery/decompile-protobuf-runtime-cfr-flat.py "$RUNNER_TEMP/cfr.jar"

      - name: Compile flat CFR Protobuf runtime from source only
        shell: bash
        run: python ./tools/recovery/compile-protobuf-runtime-source-cfr-flat.py

      - name: Print CFR protobuf runtime error contexts
        shell: bash
        run: python ./tools/recovery/print-protobuf-runtime-cfr-error-context.py

      - name: Snapshot protobuf runtime source frontier
        shell: bash
        run: python ./tools/recovery/snapshot-protobuf-runtime-frontier.py

      - name: Persist protobuf runtime frontier
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p recovery/wip/protobuf-runtime-frontier-cfr
          cp -f recovery/protobuf-runtime-src-cfr/l1rpb/p.java recovery/wip/protobuf-runtime-frontier-cfr/p.java 2>/dev/null || true
          cp -f recovery/protobuf-runtime-src-cfr/l1rpb/k.java recovery/wip/protobuf-runtime-frontier-cfr/k.java 2>/dev/null || true
          cp -f recovery/protobuf-runtime-src-cfr/l1rpb/x.java recovery/wip/protobuf-runtime-frontier-cfr/x.java 2>/dev/null || true
          cp -f recovery/protobuf-runtime-src-cfr/l1rpb/j.java recovery/wip/protobuf-runtime-frontier-cfr/j.java 2>/dev/null || true
          git add recovery/wip/protobuf-runtime-frontier recovery/wip/protobuf-runtime-frontier-cfr \
            recovery/protobuf_runtime_source_compile.json recovery/PROTOBUF_RUNTIME_SOURCE_COMPILE.md \
            recovery/protobuf_runtime_source_cfr_decompile.json recovery/protobuf_runtime_source_cfr_compile.json \
            recovery/protobuf_runtime_source_cfr_javac.log
          if git diff --cached --quiet; then
            echo "No protobuf runtime frontier changes."
          else
            git commit -m "research: persist protobuf runtime source frontier [skip ci]"
            stashed=0
            if [ -n "$(git status --porcelain)" ]; then
              git stash push --include-untracked -m "protobuf-runtime-frontier-pre-rebase"
              stashed=1
            fi
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            if [ "$stashed" -eq 1 ]; then
              git stash pop
            fi
          fi

      - name: Print runtime source experiment
        shell: bash
        run: |
          cat recovery/protobuf_runtime_source_decompile.json
          cat recovery/protobuf_runtime_source_compile.json
          cat recovery/protobuf_runtime_source_cfr_compile.json
          cat recovery/protobuf_runtime_source_cfr_renamed_compile.json
          cat recovery/protobuf_runtime_source_cfr_flat_compile.json
          cat recovery/protobuf_2_5_0_fingerprint.json
          cat recovery/protobuf_2_5_0_binary_structural_fingerprint.json

      - name: Upload protobuf runtime source experiment
        uses: actions/upload-artifact@v4
        with:
          name: protobuf-runtime-source-experiment
          path: |
            recovery/protobuf-runtime-src-vf
            recovery/protobuf_runtime_source_decompile.json
            recovery/protobuf_runtime_source_compile.json
            recovery/PROTOBUF_RUNTIME_SOURCE_COMPILE.md
            recovery/protobuf_runtime_source_javac.log
            recovery/protobuf_runtime_source_files.txt
            recovery/protobuf_runtime_source_class_set_missing.txt
            recovery/protobuf_runtime_source_class_set_extra.txt
            recovery/protobuf-runtime-src-cfr
            recovery/protobuf_runtime_source_cfr_decompile.json
            recovery/protobuf_runtime_source_cfr_compile.json
            recovery/protobuf_runtime_source_cfr_javac.log
            recovery/protobuf_runtime_source_cfr_files.txt
            recovery/protobuf-runtime-src-cfr-renamed
            recovery/protobuf_runtime_source_cfr_renamed_decompile.json
            recovery/protobuf_runtime_source_cfr_renamed_compile.json
            recovery/protobuf_runtime_source_cfr_renamed_javac.log
            recovery/protobuf_runtime_source_cfr_renamed_files.txt
            recovery/protobuf-runtime-src-cfr-flat
            recovery/protobuf_runtime_source_cfr_flat_decompile.json
            recovery/protobuf_runtime_source_cfr_flat_compile.json
            recovery/protobuf_runtime_source_cfr_flat_javac.log
            recovery/protobuf_runtime_source_cfr_flat_files.txt
          if-no-files-found: error
          retention-days: 7

  normalized-fast:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Normalized non-protobuf diagnostic compile
        shell: bash
        run: python ./tools/recovery/compile-normalized-nonproto.py

      - name: Probe donor non-Protobuf overload descriptors
        shell: bash
        run: python ./tools/recovery/probe-nonprotobuf-overload-descriptors.py

      - name: Relocate embedded Protobuf runtime
        shell: bash
        run: python ./tools/recovery/relocate-protobuf-runtime.py

      - name: Snapshot pristine relocated Protobuf runtime
        shell: bash
        run: cp -f recovery/compile-ref-protobuf-l1rpb.jar recovery/compile-ref-protobuf-l1rpb-pristine.jar

      - name: Probe final protobuf abstract obligations
        shell: bash
        run: python ./tools/recovery/probe-protobuf-final-obligations.py

      - name: Probe parser f bytecode delegates
        shell: bash
        run: python ./tools/recovery/probe-protobuf-parser-f-bytecode.py

      - name: Probe builder e bridge delegate
        shell: bash
        run: python ./tools/recovery/probe-protobuf-builder-e-bytecode.py

      - name: Probe builder interface provider map
        shell: bash
        run: python ./tools/recovery/probe-protobuf-builder-provider-map.py

      - name: Parser donor Signature restore A/B
        if: ${{ false }}
        shell: bash
        run: python ./tools/recovery/experiment-raw-protobuf-parser-class.py

      - name: Normalize protobuf protected inner visibility
        shell: bash
        run: python ./tools/recovery/normalize-protobuf-inner-visibility.py

      - name: Normalize protobuf abstract source obligations
        shell: bash
        run: python ./tools/recovery/normalize-protobuf-abstract-obligations.py

      - name: Prior parser bridge flag A/B
        if: ${{ false }}
        shell: bash
        run: python ./tools/recovery/experiment-protobuf-parser-bridge-flag.py

      - name: Snapshot compile-ref method baseline
        shell: bash
        run: python ./tools/recovery/audit-protobuf-compile-ref-method-integrity.py --snapshot

      - name: Experiment typed parser f provider alias
        shell: bash
        run: python ./tools/recovery/experiment-protobuf-parser-typed-alias.py

      - name: Experiment builder bridge synthetic flag
        shell: bash
        run: python ./tools/recovery/experiment-protobuf-builder-bridge-flag.py

      - name: Experiment typed builder e provider alias
        shell: bash
        run: python ./tools/recovery/experiment-protobuf-builder-e-typed-alias.py

      - name: Prior proven builder typed alias set A/B
        if: ${{ false }}
        shell: bash
        run: python ./tools/recovery/experiment-protobuf-builder-safe-aliases.py

      - name: Experiment current builder d typed alias
        shell: bash
        run: python ./tools/recovery/experiment-protobuf-builder-current-d-alias.py

      - name: Experiment builder d byte n typed alias
        shell: bash
        run: python ./tools/recovery/experiment-protobuf-builder-current-d-byte-n-alias.py

      - name: Experiment builder d byte int int typed alias
        shell: bash
        run: python ./tools/recovery/experiment-protobuf-builder-current-d-byte-ii-alias.py

      - name: Experiment builder d byte typed alias
        shell: bash
        run: python ./tools/recovery/experiment-protobuf-builder-current-d-byte-alias.py

      - name: Experiment builder d g n typed alias
        shell: bash
        run: python ./tools/recovery/experiment-protobuf-builder-current-d-g-n-alias.py

      - name: Experiment builder d g typed alias
        shell: bash
        run: python ./tools/recovery/experiment-protobuf-builder-current-d-g-alias.py

      - name: Experiment builder b ap typed alias
        shell: bash
        run: python ./tools/recovery/experiment-protobuf-builder-current-b-ap-alias.py

      - name: Experiment builder e ap typed alias
        shell: bash
        run: python ./tools/recovery/experiment-protobuf-builder-current-e-ap-alias.py

      - name: Experiment builder c kf object typed alias
        shell: bash
        run: python ./tools/recovery/experiment-protobuf-builder-current-c-kf-obj-alias.py

      - name: Experiment builder b kf int object typed alias
        shell: bash
        run: python ./tools/recovery/experiment-protobuf-builder-current-b-kf-int-obj-alias.py

      - name: Experiment builder f kf typed alias
        shell: bash
        run: python ./tools/recovery/experiment-protobuf-builder-current-f-kf-alias.py

      - name: Experiment builder d kf object typed alias
        shell: bash
        run: python ./tools/recovery/experiment-protobuf-builder-current-d-kf-obj-alias.py

      - name: Experiment post176 builder d h n typed alias
        shell: bash
        run: python ./tools/recovery/experiment-protobuf-builder-current-d-h-n-alias.py

      - name: Experiment builder d h typed alias
        shell: bash
        run: python ./tools/recovery/experiment-protobuf-builder-current-d-h-alias.py

      - name: Experiment post176 builder i typed alias
        shell: bash
        run: python ./tools/recovery/experiment-protobuf-builder-current-i-alias.py

      - name: Experiment post176 builder c x typed alias
        shell: bash
        run: python ./tools/recovery/experiment-protobuf-builder-current-c-x-alias.py

      - name: Experiment post176 builder j typed alias
        shell: bash
        run: python ./tools/recovery/experiment-protobuf-builder-current-j-alias.py

      - name: Audit compile-ref method integrity
        shell: bash
        run: python ./tools/recovery/audit-protobuf-compile-ref-method-integrity.py --audit

      - name: Build normalized source stage
        shell: bash
        run: python ./tools/recovery/build-normalized-stage.py

      - name: Parser typed source restore A/B
        if: ${{ false }}
        shell: bash
        run: python ./tools/recovery/experiment-raw-protobuf-parser-source.py

      - name: Normalize residual protobuf runtime imports
        shell: bash
        run: python ./tools/recovery/normalize-protobuf-runtime-imports.py

      - name: Normalize protobuf runtime type shadows
        shell: bash
        run: python ./tools/recovery/normalize-protobuf-runtime-type-shadows.py

      - name: Repair normalized protobuf builder collisions
        shell: bash
        run: python ./tools/recovery/repair-normalized-builder-collisions.py

      - name: Normalize external nested builder aliases
        shell: bash
        run: python ./tools/recovery/normalize-external-builder-alias-refs.py

      - name: Normalize non-Protobuf runtime g call shadows
        shell: bash
        run: python ./tools/recovery/normalize-nonprotobuf-runtime-g-calls.py

      - name: Normalize L1Alchemy local generics
        shell: bash
        run: python ./tools/recovery/normalize-l1alchemy-local-generics.py

      - name: Normalize remaining non-Protobuf local generics
        shell: bash
        run: python ./tools/recovery/normalize-nonprotobuf-local-generics.py

      - name: Normalize high-confidence tail local generics
        shell: bash
        run: python ./tools/recovery/normalize-nonprotobuf-tail-local-generics.py

      - name: Normalize second tail local generic batch
        shell: bash
        run: python ./tools/recovery/normalize-nonprotobuf-tail-local-generics-2.py

      - name: Normalize final raw local generic batch
        shell: bash
        run: python ./tools/recovery/normalize-nonprotobuf-tail-local-generics-3.py

      - name: Normalize non-Protobuf overload shadows
        shell: bash
        run: python ./tools/recovery/normalize-nonprotobuf-overload-shadows.py

      - name: Normalize L1Thebes local generics
        shell: bash
        run: python ./tools/recovery/normalize-l1thebes-local-generics.py

      - name: Normalize invalid non-Protobuf override annotations
        shell: bash
        run: python ./tools/recovery/normalize-nonprotobuf-override-annotations.py

      - name: Normalize L1Account Base64 compatibility
        shell: bash
        run: python ./tools/recovery/normalize-l1account-base64-compat.py

      - name: Normalize protobuf synthetic boolean accessors
        shell: bash
        run: python ./tools/recovery/normalize-protobuf-af-accessors.py

      - name: Normalize protobuf builder generic superclass
        shell: bash
        run: python ./tools/recovery/normalize-protobuf-builder-superclass.py

      - name: Normalize concrete builder synthetic source bridges
        shell: bash
        run: python ./tools/recovery/normalize-protobuf-builder-source-bridges.py

      - name: Normalize protobuf parser synthetic bridges
        shell: bash
        run: python ./tools/recovery/normalize-protobuf-parser-bridges.py

      - name: Normalize protobuf duplicate local names
        shell: bash
        run: python ./tools/recovery/normalize-protobuf-duplicate-locals.py

      - name: Compile normalized source stage
        shell: bash
        run: python ./tools/recovery/compile-normalized-stage.py

      - name: Rebuild protobuf class map against official 2.5.0
        shell: bash
        run: python ./tools/recovery/map-protobuf-2.5.0-order.py ./lib/protobuf-java-2.5.0.jar ./recovery/compile-ref-protobuf-l1rpb-pristine.jar

      - name: Audit application protobuf dependency surface
        shell: bash
        run: python ./tools/recovery/audit-application-protobuf-dependency-surface.py

      - name: Audit post-javac0 class set and hierarchy
        shell: bash
        run: python ./tools/recovery/audit-post-javac0-class-hierarchy.py

      - name: Audit generic builder class signatures
        shell: bash
        run: python ./tools/recovery/audit-generic-builder-signatures.py

      - name: Audit post-javac0 method and field ABI
        shell: bash
        run: python ./tools/recovery/audit-post-javac0-member-abi.py

      - name: Summarize normalized compile error families
        shell: bash
        run: python ./tools/recovery/summarize-normalized-stage-errors.py

      - name: Audit as/a synthetic accessor semantic parity
        shell: bash
        run: python ./tools/recovery/probe-synthetic-accessor-as-a.py

      - name: Extract current non-Protobuf errors
        shell: bash
        run: python ./tools/recovery/extract-nonprotobuf-error-details.py

      - name: Extract protobuf override conflicts
        shell: bash
        run: python ./tools/recovery/extract-protobuf-override-conflicts.py

      - name: Print normalized fast result
        shell: bash
        run: |
          cat recovery/normalized_builder_collision_transform.json
          cat recovery/normalized_external_builder_alias_refs.json
          cat recovery/nonprotobuf_runtime_g_call_normalization.json
          cat recovery/l1alchemy_local_generic_normalization.json
          cat recovery/normalized_stage_compile.json
          cat recovery/application_protobuf_dependency_surface.json
          cat recovery/normalized_stage_error_families.json
          cat recovery/protobuf_override_conflicts.json
          cat recovery/protobuf_compile_ref_method_integrity.json
          cat recovery/generic_builder_signature_audit.json
          cat recovery/post_javac0_member_abi.json

      - name: Persist authoritative normalized-fast state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          files=(
            recovery/post_javac0_member_abi.json
            recovery/POST_JAVAC0_MEMBER_ABI.md
            recovery/generic_builder_signature_audit.json
            recovery/GENERIC_BUILDER_SIGNATURE_AUDIT.md
            recovery/protobuf_compile_ref_method_baseline.json
            recovery/protobuf_compile_ref_method_integrity.json
            recovery/PROTOBUF_COMPILE_REF_METHOD_INTEGRITY.md
            recovery/normalized_stage_compile.json
            recovery/NORMALIZED_STAGE_COMPILE.md
            recovery/post_javac0_class_hierarchy.json
            recovery/POST_JAVAC0_CLASS_HIERARCHY.md
            recovery/normalized_stage_javac.log
            recovery/normalized_stage_error_families.json
            recovery/NORMALIZED_STAGE_ERROR_FAMILIES.md
            recovery/protobuf_override_conflicts.json
            recovery/PROTOBUF_OVERRIDE_CONFLICTS.md
            recovery/protobuf_final_obligation_probe.json
            recovery/PROTOBUF_FINAL_OBLIGATION_PROBE.md
            recovery/protobuf_abstract_obligation_normalization.json
            recovery/PROTOBUF_ABSTRACT_OBLIGATION_NORMALIZATION.md
            recovery/protobuf_builder_bridge_flag_experiment.json
            recovery/PROTOBUF_BUILDER_BRIDGE_FLAG_EXPERIMENT.md
            recovery/protobuf_builder_e_typed_alias_experiment.json
            recovery/PROTOBUF_BUILDER_E_TYPED_ALIAS_EXPERIMENT.md
            recovery/protobuf_builder_safe_alias_experiment.json
            recovery/PROTOBUF_BUILDER_SAFE_ALIAS_EXPERIMENT.md
            recovery/protobuf_builder_current_d_alias_experiment.json
            recovery/PROTOBUF_BUILDER_CURRENT_D_ALIAS_EXPERIMENT.md
            recovery/protobuf_builder_current_d_byte_n_alias_experiment.json
            recovery/PROTOBUF_BUILDER_CURRENT_D_BYTE_N_ALIAS_EXPERIMENT.md
            recovery/protobuf_builder_current_d_byte_ii_alias_experiment.json
            recovery/PROTOBUF_BUILDER_CURRENT_D_BYTE_II_ALIAS_EXPERIMENT.md
            recovery/protobuf_builder_current_d_byte_alias_experiment.json
            recovery/PROTOBUF_BUILDER_CURRENT_D_BYTE_ALIAS_EXPERIMENT.md
            recovery/protobuf_builder_current_d_g_n_alias_experiment.json
            recovery/PROTOBUF_BUILDER_CURRENT_D_G_N_ALIAS_EXPERIMENT.md
            recovery/protobuf_builder_current_d_g_alias_experiment.json
            recovery/PROTOBUF_BUILDER_CURRENT_D_G_ALIAS_EXPERIMENT.md
            recovery/protobuf_builder_current_b_ap_alias_experiment.json
            recovery/PROTOBUF_BUILDER_CURRENT_B_AP_ALIAS_EXPERIMENT.md
            recovery/protobuf_builder_current_e_ap_alias_experiment.json
            recovery/PROTOBUF_BUILDER_CURRENT_E_AP_ALIAS_EXPERIMENT.md
            recovery/protobuf_builder_current_c_kf_obj_alias_experiment.json
            recovery/PROTOBUF_BUILDER_CURRENT_C_KF_OBJ_ALIAS_EXPERIMENT.md
            recovery/protobuf_builder_current_b_kf_int_obj_alias_experiment.json
            recovery/PROTOBUF_BUILDER_CURRENT_B_KF_INT_OBJ_ALIAS_EXPERIMENT.md
            recovery/protobuf_builder_current_f_kf_alias_experiment.json
            recovery/PROTOBUF_BUILDER_CURRENT_F_KF_ALIAS_EXPERIMENT.md
            recovery/protobuf_builder_current_d_kf_obj_alias_experiment.json
            recovery/PROTOBUF_BUILDER_CURRENT_D_KF_OBJ_ALIAS_EXPERIMENT.md
            recovery/protobuf_builder_current_d_h_n_alias_experiment.json
            recovery/PROTOBUF_BUILDER_CURRENT_D_H_N_ALIAS_EXPERIMENT.md
            recovery/protobuf_builder_current_d_h_alias_experiment.json
            recovery/PROTOBUF_BUILDER_CURRENT_D_H_ALIAS_EXPERIMENT.md
            recovery/protobuf_builder_current_i_alias_experiment.json
            recovery/PROTOBUF_BUILDER_CURRENT_I_ALIAS_EXPERIMENT.md
            recovery/protobuf_builder_current_c_x_alias_experiment.json
            recovery/PROTOBUF_BUILDER_CURRENT_C_X_ALIAS_EXPERIMENT.md
            recovery/protobuf_builder_current_j_alias_experiment.json
            recovery/PROTOBUF_BUILDER_CURRENT_J_ALIAS_EXPERIMENT.md
            recovery/normalized_builder_source_bridge_transform.json
            recovery/NORMALIZED_BUILDER_SOURCE_BRIDGE_TRANSFORM.md
            recovery/protobuf_parser_bridge_flag_experiment.json
            recovery/PROTOBUF_PARSER_BRIDGE_FLAG_EXPERIMENT.md
            recovery/protobuf_parser_f_bytecode_probe.json
            recovery/PROTOBUF_PARSER_F_BYTECODE_PROBE.txt
            recovery/protobuf_builder_e_bytecode_probe.json
            recovery/PROTOBUF_BUILDER_E_BYTECODE_PROBE.txt
            recovery/protobuf_builder_provider_map.json
            recovery/PROTOBUF_BUILDER_PROVIDER_MAP.md
            recovery/normalized_parser_bridge_transform.json
            recovery/NORMALIZED_PARSER_BRIDGE_TRANSFORM.md
            recovery/protobuf_parser_typed_alias_experiment.json
            recovery/PROTOBUF_PARSER_TYPED_ALIAS_EXPERIMENT.md
          )

          existing=()
          for file in "${files[@]}"; do
            if [[ -e "$file" ]]; then
              existing+=("$file")
            fi
          done

          if [[ "${#existing[@]}" -eq 0 ]]; then
            echo "No normalized-fast artifacts to persist."
            exit 0
          fi

          git add -- "${existing[@]}"
          if git diff --cached --quiet; then
            echo "No normalized-fast artifact changes."
            exit 0
          fi

          git commit -m "research: persist normalized-fast state [skip ci]"

          # Normalization intentionally mutates additional tracked/generated files.
          # The authoritative artifact commit above is complete; stash the remaining
          # ephemeral working-tree changes so rebase can proceed cleanly.
          git stash push --include-untracked --quiet -m "normalized-fast-ephemeral" || true

          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  recover:
    if: github.event_name == 'push'
    needs: normalized-fast
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Audit classfile protection
        shell: bash
        run: python ./tools/recovery/audit-classfile-protection.py

      - name: Commit protection audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recovery/class_inventory.csv recovery/synthetic_members.csv recovery/java_keyword_members.csv \
            recovery/jvm_signature_collisions.csv recovery/field_name_collisions.csv \
            recovery/protection_audit.json recovery/PROTECTION_AUDIT.md
          if ! git diff --cached --quiet; then
            git commit -m "research: record L1JTW8.5 classfile protection audit [skip ci]"
            git push
          fi

      - name: Audit source identity collisions
        shell: bash
        run: python ./tools/recovery/audit-source-identity-collisions.py

      - name: Commit source identity collision audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recovery/source_identity_collisions.json recovery/SOURCE_IDENTITY_COLLISIONS.md
          if ! git diff --cached --quiet; then
            git commit -m "research: record source identity collision audit [skip ci]"
            git push
          fi

      - name: Export target javap
        shell: pwsh
        run: |
          $existing = @(Get-ChildItem -LiteralPath "./recovery/javap-targets" -File -Filter *.javap.txt -ErrorAction SilentlyContinue).Count
          if ($existing -ge 55) {
            Write-Host "TARGET_JAVAP=SKIP_EXISTING"
            Write-Host "COUNT=$existing"
          } else {
            ./tools/recovery/export-target-javap.ps1
          }

      - name: Export protobuf builder javap
        shell: pwsh
        run: |
          if ((Test-Path "./recovery/protobuf-builder-javap.txt") -and ((Get-Item "./recovery/protobuf-builder-javap.txt").Length -gt 0)) {
            Write-Host "PROTOBUF_BUILDER_JAVAP=SKIP_EXISTING"
          } else {
            ./tools/recovery/export-protobuf-builder-javap.ps1
          }

      - name: Summarize protobuf builder bytecode
        shell: bash
        run: python ./tools/recovery/summarize-protobuf-builder-javap.py

      - name: Extract DB table index
        shell: pwsh
        run: ./tools/recovery/extract-db-table-index.ps1

      - name: Download CFR
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/cfr.jar" \
            "https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar"

      - name: Decompile JAR
        shell: pwsh
        run: |
          $existing = @(Get-ChildItem -LiteralPath "./recovered-src-obf" -Recurse -File -Filter *.java -ErrorAction SilentlyContinue).Count
          if ($existing -gt 0) {
            Write-Host "DECOMPILE=SKIP_EXISTING_BASELINE"
            Write-Host "JAVA_COUNT=$existing"
          } else {
            ./tools/recovery/decompile-cfr.ps1 -CfrJar "$env:RUNNER_TEMP/cfr.jar"
          }

      - name: Keep application core only
        shell: python
        run: |
          from pathlib import Path
          import shutil

          root = Path("recovered-src-obf")
          allowed = {
              "ai","aj","ak","al","am","an","ao","ap","aq","ar","as","at",
              "au","av","aw","ax","ay","az","ba","bb","bc","bd","be","bf",
              "bg","bh","bi","bj"
          }

          for child in list(root.iterdir()):
              if child.name == "l1j":
                  for sub in list(child.iterdir()):
                      if sub.name != "server":
                          if sub.is_dir():
                              shutil.rmtree(sub)
                          else:
                              sub.unlink()
                  continue
              if child.name not in allowed:
                  if child.is_dir():
                      shutil.rmtree(child)
                  else:
                      child.unlink()

      - name: Download Vineflower
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/vineflower.jar" \
            "https://repo1.maven.org/maven2/org/vineflower/vineflower/1.12.0/vineflower-1.12.0.jar"

      - name: Decompile hard-tail with Vineflower
        shell: bash
        run: python ./tools/recovery/decompile-hard-tail-vineflower.py "$RUNNER_TEMP/vineflower.jar"

      - name: Decompile stage2 targets with Vineflower
        shell: bash
        run: python ./tools/recovery/decompile-stage2-vineflower.py "$RUNNER_TEMP/vineflower.jar"

      - name: Scan hard-tail source
        shell: bash
        run: python ./tools/recovery/scan-hard-tail.py

      - name: Build candidate recovery tree
        shell: bash
        run: python ./tools/recovery/build-candidate-stage.py

      - name: Build obfuscated Protobuf compile reference
        shell: bash
        run: python ./tools/recovery/build-protobuf-compile-ref.py

      - name: Build proto-message diagnostic compile reference
        shell: bash
        run: python ./tools/recovery/build-proto-message-compile-ref.py

      - name: Non-protobuf diagnostic compile
        shell: bash
        run: python ./tools/recovery/compile-nonproto-stage.py

      - name: Build sanitized donor reference
        shell: bash
        run: python ./tools/recovery/build-sanitized-reference.py

      - name: Normalized non-protobuf diagnostic compile
        shell: bash
        run: python ./tools/recovery/compile-normalized-nonproto.py

      - name: Relocate embedded Protobuf runtime for source recovery
        shell: bash
        run: python ./tools/recovery/relocate-protobuf-runtime.py

      - name: Export normalized protobuf runtime parent ABI
        shell: bash
        run: python ./tools/recovery/export-protobuf-runtime-parent-javap.py

      - name: Build normalized source stage
        shell: bash
        run: python ./tools/recovery/build-normalized-stage.py

      - name: Normalize residual protobuf runtime imports
        shell: bash
        run: python ./tools/recovery/normalize-protobuf-runtime-imports.py

      - name: Repair normalized protobuf builder collisions
        shell: bash
        run: python ./tools/recovery/repair-normalized-builder-collisions.py

      - name: Compile normalized source stage
        shell: bash
        run: python ./tools/recovery/compile-normalized-stage.py

      - name: Summarize normalized compile error families
        shell: bash
        run: python ./tools/recovery/summarize-normalized-stage-errors.py

      - name: Extract protobuf override conflicts
        shell: bash
        run: python ./tools/recovery/extract-protobuf-override-conflicts.py

      - name: Per-class compile triage
        shell: bash
        run: python ./tools/recovery/per-class-compile.py

      - name: Candidate source-only full-tree compile
        shell: bash
        run: python ./tools/recovery/compile-candidate-stage.py

      - name: Write recovery summary
        shell: python
        run: |
          from pathlib import Path
          import csv
          import json
          from collections import Counter

          src = Path("recovered-src-obf")
          java = list(src.rglob("*.java"))
          javap = list(Path("recovery/javap-targets").glob("*.javap.txt"))

          with open("recovery/core_class_map.csv", encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))

          cats = Counter(r["Category"] for r in rows)
          tables = []
          db_index = Path("recovery/db_table_index.csv")
          if db_index.exists():
              with db_index.open(encoding="utf-8-sig", newline="") as f:
                  tables = list(csv.DictReader(f))

          audit = {}
          audit_path = Path("recovery/protection_audit.json")
          if audit_path.exists():
              audit = json.loads(audit_path.read_text(encoding="utf-8"))

          compile_state = {}
          compile_path = Path("recovery/candidate_full_tree_compile.json")
          if compile_path.exists():
              compile_state = json.loads(compile_path.read_text(encoding="utf-8"))

          nonproto_state = {}
          nonproto_path = Path("recovery/nonproto_compile.json")
          if nonproto_path.exists():
              nonproto_state = json.loads(nonproto_path.read_text(encoding="utf-8"))

          perclass_state = {}
          perclass_path = Path("recovery/per_class_compile.json")
          if perclass_path.exists():
              perclass_state = json.loads(perclass_path.read_text(encoding="utf-8"))

          out = [
              "# Generated Recovery Summary",
              "",
              f"- Core mapping rows: **{len(rows)}**",
              f"- Decompiled top-level Java files retained: **{len(java)}**",
              f"- Application class files: **{audit.get('application_class_files', 'UNKNOWN')}**",
              f"- Top-level classes: **{audit.get('top_level_classes', 'UNKNOWN')}**",
              f"- Inner classes: **{audit.get('inner_classes', 'UNKNOWN')}**",
              f"- Anonymous classes: **{audit.get('anonymous_classes', 'UNKNOWN')}**",
              f"- Synthetic-affected classes: **{audit.get('synthetic_affected_classes', 'UNKNOWN')}**",
              f"- Synthetic fields/methods/constructors: **{audit.get('synthetic_fields', 'UNKNOWN')} / {audit.get('synthetic_methods', 'UNKNOWN')} / {audit.get('synthetic_constructors', 'UNKNOWN')}**",
              f"- JVM return-type-only method collisions: **{audit.get('jvm_return_type_only_method_collisions', 'UNKNOWN')}**",
              f"- Non-protobuf diagnostic compile: **{'PASS' if nonproto_state.get('compile_exit_code') == 0 else 'FAIL'}**",
              f"- Non-protobuf javac errors/files: **{nonproto_state.get('javac_error_headers', 'UNKNOWN')} / {nonproto_state.get('error_file_count', 'UNKNOWN')}**",
              f"- Non-protobuf built/missing/extra classes: **{nonproto_state.get('built_nonproto_application_classes_normalized', 'UNKNOWN')} / {nonproto_state.get('missing_nonproto_application_classes', 'UNKNOWN')} / {nonproto_state.get('extra_nonproto_application_classes', 'UNKNOWN')}**",
              f"- Per-class sanitized-reference compile PASS/FAIL: **{perclass_state.get('pass', 'UNKNOWN')} / {perclass_state.get('fail', 'UNKNOWN')}**",
              f"- Per-class PASS rate: **{perclass_state.get('pass_rate', 'UNKNOWN')}**",
              f"- Candidate full-tree source compile: **{'PASS' if compile_state.get('compile_exit_code') == 0 else 'FAIL'}**",
              f"- Candidate javac exit: **{compile_state.get('compile_exit_code', 'UNKNOWN')}**",
              f"- Built application classes (normalized): **{compile_state.get('built_application_classes_normalized', 'UNKNOWN')}**",
              f"- Missing / extra application classes (normalized): **{compile_state.get('missing_application_classes_normalized', 'UNKNOWN')} / {compile_state.get('extra_application_classes_normalized', 'UNKNOWN')}**",
              f"- Target javap files: **{len(javap)}**",
              f"- DB tables indexed: **{len(tables)}**",
              "",
              "## Category counts",
              "",
              "| Category | Classes |",
              "|---|---:|",
          ]
          out += [f"| {k} | {v} |" for k, v in sorted(cats.items())]
          out += [
              "",
              "## Notes",
              "",
              "- This output preserves obfuscated package/class identities.",
              "- SourceFile mapping remains the identity authority.",
              "- No gameplay behavior is modified by this workflow.",
          ]
          Path("recovery/GENERATED_SUMMARY.md").write_text("\n".join(out) + "\n", encoding="utf-8")

      - name: Commit generated recovery artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recovery/db_table_index.csv recovery/javap-targets recovery/protobuf-builder-javap.txt \
            recovery/protobuf-builder-bytecode-summary.csv recovery/PROTOBUF_BUILDER_BYTECODE_SUMMARY.md \
            recovery/GENERATED_SUMMARY.md recovered-src-obf \
            recovery/class_inventory.csv recovery/synthetic_members.csv recovery/java_keyword_members.csv \
            recovery/jvm_signature_collisions.csv \
            recovery/field_name_collisions.csv recovery/protection_audit.json recovery/PROTECTION_AUDIT.md \
            recovery/full_tree_compile.json recovery/FULL_TREE_COMPILE.md recovery/full_tree_javac.log \
            recovery/source_files.txt recovery/class_set_missing.txt recovery/class_set_extra.txt \
            recovery/stage_transform.json recovery/STAGE_TRANSFORM.md \
            recovery/candidate_full_tree_compile.json recovery/CANDIDATE_FULL_TREE_COMPILE.md \
            recovery/candidate_full_tree_javac.log recovery/candidate_source_files.txt \
            recovery/candidate_class_set_missing.txt recovery/candidate_class_set_extra.txt \
            recovery/candidate_class_set_missing_raw.txt recovery/candidate_class_set_extra_raw.txt \
            recovery/hard_tail_markers.csv recovery/hard_tail_files.csv recovery/java_keyword_classes.csv \
            recovery/java_keyword_references.csv recovery/hard_tail_state.json recovery/HARD_TAIL_INVENTORY.md \
            recovery/vineflower-hard-tail recovery/vineflower-stage2 \
            recovery/compile-ref-protobuf-obf.jar recovery/compile_ref_protobuf_obf.json \
            recovery/COMPILE_REF_PROTOBUF_OBF.md \
            recovery/compile-ref-proto-messages.jar recovery/compile_ref_proto_messages.json \
            recovery/COMPILE_REF_PROTO_MESSAGES.md recovery/nonproto_compile.json \
            recovery/NONPROTO_COMPILE.md recovery/nonproto_javac.log recovery/nonproto_source_files.txt \
            recovery/nonproto_class_set_missing.txt recovery/nonproto_class_set_extra.txt \
            recovery/l1jserver2-sanitized-ref.jar recovery/sanitized_ref.json recovery/SANITIZED_REF.md \
            recovery/per_class_compile.csv recovery/per_class_compile.json recovery/PER_CLASS_COMPILE.md \
            recovery/per_class_failures.log \
            recovery/normalized_nonproto_compile.json recovery/NORMALIZED_NONPROTO_COMPILE.md \
            recovery/normalized_nonproto_javac.log recovery/normalized_nonproto_source_files.txt \
            recovery/compile-ref-protobuf-l1rpb.jar recovery/compile_ref_protobuf_l1rpb.json \
            recovery/COMPILE_REF_PROTOBUF_L1RPB.md recovery/normalized_stage_transform.json \
            recovery/NORMALIZED_STAGE_TRANSFORM.md recovery/normalized_stage_compile.json \
            recovery/NORMALIZED_STAGE_COMPILE.md recovery/normalized_stage_javac.log \
            recovery/normalized_stage_source_files.txt \
            recovery/normalized_builder_collision_transform.json \
            recovery/NORMALIZED_BUILDER_COLLISION_TRANSFORM.md \
            recovery/normalized_parser_bridge_transform.json \
            recovery/NORMALIZED_PARSER_BRIDGE_TRANSFORM.md \
            recovery/normalized_stage_error_families.json \
            recovery/NORMALIZED_STAGE_ERROR_FAMILIES.md \
            recovery/synthetic_accessor_as_a_probe.json \
            recovery/SYNTHETIC_ACCESSOR_AS_A_PROBE.md \
            recovery/protobuf_override_conflicts.json \
            recovery/PROTOBUF_OVERRIDE_CONFLICTS.md
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "research: generate L1JTW8.5 recovered core [skip ci]"
          git push
