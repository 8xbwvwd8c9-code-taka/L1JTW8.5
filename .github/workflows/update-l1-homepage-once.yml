name: Update L1 homepage completion once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-l1-homepage-once.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace stale L1 checkpoint only
        shell: bash
        env:
          L1_STATUS_B64: ""
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path("README.md")
          s = p.read_text(encoding="utf-8")
          start = "### 最新 L1 修復進度（2026-09-22 checkpoint）"
          end = "### 支線整理規則"
          if start not in s:
              raise SystemExit("L1 homepage start anchor missing")
          if end not in s:
              raise SystemExit("L1 homepage end anchor missing")
          a = s.index(start)
          b = s.index(end, a)
          replacement = base64.b64decode(os.environ["L1_STATUS_B64"]).decode("utf-8")
          p.write_text(s[:a] + replacement + s[b:], encoding="utf-8")
          PY

      - name: Commit homepage update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README_NO_CHANGE=PASS"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: mark L1 repair lane complete"
          git push origin HEAD:main
