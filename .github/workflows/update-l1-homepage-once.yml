name: Fix L1 homepage typo once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-l1-homepage-once.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix exact homepage typo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          s=p.read_text(encoding='utf-8')
          old='進入兞他 tier/lane'
          new='進入其他 tier/lane'
          if old not in s:
              raise SystemExit('exact typo anchor missing')
          if s.count(old) != 1:
              raise SystemExit('unexpected typo count')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit typo fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: fix L1 completion wording"
          git push origin HEAD:main
