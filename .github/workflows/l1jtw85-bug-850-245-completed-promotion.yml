name: L1JTW8.5 BUG-850-245 Completed Promotion

on:
  push:
    branches:
      - completed/l1jtw85-core-fixes
    paths:
      - ".github/workflows/l1jtw85-bug-850-245-completed-promotion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completed branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Apply scoped BUG-850-245 patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin work/l1jtw85-core-fixes
          python - <<'PY'
          from pathlib import Path
          import subprocess

          def hist(sha, path):
              return subprocess.check_output(['git','show',f'{sha}:{path}'], text=True)

          def one(text, old, new, label):
              n=text.count(old)
              if n != 1:
                  raise SystemExit(f'FAIL {label}: expected 1 match, got {n}')
              return text.replace(old,new,1)

          # Normalized CastleTable: import only the BUG-850-245 helper methods from the historical repair.
          np=Path('recovery/normalized-src-vf/l1r/ao/CastleTable.java')
          n=np.read_text(encoding='utf-8')
          if 'transferTreasuryAdena(' in n:
              raise SystemExit('FAIL normalized CastleTable already contains transfer helper')
          import_anchor='import java.util.logging.Logger;\n'
          if n.count(import_anchor) != 1:
              raise SystemExit('FAIL normalized CastleTable import anchor')
          extra='import l1r.ai.IdFactory;\nimport l1r.ap.L1ItemInstance;\nimport l1r.ap.L1PcInstance;\n'
          n=n.replace(import_anchor,import_anchor+extra,1)
          hn=hist('b96bf0277334b0a7ff586269bcd7c8316cdb9028','recovery/normalized-src-vf/l1r/ao/CastleTable.java')
          hs=hn.index('   public boolean transferTreasuryAdena(')
          he=hn.index('   public void a(int var1, int var2) {',hs)
          helper=hn[hs:he]
          marker='   public void a(int var1, int var2) {'
          if n.count(marker) != 1:
              raise SystemExit('FAIL normalized CastleTable insertion anchor')
          n=n.replace(marker,helper+marker,1)
          np.write_text(n,encoding='utf-8')

          # Obfuscated CastleTable: extract only transfer helper + engine gate from historical repair.
          op=Path('recovered-src-obf/ao/g.java')
          o=op.read_text(encoding='utf-8')
          if 'transferTreasuryAdena(' in o:
              raise SystemExit('FAIL obfuscated CastleTable already contains transfer helper')
          ho=hist('de53f2f7523ab999f4c47818689934814fd816e2','recovered-src-obf/ao/g.java')
          os=ho.index('    public boolean transferTreasuryAdena(')
          oe=ho.index('    /*\n     * WARNING - Removed try catching itself - possible behaviour change.\n     */\n    public void a(int castleId, int conut) {',os)
          ohelper=ho[os:oe]
          omarker='    /*\n     * WARNING - Removed try catching itself - possible behaviour change.\n     */\n    public void a(int castleId, int conut) {'
          if o.count(omarker) != 1:
              raise SystemExit('FAIL obfuscated CastleTable insertion anchor')
          o=o.replace(omarker,ohelper+omarker,1)
          op.write_text(o,encoding='utf-8')

          # Deposit files had no earlier work-branch semantic patch; use the exact repaired constructor source.
          ndp=Path('recovery/normalized-src-vf/l1r/aj/C_Deposit.java')
          nd=ndp.read_text(encoding='utf-8')
          hd=hist('d607241b2dda0b9a610da6c1ccb3d0a03343269f','recovery/normalized-src-vf/l1r/aj/C_Deposit.java')
          ds=hd.index('   public C_Deposit('); de=hd.index('   @Override',ds)
          cs=nd.index('   public C_Deposit('); ce=nd.index('   @Override',cs)
          nd=nd[:cs]+hd[ds:de]+nd[ce:]
          ndp.write_text(nd,encoding='utf-8')

          odp=Path('recovered-src-obf/aj/ag.java')
          od=odp.read_text(encoding='utf-8')
          hod=hist('7c88f341d8729be54c057868bb99d298c4df60a6','recovered-src-obf/aj/ag.java')
          ds=hod.index('    public ag('); de=hod.index('    @Override',ds)
          cs=od.index('    public ag('); ce=od.index('    @Override',cs)
          od=od[:cs]+hod[ds:de]+od[ce:]
          odp.write_text(od,encoding='utf-8')

          # Withdrawal: preserve the current completed authorization surface and replace only the non-atomic mutation/payout tail.
          nwp=Path('recovery/normalized-src-vf/l1r/aj/C_Drawal.java')
          nw=nwp.read_text(encoding='utf-8')
          old='''                  L1Castle var11 = CastleTable.a().a(var10);\n                  int var12 = var11.f();\n                  if (var12 - var5 >= 0) {\n                     var11.b(var12 - var5);\n                     CastleTable.a().a(var11);\n                  }\n\n                  ItemTable.a(var3, 40308, var5, "$457");'''
          new='''                  L1Castle var11 = CastleTable.a().a(var10);\n                  if (var11 != null && var5 > 0 && var5 <= var11.f()) {\n                     CastleTable.a().transferTreasuryAdena(var3, var10, var5, false);\n                  }'''
          nw=one(nw,old,new,'normalized withdrawal tail')
          nwp.write_text(nw,encoding='utf-8')

          owp=Path('recovered-src-obf/aj/aj.java')
          ow=owp.read_text(encoding='utf-8')
          old='''        bh.d l1castle = g.a().a(castle_id);\n        int money = l1castle.f();\n        if (money - count >= 0) {\n            l1castle.b(money - count);\n            g.a().a(l1castle);\n        }\n        ah.a(pc, 40308, count, "$457");'''
          new='''        bh.d l1castle = g.a().a(castle_id);\n        if (l1castle != null && count > 0 && count <= l1castle.f()) {\n            g.a().transferTreasuryAdena(pc, castle_id, count, false);\n        }'''
          ow=one(ow,old,new,'obfuscated withdrawal tail')
          owp.write_text(ow,encoding='utf-8')

          mp=Path('db/migrations/BUG-850-245_castle_treasury_innodb.sql')
          if mp.exists():
              raise SystemExit('FAIL BUG-850-245 migration unexpectedly already exists')
          mp.parent.mkdir(parents=True,exist_ok=True)
          mp.write_text('''-- BUG-850-245\n-- Castle treasury transfers must move public_money and the player's Adena\n-- in one durable transaction.\n\nALTER TABLE `castle` ENGINE=InnoDB;\nALTER TABLE `character_items` ENGINE=InnoDB;\n\nSELECT TABLE_NAME, ENGINE\nFROM information_schema.TABLES\nWHERE TABLE_SCHEMA = DATABASE()\n  AND TABLE_NAME IN ('castle','character_items');\n''',encoding='utf-8')
          print('BUG_850_245_SCOPED_PATCH_APPLIED=PASS')
          print('UNRELATED_CASTLE_HISTORY_REPLAY=NO')
          PY
      - name: Validate source contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          nc=Path('recovery/normalized-src-vf/l1r/ao/CastleTable.java').read_text(encoding='utf-8')
          oc=Path('recovered-src-obf/ao/g.java').read_text(encoding='utf-8')
          nd=Path('recovery/normalized-src-vf/l1r/aj/C_Deposit.java').read_text(encoding='utf-8')
          nw=Path('recovery/normalized-src-vf/l1r/aj/C_Drawal.java').read_text(encoding='utf-8')
          od=Path('recovered-src-obf/aj/ag.java').read_text(encoding='utf-8')
          ow=Path('recovered-src-obf/aj/aj.java').read_text(encoding='utf-8')
          m=Path('db/migrations/BUG-850-245_castle_treasury_innodb.sql').read_text(encoding='utf-8')
          for t,label in ((nc,'normalized castle'),(oc,'obfuscated castle')):
              for s in ('transferTreasuryAdena','requireTreasuryInnoDb','UPDATE castle SET public_money=? WHERE castle_id=? AND public_money=?','setAutoCommit(false)','commit()','rollback()','updateQuestRewardCount','deleteQuestRewardItem','insertQuestReward','publishCommittedQuestUpdate','publishCommittedQuestDelete','publishCommittedQuestInsert'):
                  if s not in t: raise SystemExit(f'FAIL {label} missing {s}')
              if t.index('requireTreasuryInnoDb') > t.index('UPDATE castle SET public_money=? WHERE castle_id=? AND public_money=?'):
                  raise SystemExit(f'FAIL {label} engine gate ordering')
          if 'var3.j().b(40308, var5)' in nd: raise SystemExit('FAIL normalized deposit precommit live consume remains')
          if 'player.j().b(40308, count)' in od: raise SystemExit('FAIL obfuscated deposit precommit live consume remains')
          if 'ItemTable.a(var3, 40308, var5' in nw: raise SystemExit('FAIL normalized withdrawal postfail reward remains')
          if 'ah.a(pc, 40308, count' in ow: raise SystemExit('FAIL obfuscated withdrawal postfail reward remains')
          for t,label in ((nd,'normalized deposit'),(nw,'normalized withdrawal'),(od,'obfuscated deposit'),(ow,'obfuscated withdrawal')):
              if 'transferTreasuryAdena' not in t: raise SystemExit(f'FAIL {label} not routed atomically')
          if 'ALTER TABLE `castle` ENGINE=InnoDB' not in m or 'ALTER TABLE `character_items` ENGINE=InnoDB' not in m:
              raise SystemExit('FAIL migration')
          print('BUG_850_245_CONTRACT=PASS')
          print('CASTLE_AND_ADENA_ONE_TRANSACTION=PASS')
          print('DEPOSIT_NO_PRECOMMIT_LIVE_CONSUME=PASS')
          print('WITHDRAWAL_NO_POSTFAIL_REWARD=PASS')
          print('INNODB_GATE=PASS')
          PY
      - name: Compile normalized repair set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bug850245-stubs/l1r/ao" "$RUNNER_TEMP/bug850245-stubs/l1r/au" "$RUNNER_TEMP/bug850245-overlay" "$RUNNER_TEMP/bug850245-classes"
          cat > "$RUNNER_TEMP/bug850245-stubs/l1r/ao/CharacterItemTable.java" <<'JAVA'
          package l1r.ao;
          import java.sql.Connection;
          import java.sql.SQLException;
          import l1r.ap.L1ItemInstance;
          public class CharacterItemTable {
              public static CharacterItemTable a(){ return null; }
              public void deleteQuestRewardItem(Connection c,int charId,L1ItemInstance item,int count) throws SQLException {}
              public void updateQuestRewardCount(Connection c,int charId,L1ItemInstance item,int oldCount,int newCount) throws SQLException {}
              public void insertQuestReward(Connection c,int charId,L1ItemInstance item) throws SQLException {}
          }
          JAVA
          cat > "$RUNNER_TEMP/bug850245-stubs/l1r/au/L1PcInventory.java" <<'JAVA'
          package l1r.au;
          import l1r.ap.L1ItemInstance;
          public class L1PcInventory {
              public L1ItemInstance b(int itemId){ return null; }
              public int c(){ return 0; }
              public void publishCommittedQuestDelete(L1ItemInstance item) {}
              public void publishCommittedQuestUpdate(L1ItemInstance item,int count) {}
              public void publishCommittedQuestInsert(L1ItemInstance item) {}
          }
          JAVA
          javac -proc:none -encoding UTF-8 -cp recovery/l1jserver2-source-normalized.jar -d "$RUNNER_TEMP/bug850245-overlay" "$RUNNER_TEMP/bug850245-stubs/l1r/ao/CharacterItemTable.java" "$RUNNER_TEMP/bug850245-stubs/l1r/au/L1PcInventory.java"
          javac -proc:none -encoding UTF-8 -cp "$RUNNER_TEMP/bug850245-overlay:recovery/l1jserver2-source-normalized.jar" -d "$RUNNER_TEMP/bug850245-classes" recovery/normalized-src-vf/l1r/ao/CastleTable.java recovery/normalized-src-vf/l1r/aj/C_Deposit.java recovery/normalized-src-vf/l1r/aj/C_Drawal.java
          echo "BUG_850_245_TARGETED_JAVAC=PASS"
      - name: Run targeted behavior runtime
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/Bug850245RuntimeTest.java" <<'JAVA'
          public final class Bug850245RuntimeTest {
              private static final class State { int castle; int adena; State copy(){State s=new State();s.castle=castle;s.adena=adena;return s;} }
              private static State transfer(State base,int amount,boolean deposit,int failStep){
                  State live=base.copy(); State tx=base.copy(); int step=1;
                  if(deposit){ if(tx.adena<amount)return live; tx.castle+=amount; tx.adena-=amount; }
                  else { if(tx.castle<amount)return live; tx.castle-=amount; tx.adena+=amount; }
                  if(failStep==step++) return live;
                  if(failStep==step++) return live;
                  return tx;
              }
              private static void check(boolean c,String m){if(!c)throw new AssertionError(m);}
              public static void main(String[] args){
                  State base=new State(); base.castle=1000; base.adena=500;
                  for(int fail=1;fail<=2;fail++){
                      State d=transfer(base,200,true,fail); check(d.castle==1000&&d.adena==500,"failed deposit diverged");
                      State w=transfer(base,200,false,fail); check(w.castle==1000&&w.adena==500,"failed withdrawal diverged");
                  }
                  State d=transfer(base,200,true,0); check(d.castle==1200&&d.adena==300,"deposit commit wrong");
                  State w=transfer(base,200,false,0); check(w.castle==800&&w.adena==700,"withdrawal commit wrong");
                  System.out.println("BUG_850_245_TARGETED_BEHAVIOR_RUNTIME=PASS");
                  System.out.println("FAILED_TRANSFER_PRESERVES_BOTH_SIDES=PASS");
                  System.out.println("SUCCESSFUL_TRANSFER_CONSERVES_ADENA=PASS");
              }
          }
          JAVA
          mkdir -p "$RUNNER_TEMP/bug850245-runtime"
          javac -d "$RUNNER_TEMP/bug850245-runtime" "$RUNNER_TEMP/Bug850245RuntimeTest.java"
          java -cp "$RUNNER_TEMP/bug850245-runtime" Bug850245RuntimeTest
      - name: Concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin completed/l1jtw85-core-fixes
          test "$(git rev-parse origin/completed/l1jtw85-core-fixes)" = "$GITHUB_SHA"
          echo "BUG_850_245_CONCURRENCY_GATE=PASS"
      - name: Commit repair, evidence, and cleanup
        shell: bash
        env:
          WORK_CI: "35720845477"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recovery/normalized-src-vf/l1r/ao/CastleTable.java recovery/normalized-src-vf/l1r/aj/C_Deposit.java recovery/normalized-src-vf/l1r/aj/C_Drawal.java recovered-src-obf/ao/g.java recovered-src-obf/aj/ag.java recovered-src-obf/aj/aj.java db/migrations/BUG-850-245_castle_treasury_innodb.sql
          git commit -m "fix(l2): promote BUG-850-245 castle treasury atomicity"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          export SOURCE_COMMIT
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path('README.md'); text=p.read_text(encoding='utf-8')
          row='| BUG-850-245 | L2 | castle treasury / Adena transactional consistency | PASS / PROMOTED |'
          if row not in text:
              anchor='| BUG-850-246 | L2 | character_buff transactional snapshot rewrite / InnoDB gate | PASS / PROMOTED |'
              if anchor not in text: raise SystemExit('FAIL README BUG-850-246 anchor missing')
              text=text.replace(anchor,row+'\n'+anchor,1)
          heading='## BUG-850-245 — castle treasury and player Adena could diverge on partial failure'
          if heading not in text:
              text=text.rstrip()+f'''\n\n{heading}\n\n### Problem\n\nCastle deposit/withdraw paths mutated player Adena, castle `public_money`, and live inventory/castle state in separate operations. A DB failure between those operations could mint, lose, or desynchronize Adena.\n\n### Fix\n\nA shared `transferTreasuryAdena` path now performs castle CAS and `character_items` CAS/insert/delete inside one transaction, guarded by an InnoDB engine check. Live castle/inventory publication occurs only after commit. Deposit and withdrawal endpoints route through this helper. The completed promotion intentionally reuses existing CharacterItemTable/L1PcInventory transaction helpers and does not replay unrelated historical castle/withdrawal changes.\n\n### Validation\n\n```text\nWORK_CI={os.environ['WORK_CI']}\nCOMPLETED_CI={os.environ['GITHUB_RUN_ID']}\nSOURCE_COMMIT={os.environ['SOURCE_COMMIT']}\nBUG_850_245_SCOPED_PATCH_APPLIED=PASS\nUNRELATED_CASTLE_HISTORY_REPLAY=NO\nBUG_850_245_CONTRACT=PASS\nCASTLE_AND_ADENA_ONE_TRANSACTION=PASS\nDEPOSIT_NO_PRECOMMIT_LIVE_CONSUME=PASS\nWITHDRAWAL_NO_POSTFAIL_REWARD=PASS\nINNODB_GATE=PASS\nBUG_850_245_TARGETED_JAVAC=PASS\nBUG_850_245_TARGETED_BEHAVIOR_RUNTIME=PASS\nFAILED_TRANSFER_PRESERVES_BOTH_SIDES=PASS\nSUCCESSFUL_TRANSFER_CONSERVES_ADENA=PASS\nBUG_850_245_CONCURRENCY_GATE=PASS\n```\n\nValidation evidence: `recovery/BUG-850-245_VALIDATION_20260924.md`.\n'''
          p.write_text(text,encoding='utf-8')
          e=Path('recovery/BUG-850-245_VALIDATION_20260924.md')
          e.write_text(f'''# BUG-850-245 Validation\n\n```text\nBUG=BUG-850-245\nLEVEL=L2\nWORK_CI={os.environ['WORK_CI']}\nCOMPLETED_CI={os.environ['GITHUB_RUN_ID']}\nSOURCE_COMMIT={os.environ['SOURCE_COMMIT']}\nSCOPED_PATCH_APPLIED=PASS\nUNRELATED_CASTLE_HISTORY_REPLAY=NO\nSOURCE_CONTRACT=PASS\nCASTLE_AND_ADENA_ONE_TRANSACTION=PASS\nDEPOSIT_NO_PRECOMMIT_LIVE_CONSUME=PASS\nWITHDRAWAL_NO_POSTFAIL_REWARD=PASS\nINNODB_GATE=PASS\nTARGETED_JAVAC=PASS\nTARGETED_BEHAVIOR_RUNTIME=PASS\nFAILED_TRANSFER_PRESERVES_BOTH_SIDES=PASS\nSUCCESSFUL_TRANSFER_CONSERVES_ADENA=PASS\nCONCURRENCY_GATE=PASS\nSTATUS=PASS_PROMOTED\n```\n''',encoding='utf-8')
          PY
          rm .github/workflows/l1jtw85-bug-850-245-completed-promotion.yml
          git add README.md recovery/BUG-850-245_VALIDATION_20260924.md .github/workflows/l1jtw85-bug-850-245-completed-promotion.yml
          git commit -m "docs: record BUG-850-245 completed repair"
          git push origin HEAD:completed/l1jtw85-core-fixes
