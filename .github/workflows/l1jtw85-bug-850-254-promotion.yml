          public final class Bug850254RuntimeTest {
              private static final class State { int liveWeek; int dbWeek; int schedules; }
              private static void reset(State s, boolean deleteOk) {
                  try {
                      if (!deleteOk) return;
                      s.dbWeek = 0;
                      s.liveWeek = 0;
                  } finally {
                      s.schedules++;
                  }
              }
              private static void check(boolean c,String m){if(!c)throw new AssertionError(m);}
              public static void main(String[] args) {
                  State fail=new State(); fail.liveWeek=7; fail.dbWeek=7; reset(fail,false);
                  check(fail.liveWeek==7 && fail.dbWeek==7,"failed delete changed weekly state");
                  check(fail.schedules==1,"failed reset lost next schedule");
