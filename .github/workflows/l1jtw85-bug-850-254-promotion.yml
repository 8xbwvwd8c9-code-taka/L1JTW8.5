                  State fail=new State(); fail.liveWeek=7; fail.dbWeek=7; reset(fail,false);
                  check(fail.liveWeek==7 && fail.dbWeek==7,"failed delete changed weekly state");
                  check(fail.schedules==1,"failed reset lost next schedule");
                  State ok=new State(); ok.liveWeek=7; ok.dbWeek=7; reset(ok,true);
                  check(ok.liveWeek==0 && ok.dbWeek==0,"successful reset did not clear weekly state");
