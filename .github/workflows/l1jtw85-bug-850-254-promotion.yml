          ol=req(o_week,'for (u pc : aq.aq.a().c())','obfuscated weekly player loop')
          if og>ol: raise SystemExit('FAIL obfuscated live reset starts before delete gate')
          ns=req(n_week,'GeneralThreadPool.a().a(CurrentTimeReseter.this.new L1R_c(), 604800000L);','normalized weekly reschedule')
