name: L1JTW8.5 Fast Dev

on:
  push:
    branches:
      - work/l1jtw85-fast-dev-build
    paths:
      - 'tools/850/**'
      - 'core/**'
      - 'build850.ps1'
      - 'build850.cmd'
      - 'docs/superpowers/specs/2026-09-24-l1jtw85-fast-dev-build-design.md'
      - 'docs/superpowers/plans/2026-09-24-l1jtw85-fast-dev-build.md'
      - '.github/workflows/850-fast-dev.yml'
  workflow_dispatch:

jobs:
  fast-dev-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
      - name: Run package-map contracts
        run: python -m unittest -v tools/850/tests/test_package_map.py
      - name: Run core bootstrap contracts
        run: python -m unittest -v tools/850/tests/test_bootstrap_core.py
      - name: Run repair registry contracts
        run: python -m unittest -v tools/850/tests/test_repair_registry.py
      - name: Run dev-base contracts
        run: python -m unittest -v tools/850/tests/test_dev_base.py
      - name: Run incremental compiler contracts
        run: python -m unittest -v tools/850/tests/test_incremental.py
      - name: Run pinned baseline seed contracts
        run: python -m unittest -v tools/850/tests/test_seed_authority.py
      - name: Run pinned authority cache contracts
        run: python -m unittest -v tools/850/tests/test_authority_cache.py
      - name: Run completed repair overlay compiler contracts
        run: python -m unittest -v tools/850/tests/test_completed_overlay.py
      - name: Run automatic bootstrap contracts
        run: python -m unittest -v tools/850/tests/test_ensure_dev.py
      - name: Run frontend contracts
        run: python -m unittest -v tools/850/tests/test_frontend_contract.py
      - name: Run pack contracts
        run: python -m unittest -v tools/850/tests/test_pack_dev.py
      - name: Run real migration contracts
        run: python -m unittest -v tools/850/tests/test_real_migration.py
      - name: Run real core materialization contracts
        run: python -m unittest -v tools/850/tests/test_migrate_core.py
      - name: Run real automatic bootstrap integration
        shell: bash
        run: |
          set -euo pipefail
          original_sha="$(sha256sum l1jserver2.jar | awk '{print toupper($1)}')"
          test "$original_sha" = "8E91712FC9EB4AD07E064723CF0FC02AC9A01063231EFD150B90927F04660814"
          rm -rf .build850 core
          python tools/850/bootstrap/ensure_dev.py
          test -f .build850/cache/850-dev-base.jar
          test -f .build850/cache/850-dev-base.key.json
          test -f .build850/state.json
          test -f .build850/dependency-index.json
          test -f core/PINNED_AUTHORITY.json
          test "$(find core/src -type f -name '*.java' | wc -l)" -eq 788
          python tools/850/fast_dev.py
          test "$(sha256sum l1jserver2.jar | awk '{print toupper($1)}')" = "$original_sha"
