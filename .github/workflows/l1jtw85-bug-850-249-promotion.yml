name: L1JTW8.5 BUG-850-249 Completed Promotion

on:
  push:
    branches:
      - completed/l1jtw85-core-fixes
    paths:
      - ".github/workflows/l1jtw85-bug-850-249-promotion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exact-history-validate-promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completed branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Validate historical patch manifests
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin work/l1jtw85-core-fixes completed/l1jtw85-core-fixes
          python - <<'PY'
          import subprocess
          expected = {
              '8025995127b613943b68f77bc6c8a8529219f2a7': ['recovery/normalized-src-vf/l1r/ao/PetTable.java'],
              '5ead04e6abb2e531ac844b55bb3c4a9d9e3e5a2d': ['recovered-src-obf/ao/aw.java'],
              '2bb6274aacd2bd0c0b9a99d0cb214ef0f5758d45': ['recovery/normalized-src-vf/l1r/ap/L1PetInstance.java'],
              'd7aab0ee198e1968cc837b71f1680bf6a3379851': ['recovered-src-obf/ap/v.java'],
          }
          for sha, want in expected.items():
              out = subprocess.check_output(['git','show','--pretty=format:','--name-only',sha], text=True)
              got = [x for x in out.splitlines() if x.strip()]
              if got != want:
                  raise SystemExit(f'FAIL manifest {sha}: {got} != {want}')
          print('BUG_850_249_HISTORICAL_MANIFESTS=PASS')
          PY

      - name: Apply exact historical BUG-850-249 chain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bug850249-baseline/l1r/ao" "$RUNNER_TEMP/bug850249-baseline/l1r/ap"
          cp recovery/normalized-src-vf/l1r/ao/PetTable.java "$RUNNER_TEMP/bug850249-baseline/l1r/ao/PetTable.java"
          cp recovery/normalized-src-vf/l1r/ap/L1PetInstance.java "$RUNNER_TEMP/bug850249-baseline/l1r/ap/L1PetInstance.java"
          git cherry-pick -n \
            8025995127b613943b68f77bc6c8a8529219f2a7 \
            5ead04e6abb2e531ac844b55bb3c4a9d9e3e5a2d \
            2bb6274aacd2bd0c0b9a99d0cb214ef0f5758d45 \
            d7aab0ee198e1968cc837b71f1680bf6a3379851
          python - <<'PY'
          import subprocess
          want = sorted([
              'recovery/normalized-src-vf/l1r/ao/PetTable.java',
              'recovered-src-obf/ao/aw.java',
              'recovery/normalized-src-vf/l1r/ap/L1PetInstance.java',
              'recovered-src-obf/ap/v.java',
          ])
          got = sorted(x for x in subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines() if x)
          if got != want:
              raise SystemExit(f'FAIL staged paths: {got} != {want}')
          print('BUG_850_249_EXACT_PATCH_CHAIN=PASS')
          print('UNRELATED_SOURCE_REPLAY=NO')
          PY

      - name: Validate source contract
        shell: bash
        run: |
          set -euo pipefail
          git show origin/work/l1jtw85-core-fixes:tools/core-fix/validate_bug_850_249.py > "$RUNNER_TEMP/validate_bug_850_249.py"
          python "$RUNNER_TEMP/validate_bug_850_249.py"

      - name: Compile normalized repair set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bug850249-baseline-classes" "$RUNNER_TEMP/bug850249-current-classes"

          javac -proc:none -encoding UTF-8 -cp recovery/l1jserver2-source-normalized.jar \
            -d "$RUNNER_TEMP/bug850249-baseline-classes" \
            "$RUNNER_TEMP/bug850249-baseline/l1r/ao/PetTable.java"
          javac -proc:none -encoding UTF-8 -cp recovery/l1jserver2-source-normalized.jar \
            -d "$RUNNER_TEMP/bug850249-current-classes" \
            recovery/normalized-src-vf/l1r/ao/PetTable.java
          echo "BUG_850_249_PETTABLE_JAVAC=PASS"

          set +e
          javac -proc:none -encoding UTF-8 \
            -cp "$RUNNER_TEMP/bug850249-baseline-classes:recovery/l1jserver2-source-normalized.jar" \
            -d "$RUNNER_TEMP/bug850249-baseline-classes" \
            "$RUNNER_TEMP/bug850249-baseline/l1r/ap/L1PetInstance.java" \
            2> "$RUNNER_TEMP/bug850249-baseline.err"
          BASE_RC=$?
          javac -proc:none -encoding UTF-8 \
            -cp "$RUNNER_TEMP/bug850249-current-classes:recovery/l1jserver2-source-normalized.jar" \
            -d "$RUNNER_TEMP/bug850249-current-classes" \
            recovery/normalized-src-vf/l1r/ap/L1PetInstance.java \
            2> "$RUNNER_TEMP/bug850249-current.err"
          CUR_RC=$?
          set -e

          grep 'error:' "$RUNNER_TEMP/bug850249-baseline.err" | sed -E 's#^.*error:#error:#' > "$RUNNER_TEMP/bug850249-baseline.sig" || true
          grep 'error:' "$RUNNER_TEMP/bug850249-current.err" | sed -E 's#^.*error:#error:#' > "$RUNNER_TEMP/bug850249-current.sig" || true
          diff -u "$RUNNER_TEMP/bug850249-baseline.sig" "$RUNNER_TEMP/bug850249-current.sig"
          echo "BASELINE_JAVAC_RC=$BASE_RC"
          echo "CURRENT_JAVAC_RC=$CUR_RC"
          echo "BUG_850_249_L1PETINSTANCE_NO_NEW_JAVAC_REGRESSION=PASS"

      - name: Run targeted behavior runtime
        shell: bash
        run: |
          set -euo pipefail
          git show origin/work/l1jtw85-core-fixes:tools/core-fix/Bug850249RuntimeTest.java > "$RUNNER_TEMP/Bug850249RuntimeTest.java"
          mkdir -p "$RUNNER_TEMP/bug850249-runtime"
          javac -d "$RUNNER_TEMP/bug850249-runtime" "$RUNNER_TEMP/Bug850249RuntimeTest.java"
          java -cp "$RUNNER_TEMP/bug850249-runtime" Bug850249RuntimeTest

      - name: Concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin completed/l1jtw85-core-fixes
          test "$(git rev-parse origin/completed/l1jtw85-core-fixes)" = "$GITHUB_SHA"
          echo "BUG_850_249_CONCURRENCY_GATE=PASS"

      - name: Commit exact source, record evidence, and push
        shell: bash
        env:
          WORK_CI: "35722189007"
          PATCH_CHAIN: "80259951,5ead04e6,2bb6274a,d7aab0ee"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "fix(l2): promote BUG-850-249 pet persistence ordering"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          export SOURCE_COMMIT

          python - <<'PY'
          from pathlib import Path
          import os

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          row = '| BUG-850-249 | L2 | pet DB-first create/delete and atomic evolve replace | PASS / PROMOTED |'
          if row not in text:
              anchor = '| BUG-850-250 | L2 | SoulTower top-10 ranking / safe comparator | PASS / PROMOTED |'
              if anchor not in text:
                  raise SystemExit('FAIL BUG-850-250 table anchor missing')
              text = text.replace(anchor, anchor + '\n' + row, 1)

          heading = '## BUG-850-249 — pet persistence could diverge from live pet state'
          if heading not in text:
              text = text.rstrip() + f'''\n\n{heading}\n\n### Problem\n\nPet creation published the live pet map before the `pets` insert succeeded, deletion removed the live map regardless of durable delete success, and evolution used a delete-then-create sequence that could lose the durable pet row mid-transition.\n\n### Fix\n\n- all three create paths insert durably before publishing the live map;\n- deletion removes the live map only after `DELETE` affects exactly one row;\n- evolution uses one `UPDATE ... WHERE item_obj_id=?` replacement and changes the live item id only after durable success;\n- normalized and obfuscated sources use the same DB-first contract.\n\n### Validation\n\n```text\nWORK_CI={os.environ['WORK_CI']}\nCOMPLETED_CI={os.environ['GITHUB_RUN_ID']}\nSOURCE_COMMIT={os.environ['SOURCE_COMMIT']}\nPATCH_CHAIN={os.environ['PATCH_CHAIN']}\nBUG_850_249_HISTORICAL_MANIFESTS=PASS\nBUG_850_249_EXACT_PATCH_CHAIN=PASS\nUNRELATED_SOURCE_REPLAY=NO\nBUG_850_249_CONTRACT=PASS\nPET_CREATE_DB_BEFORE_MAP=PASS\nPET_DELETE_DB_BEFORE_MAP_REMOVE=PASS\nPET_EVOLVE_SINGLE_STATEMENT_REPLACE=PASS\nBUG_850_249_PETTABLE_JAVAC=PASS\nBUG_850_249_L1PETINSTANCE_NO_NEW_JAVAC_REGRESSION=PASS\nBUG_850_249_TARGETED_BEHAVIOR_RUNTIME=PASS\nBUG_850_249_CONCURRENCY_GATE=PASS\n```\n\nValidation evidence: `recovery/BUG-850-249_VALIDATION_20260924.md`\n\n### Result\n\n```text\nBUG-850-249=L2\nSTATUS=PASS_PROMOTED\nUNRELATED_SOURCE_REPLAY=NO\n```\n'''
          readme.write_text(text, encoding='utf-8')

          evidence = Path('recovery/BUG-850-249_VALIDATION_20260924.md')
          evidence.write_text(f'''# BUG-850-249 Validation\n\n```text\nBUG=BUG-850-249\nLEVEL=L2\nWORK_CI={os.environ['WORK_CI']}\nCOMPLETED_CI={os.environ['GITHUB_RUN_ID']}\nSOURCE_COMMIT={os.environ['SOURCE_COMMIT']}\nPATCH_CHAIN={os.environ['PATCH_CHAIN']}\nHISTORICAL_MANIFESTS=PASS\nEXACT_PATCH_CHAIN=PASS\nUNRELATED_SOURCE_REPLAY=NO\nSOURCE_CONTRACT=PASS\nPET_CREATE_DB_BEFORE_MAP=PASS\nPET_DELETE_DB_BEFORE_MAP_REMOVE=PASS\nPET_EVOLVE_SINGLE_STATEMENT_REPLACE=PASS\nPETTABLE_JAVAC=PASS\nL1PETINSTANCE_NO_NEW_JAVAC_REGRESSION=PASS\nTARGETED_BEHAVIOR_RUNTIME=PASS\nCONCURRENCY_GATE=PASS\nSTATUS=PASS_PROMOTED\n```\n''', encoding='utf-8')
          PY

          git add README.md recovery/BUG-850-249_VALIDATION_20260924.md
          git rm .github/workflows/l1jtw85-bug-850-249-promotion.yml
          git commit -m "docs: record BUG-850-249 completed repair"

          git fetch origin completed/l1jtw85-core-fixes
          test "$(git rev-parse origin/completed/l1jtw85-core-fixes)" = "$GITHUB_SHA"
          git push origin HEAD:completed/l1jtw85-core-fixes
