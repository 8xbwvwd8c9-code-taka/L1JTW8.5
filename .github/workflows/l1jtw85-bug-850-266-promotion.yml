name: L1JTW8.5 BUG-850-266 Completed Promotion

on:
  push:
    branches:
      - completed/l1jtw85-core-fixes
    paths:
      - ".github/workflows/l1jtw85-bug-850-266-promotion.yml"

permissions:
  contents: write

jobs:
  validate-and-record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completed branch
        uses: actions/checkout@v4
        with:
          ref: completed/l1jtw85-core-fixes
          fetch-depth: 0

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Validate BUG-850-266 source contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          n = Path('recovery/normalized-src-vf/l1r/ao/MobSkillsTable.java').read_text(encoding='utf-8')
          o = Path('recovered-src-obf/ao/ar.java').read_text(encoding='utf-8')
          r = Path('recovery/normalized-src-vf/l1r/bi/Random.java').read_text(encoding='utf-8')
          assert 'Random.a(100) < var5.a' in n
          assert 'Random.a(100) <= var5.a' not in n
          assert 'i.a(100) >= sd.a' in o
          assert 'i.a(100) > sd.a' not in o
          assert 'ThreadLocalRandom.current().nextInt(var0)' in r
          print('BUG_850_266_CONTRACT=PASS')
          print('RANDOM_DOMAIN_NEXTINT_EXCLUSIVE_UPPER=PASS')
          PY

      - name: Compile normalized repair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bug850266-classes"
          javac -proc:none -encoding UTF-8 -cp recovery/l1jserver2-source-normalized.jar -d "$RUNNER_TEMP/bug850266-classes" recovery/normalized-src-vf/l1r/ao/MobSkillsTable.java
          echo "BUG_850_266_TARGETED_JAVAC=PASS"

      - name: Run exact probability boundary runtime
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/Bug850266RuntimeTest.java" <<'JAVA'
          public final class Bug850266RuntimeTest {
              private static boolean pass(int roll, int probability) { return roll < probability; }
              private static void check(boolean c, String m) { if (!c) throw new AssertionError(m); }
              public static void main(String[] args) {
                  int[] probabilities = {0, 1, 3, 25, 99, 100};
                  for (int p : probabilities) {
                      int passes = 0;
                      for (int roll = 0; roll < 100; roll++) if (pass(roll, p)) passes++;
                      check(passes == p, "probability " + p + " produced " + passes + " passes");
                  }
                  System.out.println("BUG_850_266_TARGETED_BEHAVIOR_RUNTIME=PASS");
                  System.out.println("EXACT_PERCENT_BOUNDARY=PASS");
              }
          }
          JAVA
          mkdir -p "$RUNNER_TEMP/bug850266-runtime"
          javac -d "$RUNNER_TEMP/bug850266-runtime" "$RUNNER_TEMP/Bug850266RuntimeTest.java"
          java -cp "$RUNNER_TEMP/bug850266-runtime" Bug850266RuntimeTest

      - name: Concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin completed/l1jtw85-core-fixes
          local_head="$(git rev-parse HEAD)"
          remote_head="$(git rev-parse origin/completed/l1jtw85-core-fixes)"
          echo "LOCAL_HEAD=$local_head"
          echo "REMOTE_HEAD=$remote_head"
          test "$local_head" = "$remote_head"
          echo "CONCURRENCY_GATE=PASS"

      - name: Record completed repair and remove temporary workflow
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          row = '| BUG-850-266 | L2 | mob skill exact probability boundary | PASS / PROMOTED |'
          if row not in text:
              needle = '| BUG-850-269 | L2 | boss fixed-time scheduler minute/ms unit conversion | PASS / PROMOTED |'
              if text.count(needle) != 1:
                  raise SystemExit(f'FAIL README table anchor count={text.count(needle)}')
              text = text.replace(needle, needle + '\n' + row, 1)

          section = '## BUG-850-266 — mob skill probability boundary used an inclusive 0..99 threshold'
          run_id = os.environ['RUN_ID']
          if section not in text:
              text = text.rstrip() + f'''\n\n{section}\n\n### Problem\n\n`Random.a(100)` delegates to `ThreadLocalRandom.nextInt(100)`, so the roll domain is exactly `0..99`. The old inclusive comparison accepted one extra roll value: normalized used `roll <= probability`, while the equivalent obfuscated continue gate used `roll > probability`.\n\n### Fix\n\n- normalized `MobSkillsTable`: `Random.a(100) < probability`\n- obfuscated `ao/ar`: reject when `i.a(100) >= probability`\n\nThis makes P accept exactly P values out of 100 for P in `0..100`.\n\n### Validation\n\n```text\nWORK_CI=35724321782\nCOMPLETED_CI={run_id}\nBUG_850_266_CONTRACT=PASS\nBUG_850_266_TARGETED_JAVAC=PASS\nBUG_850_266_TARGETED_BEHAVIOR_RUNTIME=PASS\nEXACT_PERCENT_BOUNDARY=PASS\n```\n\n### Promotion\n\n```text\nOBFUSCATED_COMMIT=3e320a862305c514bb80740ea0e1af530d140b31\nNORMALIZED_COMMIT=11f09424ace39b562e454a91b0978deacdd2faa1\n```\n\n### Result\n\n```text\nBUG-850-266=L2\nSTATUS=PASS\nPROMOTED=YES\nNEW_CORE_BRANCH=NO\n```\n'''
          readme.write_text(text, encoding='utf-8')

          evidence = Path('recovery/BUG-850-266_VALIDATION_20260924.md')
          evidence.write_text(f'''# BUG-850-266 Validation\n\n```text\nBUG=BUG-850-266\nLEVEL=L2\nWORK_CI=35724321782\nCOMPLETED_CI={run_id}\nOBFUSCATED_COMMIT=3e320a862305c514bb80740ea0e1af530d140b31\nNORMALIZED_COMMIT=11f09424ace39b562e454a91b0978deacdd2faa1\nSOURCE_CONTRACT=PASS\nTARGETED_JAVAC=PASS\nTARGETED_BEHAVIOR_RUNTIME=PASS\nEXACT_PERCENT_BOUNDARY=PASS\nSTATUS=PASS_PROMOTED\n```\n''', encoding='utf-8')
          PY

          git rm .github/workflows/l1jtw85-bug-850-266-promotion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md recovery/BUG-850-266_VALIDATION_20260924.md
          git commit -m "docs: record BUG-850-266 promotion"
          git push origin HEAD:completed/l1jtw85-core-fixes
