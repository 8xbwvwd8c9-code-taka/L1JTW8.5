name: 850 Inventory Tooling CI

on:
  push:
    branches:
      - work/850-inventory-helper
    paths:
      - 'launcher/850Launcher/tools/headless_watch/**'
      - 'launcher/850Launcher/tools/decoder/**'
      - 'launcher/850Launcher/tools/run_850_inventory_precision_gate_v2.ps1'
      - 'launcher/850Launcher/tools/correlate_850_inventory_root_watch_decoder_v2.ps1'
      - '.github/workflows/850-inventory-tooling-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: launcher/850Launcher/tools/decoder/requirements.txt

      - name: Install pinned Capstone
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r launcher/850Launcher/tools/decoder/requirements.txt
          python -c "import capstone; assert capstone.__version__ == '5.0.9', capstone.__version__; print('CAPSTONE_VERSION=' + capstone.__version__)"

      - name: Run Capstone semantic self-test
        shell: pwsh
        run: |
          python launcher/850Launcher/tools/decoder/selftest_capstone_decoder.py

      - name: Parse PowerShell tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $targets = @(
            'launcher/850Launcher/tools/headless_watch/build_headless_watch.ps1',
            'launcher/850Launcher/tools/run_850_inventory_root_global_watch.ps1',
            'launcher/850Launcher/tools/decoder/setup_capstone_decoder.ps1',
            'launcher/850Launcher/tools/decoder/run_850_inventory_watch_decoder.ps1',
            'launcher/850Launcher/tools/correlate_850_inventory_root_watch_decoder_v2.ps1',
            'launcher/850Launcher/tools/run_850_inventory_precision_gate_v2.ps1'
          )
          $failed = $false
          foreach ($path in $targets) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "PARSE_FAIL=$path"
              $errors | ForEach-Object { Write-Host $_.Message }
            } else {
              Write-Host "PARSE_PASS=$path"
            }
          }
          if ($failed) { throw 'One or more PowerShell files failed parser validation.' }

      - name: Build x86 headless hardware-watch helper
        shell: pwsh
        run: |
          ./launcher/850Launcher/tools/headless_watch/build_headless_watch.ps1

      - name: Verify no target-memory write API
        shell: pwsh
        run: |
          $source = Get-Content launcher/850Launcher/tools/headless_watch/HeadlessWatch850V2.cs -Raw
          if ($source -match '(?i)\bWriteProcessMemory\s*\(') {
            throw 'WriteProcessMemory call/declaration is forbidden in headless helper.'
          }
          if ($source -notmatch 'TARGET_MEMORY_WRITE=NO') {
            throw 'Safety marker missing.'
          }
          Write-Host 'TARGET_MEMORY_WRITE=NO'
          Write-Host 'STATUS=PASS_STATIC_TOOLING_CI'
