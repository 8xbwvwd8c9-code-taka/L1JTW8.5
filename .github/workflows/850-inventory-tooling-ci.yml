name: 850 Inventory Tooling CI

on:
  push:
    branches:
      - work/850-inventory-helper
    paths:
      - 'launcher/850Launcher/tools/headless_watch/**'
      - 'launcher/850Launcher/tools/decoder/**'
      - 'launcher/850Launcher/tools/run_850_inventory_precision_gate_v2.ps1'
      - 'launcher/850Launcher/tools/correlate_850_inventory_root_watch_decoder_v2.ps1'
      - '.github/workflows/850-inventory-tooling-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: launcher/850Launcher/tools/decoder/requirements.txt

      - name: Install pinned Capstone
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r launcher/850Launcher/tools/decoder/requirements.txt
          python -c "import importlib.metadata as m; v=m.version('capstone'); assert v == '5.0.9', v; print('CAPSTONE_PACKAGE_VERSION=' + v)"
          python -c "import capstone; print('CAPSTONE_BINDING_VERSION=' + getattr(capstone,'__version__','UNKNOWN'))"

      - name: Run Capstone semantic self-test
        shell: pwsh
        run: |
          python launcher/850Launcher/tools/decoder/selftest_capstone_decoder.py

      - name: Parse Python decoder
        shell: pwsh
        run: |
          python -m py_compile launcher/850Launcher/tools/decoder/decode_850_inventory_watch.py
          python -m py_compile launcher/850Launcher/tools/decoder/selftest_capstone_decoder.py

      - name: Parse PowerShell tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $targets = @(
            'launcher/850Launcher/tools/headless_watch/build_headless_watch.ps1',
            'launcher/850Launcher/tools/run_850_inventory_root_global_watch.ps1',
            'launcher/850Launcher/tools/decoder/setup_capstone_decoder.ps1',
            'launcher/850Launcher/tools/decoder/run_850_inventory_watch_decoder.ps1',
            'launcher/850Launcher/tools/correlate_850_inventory_root_watch_decoder_v2.ps1',
            'launcher/850Launcher/tools/run_850_inventory_precision_gate_v2.ps1'
          )
          $failed = $false
          foreach ($path in $targets) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "PARSE_FAIL=$path"
              $errors | ForEach-Object { Write-Host $_.Message }
            } else {
              Write-Host "PARSE_PASS=$path"
            }
          }
          if ($failed) { throw 'One or more PowerShell files failed parser validation.' }

      - name: Build x86 headless hardware-watch helper
        shell: pwsh
        run: |
          ./launcher/850Launcher/tools/headless_watch/build_headless_watch.ps1

      - name: Run end-to-end evidence fixture
        shell: pwsh
        run: |
          $watch = 'launcher/850Launcher/tools/decoder/fixtures/root_global_watch_fixture.txt'
          $v4b = 'launcher/850Launcher/tools/decoder/fixtures/root_global_v4b_fixture.txt'
          $decoded = Join-Path $env:RUNNER_TEMP 'fixture_decoded.txt'
          $correlated = Join-Path $env:RUNNER_TEMP 'fixture_correlation.txt'

          python launcher/850Launcher/tools/decoder/decode_850_inventory_watch.py --input $watch --output $decoded
          if ($LASTEXITCODE -ne 0) { throw "decoder fixture failed: exit=$LASTEXITCODE" }

          ./launcher/850Launcher/tools/correlate_850_inventory_root_watch_decoder_v2.ps1 `
            -WatchPath $watch `
            -DecoderPath $decoded `
            -V4bPath $v4b `
            -OutputPath $correlated

          $decoderText = Get-Content $decoded -Raw
          $correlationText = Get-Content $correlated -Raw
          if ($decoderText -notmatch 'UNIQUE_TARGET_WRITERS=2') {
            throw 'Expected two decoder-proven fixture writers.'
          }
          if ($correlationText -notmatch 'CORRELATED_NONZERO_ASSIGNMENTS=1') {
            throw 'Expected one correlated nonzero assignment.'
          }
          if ($correlationText -notmatch 'CORRELATED_ZERO_CLEARS=1') {
            throw 'Expected one correlated zero clear.'
          }
          if ($correlationText -notmatch 'STATUS=OWNER_ANCHOR_STRONG_DECODER_RUNTIME_CANDIDATE') {
            throw 'End-to-end fixture did not reach the expected strong candidate state.'
          }
          Write-Host 'STATUS=PASS_END_TO_END_FIXTURE'

      - name: Verify no target-memory write API
        shell: pwsh
        run: |
          $source = Get-Content launcher/850Launcher/tools/headless_watch/HeadlessWatch850V2.cs -Raw
          if ($source -match '(?i)\bWriteProcessMemory\s*\(') {
            throw 'WriteProcessMemory call/declaration is forbidden in headless helper.'
          }
          if ($source -notmatch 'TARGET_MEMORY_WRITE=NO') {
            throw 'Safety marker missing.'
          }
          Write-Host 'TARGET_MEMORY_WRITE=NO'
          Write-Host 'STATUS=PASS_STATIC_TOOLING_CI'
