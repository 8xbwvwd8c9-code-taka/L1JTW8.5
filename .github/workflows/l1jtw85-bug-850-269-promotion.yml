name: L1JTW8.5 BUG-850-269 Promotion Validation

on:
  push:
    branches:
      - promote/l2-269-latest
    paths:
      - ".github/workflows/l1jtw85-bug-850-269-promotion.yml"
      - "tools/core-fix/validate_bug_850_269.py"
      - "tools/core-fix/Bug850269RuntimeTest.java"
      - "recovery/BUG-850-269_VALIDATION_20260923.md"
      - "recovery/normalized-src-vf/l1r/aq/L1SpawnBoss.java"
      - "recovered-src-obf/aq/ah.java"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout promotion branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Validate source contract
        run: python tools/core-fix/validate_bug_850_269.py
      - name: Compile normalized repair
        shell: bash
        run: |
          set -euo pipefail
          BASELINE_SHA=d4af0918be66059fb5892867ef8d1bb9c3311fa5
          mkdir -p "$RUNNER_TEMP/bug850269-baseline/l1r/aq" "$RUNNER_TEMP/bug850269-baseline-classes" "$RUNNER_TEMP/bug850269-current-classes"

          git show "$BASELINE_SHA:recovery/normalized-src-vf/l1r/aq/L1SpawnBoss.java" > "$RUNNER_TEMP/bug850269-baseline/l1r/aq/L1SpawnBoss.java"

          set +e
          javac -proc:none -encoding UTF-8 -cp recovery/l1jserver2-source-normalized.jar -d "$RUNNER_TEMP/bug850269-baseline-classes" "$RUNNER_TEMP/bug850269-baseline/l1r/aq/L1SpawnBoss.java" 2> "$RUNNER_TEMP/bug850269-baseline.err"
          BASE_RC=$?
          javac -proc:none -encoding UTF-8 -cp recovery/l1jserver2-source-normalized.jar -d "$RUNNER_TEMP/bug850269-current-classes" recovery/normalized-src-vf/l1r/aq/L1SpawnBoss.java 2> "$RUNNER_TEMP/bug850269-current.err"
          CUR_RC=$?
          set -e

          grep 'error:' "$RUNNER_TEMP/bug850269-baseline.err" | sed -E 's#^.*error:#error:#' > "$RUNNER_TEMP/bug850269-baseline.sig" || true
          grep 'error:' "$RUNNER_TEMP/bug850269-current.err" | sed -E 's#^.*error:#error:#' > "$RUNNER_TEMP/bug850269-current.sig" || true
          diff -u "$RUNNER_TEMP/bug850269-baseline.sig" "$RUNNER_TEMP/bug850269-current.sig"

          echo "BASELINE_JAVAC_RC=$BASE_RC"
          echo "CURRENT_JAVAC_RC=$CUR_RC"
          echo "BUG_850_269_NO_NEW_JAVAC_REGRESSION=PASS"
      - name: Run targeted behavior runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bug850269-runtime"
          javac -d "$RUNNER_TEMP/bug850269-runtime" tools/core-fix/Bug850269RuntimeTest.java
          java -cp "$RUNNER_TEMP/bug850269-runtime" Bug850269RuntimeTest
