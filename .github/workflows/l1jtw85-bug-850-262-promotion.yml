name: L1JTW8.5 BUG-850-262 Completed Promotion

on:
  push:
    branches:
      - completed/l1jtw85-core-fixes
    paths:
      - ".github/workflows/l1jtw85-bug-850-262-promotion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completed branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Validate BUG-850-262 source contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          N = Path('recovery/normalized-src-vf/l1r/ao/WeaponSkillTable.java').read_text(encoding='utf-8')
          O = Path('recovered-src-obf/ao/bl.java').read_text(encoding='utf-8')
          req_n = [
              'long rawProbability = (long)var4.d + (long)var4.e * (long)var1.v().G();',
              'int probability = (int)Math.max(0L, Math.min(100L, rawProbability));',
              'if (Random.a(100) >= probability) {',
          ]
          req_o = [
              'long rawProbability = (long)data.d + (long)data.e * (long)pc.v().G();',
              'int probability = (int)Math.max(0L, Math.min(100L, rawProbability));',
              'if (i.a(100) >= probability) {',
          ]
          bad = [
              'Random.a(100) > var4.d + var4.e * var1.v().G()',
              'Random.a(100) >= var4.d + var4.e * var1.v().G()',
              'i.a(100) > data.d + data.e * pc.v().G()',
              'i.a(100) >= data.d + data.e * pc.v().G()',
          ]
          for s in req_n: assert s in N, s
          for s in req_o: assert s in O, s
          for s in bad: assert s not in N and s not in O, s
          print('BUG_850_262_CONTRACT=PASS')
          print('WEAPON_PROC_EXACT_THRESHOLD=PASS')
          print('WEAPON_PROC_LONG_ARITHMETIC=PASS')
          print('WEAPON_PROC_CLAMP_0_100=PASS')
          PY
      - name: Compile normalized repair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bug850262-classes"
          javac -proc:none -encoding UTF-8 -cp recovery/l1jserver2-source-normalized.jar -d "$RUNNER_TEMP/bug850262-classes" recovery/normalized-src-vf/l1r/ao/WeaponSkillTable.java
          echo "BUG_850_262_TARGETED_JAVAC=PASS"
      - name: Run exact threshold and overflow runtime
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/Bug850262RuntimeTest.java" <<'JAVA'
          public final class Bug850262RuntimeTest {
              private static int threshold(int base, int perEnchant, int enchant) {
                  long raw = (long) base + (long) perEnchant * (long) enchant;
                  return (int) Math.max(0L, Math.min(100L, raw));
              }
              private static boolean pass(int roll, int base, int perEnchant, int enchant) {
                  return roll < threshold(base, perEnchant, enchant);
              }
              private static int passCount(int base, int perEnchant, int enchant) {
                  int n = 0;
                  for (int roll = 0; roll < 100; roll++) if (pass(roll, base, perEnchant, enchant)) n++;
                  return n;
              }
              private static void check(boolean c, String m) { if (!c) throw new AssertionError(m); }
              public static void main(String[] args) {
                  check(passCount(0,0,0)==0, "0%");
                  check(passCount(2,0,0)==2, "2%");
                  check(passCount(15,0,0)==15, "15%");
                  check(passCount(5,2,5)==15, "enchant");
                  check(passCount(100,0,0)==100, "100%");
                  check(passCount(120,0,0)==100, ">100 clamp");
                  check(passCount(-50,0,0)==0, "<0 clamp");
                  check(passCount(1,Integer.MAX_VALUE,Integer.MAX_VALUE)==100, "positive overflow");
                  check(passCount(1,Integer.MIN_VALUE,Integer.MAX_VALUE)==0, "negative overflow");
                  System.out.println("BUG_850_262_TARGETED_BEHAVIOR_RUNTIME=PASS");
                  System.out.println("ZERO_PERCENT_NO_PROC=PASS");
                  System.out.println("ENCHANT_THRESHOLD_EXACT=PASS");
                  System.out.println("OVERFLOW_SAFE_CLAMP=PASS");
              }
          }
          JAVA
          mkdir -p "$RUNNER_TEMP/bug850262-runtime"
          javac -d "$RUNNER_TEMP/bug850262-runtime" "$RUNNER_TEMP/Bug850262RuntimeTest.java"
          java -cp "$RUNNER_TEMP/bug850262-runtime" Bug850262RuntimeTest
      - name: Concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin completed/l1jtw85-core-fixes
          test "$(git rev-parse origin/completed/l1jtw85-core-fixes)" = "$GITHUB_SHA"
          echo "BUG_850_262_CONCURRENCY_GATE=PASS"
      - name: Record completed repair, normalize README table, remove temporary workflow
        shell: bash
        env:
          SOURCE_COMMIT: d6d0cb2948713cb7018c2f19c8640e99c909a718
          WORK_CI: "35723960434"
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          row263 = '| BUG-850-263 | L2 | account register online-state authority binding | PASS / PROMOTED |'
          row262 = '| BUG-850-262 | L2 | weapon proc exact probability / overflow-safe threshold | PASS / PROMOTED |'
          # Repair the prior misplaced 263 row and prevent duplicates.
          text = '\n'.join(line for line in text.splitlines() if line not in (row263, row262)) + '\n'
          anchor = '| BUG-850-265 | L2 | monthly town salary pre-reset contribution calculation | PASS / PROMOTED |'
          if anchor not in text:
              raise SystemExit('FAIL completed table anchor BUG-850-265 not found')
          text = text.replace(anchor, anchor + '\n' + row263 + '\n' + row262, 1)
          heading = '## BUG-850-262 — weapon proc probability used an inclusive threshold and overflow-prone int arithmetic'
          if heading not in text:
              text = text.rstrip() + f'''\n\n{heading}\n\n### Problem\n\nThe weapon proc gate used a `0..99` random roll against `probability + prob_every_enchant * enchant` with an inclusive boundary and `int` multiplication/addition. That made 0% capable of passing at roll 0 and allowed extreme configured/enchant values to overflow before comparison.\n\n### Fix\n\nBoth normalized and obfuscated paths now compute the threshold in `long`, clamp it to `[0,100]`, then accept only `roll < probability` (implemented as an early return on `roll >= probability`).\n\n### Validation\n\n```text\nWORK_CI={os.environ['WORK_CI']}\nCOMPLETED_CI={os.environ['GITHUB_RUN_ID']}\nSOURCE_COMMIT={os.environ['SOURCE_COMMIT']}\nBUG_850_262_CONTRACT=PASS\nWEAPON_PROC_EXACT_THRESHOLD=PASS\nWEAPON_PROC_LONG_ARITHMETIC=PASS\nWEAPON_PROC_CLAMP_0_100=PASS\nBUG_850_262_TARGETED_JAVAC=PASS\nBUG_850_262_TARGETED_BEHAVIOR_RUNTIME=PASS\nZERO_PERCENT_NO_PROC=PASS\nENCHANT_THRESHOLD_EXACT=PASS\nOVERFLOW_SAFE_CLAMP=PASS\nBUG_850_262_CONCURRENCY_GATE=PASS\n```\n\nValidation evidence: `recovery/BUG-850-262_VALIDATION_20260924.md`.\n\n### Result\n\n```text\nBUG-850-262=L2\nSTATUS=PASS\nPROMOTED=YES\n```\n'''
          p.write_text(text, encoding='utf-8')
          evidence = f'''# BUG-850-262 Validation\n\n```text\nBUG=BUG-850-262\nLEVEL=L2\nWORK_CI={os.environ['WORK_CI']}\nCOMPLETED_CI={os.environ['GITHUB_RUN_ID']}\nSOURCE_COMMIT={os.environ['SOURCE_COMMIT']}\nSOURCE_CONTRACT=PASS\nTARGETED_JAVAC=PASS\nTARGETED_BEHAVIOR_RUNTIME=PASS\nWEAPON_PROC_EXACT_THRESHOLD=PASS\nWEAPON_PROC_LONG_ARITHMETIC=PASS\nWEAPON_PROC_CLAMP_0_100=PASS\nZERO_PERCENT_NO_PROC=PASS\nENCHANT_THRESHOLD_EXACT=PASS\nOVERFLOW_SAFE_CLAMP=PASS\nCONCURRENCY_GATE=PASS\nSTATUS=PASS_PROMOTED\n```\n'''
          Path('recovery/BUG-850-262_VALIDATION_20260924.md').write_text(evidence, encoding='utf-8')
          PY
          git rm .github/workflows/l1jtw85-bug-850-262-promotion.yml
          git add README.md recovery/BUG-850-262_VALIDATION_20260924.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: record BUG-850-262 promotion"
          git fetch origin completed/l1jtw85-core-fixes
          test "$(git rev-parse origin/completed/l1jtw85-core-fixes)" = "$GITHUB_SHA"
          git push origin HEAD:completed/l1jtw85-core-fixes
