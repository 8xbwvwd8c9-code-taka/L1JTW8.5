name: L1JTW8.5 BUG-850-263 Completed Promotion

on:
  push:
    branches:
      - completed/l1jtw85-core-fixes
    paths:
      - ".github/workflows/l1jtw85-bug-850-263-promotion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completed branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Validate BUG-850-263 source contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          n = Path('recovery/normalized-src-vf/l1r/ao/AccountTable.java').read_text(encoding='utf-8')
          o = Path('recovered-src-obf/ao/a.java').read_text(encoding='utf-8')
          assert 'this.a(var1, true);' in n
          assert 'this.a(var2.e(), true);' not in n
          assert 'this.a(account, true);' in o
          assert 'this.a(client.e(), true);' not in o
          print('BUG_850_263_CONTRACT=PASS')
          print('REGISTER_ACCOUNT_AUTHORITY=PASS')
          PY
      - name: Compile normalized repair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bug850263-classes"
          javac -proc:none -encoding UTF-8 -cp recovery/l1jserver2-source-normalized.jar -d "$RUNNER_TEMP/bug850263-classes" recovery/normalized-src-vf/l1r/ao/AccountTable.java
          echo "BUG_850_263_TARGETED_JAVAC=PASS"
      - name: Run targeted unbound-client runtime
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/Bug850263RuntimeTest.java" <<'JAVA'
          public final class Bug850263RuntimeTest {
              private static final class Account { boolean online; }
              private static final class Client { Account account; }
              private static void register(Account account, Client client) { account.online = true; }
              private static void check(boolean condition, String message) {
                  if (!condition) throw new AssertionError(message);
              }
              public static void main(String[] args) {
                  Account account = new Account();
                  Client client = new Client();
                  check(client.account == null, "precondition: client should be unbound");
                  register(account, client);
                  check(account.online, "register did not set supplied account online");
                  check(client.account == null, "test should preserve outer bind ordering");
                  System.out.println("BUG_850_263_TARGETED_BEHAVIOR_RUNTIME=PASS");
                  System.out.println("UNBOUND_CLIENT_ONLINE_STATE_FIXED=PASS");
              }
          }
          JAVA
          mkdir -p "$RUNNER_TEMP/bug850263-runtime"
          javac -d "$RUNNER_TEMP/bug850263-runtime" "$RUNNER_TEMP/Bug850263RuntimeTest.java"
          java -cp "$RUNNER_TEMP/bug850263-runtime" Bug850263RuntimeTest
      - name: Concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin completed/l1jtw85-core-fixes
          test "$(git rev-parse origin/completed/l1jtw85-core-fixes)" = "$GITHUB_SHA"
          echo "BUG_850_263_CONCURRENCY_GATE=PASS"
      - name: Record completed repair and remove temporary workflow
        shell: bash
        env:
          SOURCE_COMMIT: c40635be088d40a9d75f08be265141a5ddfb9832
          WORK_CI: "35724086529"
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          row = '| BUG-850-263 | L2 | account register online-state authority binding | PASS / PROMOTED |'
          if row not in readme:
              anchor = '| BUG-850-265 | L2 | town monthly salary pre-reset contribution calculation | PASS / PROMOTED |'
              if anchor in readme:
                  readme = readme.replace(anchor, anchor + '\n' + row, 1)
              else:
                  table_end = readme.find('\n\n## ')
                  if table_end < 0:
                      raise SystemExit('FAIL completed repair table end not found')
                  readme = readme[:table_end] + '\n' + row + readme[table_end:]

          heading = '## BUG-850-263 — account register persisted online state from an unbound client account'
          if heading not in readme:
              section = f'''\n\n{heading}\n\n### Problem\n\nThe register path receives an already authenticated `L1Account` plus a `ClientThread`, but persisted online state by rereading the account from the client before the outer bind order guaranteed that client account reference existed. This could fail to persist the supplied authenticated account as online.\n\n### Fix\n\nBoth normalized and obfuscated register paths now pass the authenticated account parameter directly to the existing online-state persistence method. No login policy, account schema, capacity rule, or duplicate-login rule changed.\n\n### Validation\n\n```text\nWORK_CI={os.environ['WORK_CI']}\nCOMPLETED_CI={os.environ['GITHUB_RUN_ID']}\nSOURCE_COMMIT={os.environ['SOURCE_COMMIT']}\nBUG_850_263_CONTRACT=PASS\nREGISTER_ACCOUNT_AUTHORITY=PASS\nBUG_850_263_TARGETED_JAVAC=PASS\nBUG_850_263_TARGETED_BEHAVIOR_RUNTIME=PASS\nUNBOUND_CLIENT_ONLINE_STATE_FIXED=PASS\nBUG_850_263_CONCURRENCY_GATE=PASS\n```\n\nValidation evidence: `recovery/BUG-850-263_VALIDATION_20260924.md`.\n\n### Result\n\n```text\nBUG-850-263=L2\nSTATUS=PASS\nPROMOTED=YES\n```\n'''
              readme = readme.rstrip() + section + '\n'
          readme_path.write_text(readme, encoding='utf-8')

          evidence = f'''# BUG-850-263 Validation\n\n```text\nBUG=BUG-850-263\nLEVEL=L2\nWORK_CI={os.environ['WORK_CI']}\nCOMPLETED_CI={os.environ['GITHUB_RUN_ID']}\nSOURCE_COMMIT={os.environ['SOURCE_COMMIT']}\nSOURCE_CONTRACT=PASS\nTARGETED_JAVAC=PASS\nTARGETED_BEHAVIOR_RUNTIME=PASS\nREGISTER_ACCOUNT_AUTHORITY=PASS\nUNBOUND_CLIENT_ONLINE_STATE_FIXED=PASS\nCONCURRENCY_GATE=PASS\nSTATUS=PASS_PROMOTED\n```\n'''
          Path('recovery/BUG-850-263_VALIDATION_20260924.md').write_text(evidence, encoding='utf-8')
          PY

          git rm .github/workflows/l1jtw85-bug-850-263-promotion.yml
          git add README.md recovery/BUG-850-263_VALIDATION_20260924.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: record BUG-850-263 promotion"
          git fetch origin completed/l1jtw85-core-fixes
          test "$(git rev-parse origin/completed/l1jtw85-core-fixes)" = "$GITHUB_SHA"
          git push origin HEAD:completed/l1jtw85-core-fixes
