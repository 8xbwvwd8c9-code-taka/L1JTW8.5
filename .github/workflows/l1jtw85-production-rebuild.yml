name: L1JTW8.5 Production Rebuild

on:
  push:
    branches:
      - work/l1jtw85-production-jar-rebuild
    paths:
      - 'tools/production-rebuild/**'
      - '.github/workflows/l1jtw85-production-rebuild.yml'
      - 'recovery/PRODUCTION_JAR_REBUILD_DESIGN_20260924.md'
      - 'docs/superpowers/plans/2026-09-24-production-jar-rebuild.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-rebuild-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run inverse remap contract tests
        run: python -m unittest discover -s tools/production-rebuild/tests -p 'test_inverse_remap.py' -v

      - name: Run repaired JAR contract tests
        run: python -m unittest discover -s tools/production-rebuild/tests -p 'test_build_repaired_test_jar.py' -v

      - name: Run structural validator contract tests
        run: python -m unittest discover -s tools/production-rebuild/tests -p 'test_validate_repaired_test_jar.py' -v

      - name: Run completed repair selection contract tests
        run: python -m unittest discover -s tools/production-rebuild/tests -p 'test_select_completed_repairs.py' -v

      - name: Fetch accepted recovery baseline
        run: git fetch --no-tags --depth=1 origin 999f2f6571e6984217c33cf0449cc8c7f1679dbd

      - name: Probe selected-source incremental compile
        run: >-
          python tools/production-rebuild/probe_incremental_compile.py
          --repo-root .
          --baseline-ref 999f2f6571e6984217c33cf0449cc8c7f1679dbd

      - name: Run end-to-end repaired test JAR pipeline
        run: >-
          python tools/production-rebuild/run_production_rebuild.py
          --repo-root .
          --baseline-ref 999f2f6571e6984217c33cf0449cc8c7f1679dbd
          --source-authority completed/l1jtw85-core-fixes@70d4ffb1ee3bca1f8b9c876aa8fcece304683b64
