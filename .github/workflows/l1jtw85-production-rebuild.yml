name: L1JTW8.5 Production Rebuild

on:
  push:
    branches:
      - work/l1jtw85-production-jar-rebuild
    paths:
      - 'tools/production-rebuild/**'
      - '.github/workflows/l1jtw85-production-rebuild.yml'
      - 'recovery/PRODUCTION_JAR_REBUILD_DESIGN_20260924.md'
      - 'docs/superpowers/plans/2026-09-24-production-jar-rebuild.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-rebuild-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 for contract tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run inverse remap contract tests
        run: python -m unittest discover -s tools/production-rebuild/tests -p 'test_inverse_remap.py' -v

      - name: Run repaired JAR contract tests
        run: python -m unittest discover -s tools/production-rebuild/tests -p 'test_build_repaired_test_jar.py' -v

      - name: Run structural validator contract tests
        run: python -m unittest discover -s tools/production-rebuild/tests -p 'test_validate_repaired_test_jar.py' -v

      - name: Run completed repair selection contract tests
        run: python -m unittest discover -s tools/production-rebuild/tests -p 'test_select_completed_repairs.py' -v

      - name: Run deployability policy contract tests
        run: python -m unittest discover -s tools/production-rebuild/tests -p 'test_deployable_repairs.py' -v

      - name: Run local production driver contract tests
        run: python -m unittest discover -s tools/production-rebuild/tests -p 'test_local_driver_contract.py' -v

      - name: Fetch pinned completed repair authority
        run: git fetch --no-tags --depth=1000 origin 3d4a392593d61c9203e3f22a154e752c2c51fa97

      - name: Set up Java 8 for deployability gate
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Compile deployable promoted repairs
        run: >-
          python tools/production-rebuild/compile_deployable_repairs.py
          --repo-root .
          --completed-ref 3d4a392593d61c9203e3f22a154e752c2c51fa97
          --output-dir recovery/production-build/deployable

      - name: Run end-to-end repaired test JAR pipeline
        run: >-
          python tools/production-rebuild/run_production_rebuild.py
          --repo-root .
          --completed-ref 3d4a392593d61c9203e3f22a154e752c2c51fa97

      - name: Write artifact checksum manifest
        run: |
          set -euo pipefail
          cd recovery/production-build
          sha256sum l1jserver2.repaired-test.jar > ARTIFACT_SHA256.txt
          cat ARTIFACT_SHA256.txt

      - name: Upload verified repaired test JAR
        uses: actions/upload-artifact@v7
        with:
          name: l1jtw85-repaired-test-3d4a3925
          if-no-files-found: error
          retention-days: 30
          path: |
            recovery/production-build/l1jserver2.repaired-test.jar
            recovery/production-build/ARTIFACT_SHA256.txt
            recovery/production-build/PIPELINE_RESULT.json
            recovery/production-build/PIPELINE_RESULT.md
            recovery/production-build/production_build_state.json
            recovery/production-build/REPLACED_CLASSES.md
            recovery/production-build/VALIDATION_RESULT.json
            recovery/production-build/VALIDATION_RESULT.md
            recovery/production-build/deployable/DEPLOYABILITY_STATE.json
            recovery/production-build/deployable/DEPLOYABILITY_STATE.md
            recovery/production-build/deployable/logs/*.log

      - name: Start MySQL 5.7 for runtime smoke
        run: |
          set -euo pipefail
          docker rm -f l1jtw85-mysql >/dev/null 2>&1 || true
          docker run --name l1jtw85-mysql \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_ROOT_HOST=% \
            -p 3306:3306 \
            -d mysql:5.7 \
            --sql-mode=NO_ENGINE_SUBSTITUTION
          for i in $(seq 1 60); do
            if docker exec l1jtw85-mysql mysql -uroot -proot -N -B -e 'SELECT 1' >/dev/null 2>&1; then
              echo "MYSQL_AUTH_READY=YES"
              exit 0
            fi
            sleep 1
          done
          docker logs l1jtw85-mysql
          echo "MYSQL_AUTH_READY=NO"
          exit 1

      - name: Import 8.5 runtime database
        run: |
          set -euo pipefail
          docker exec l1jtw85-mysql mysql -uroot -proot -e 'CREATE DATABASE IF NOT EXISTS `8.5` CHARACTER SET utf8 COLLATE utf8_general_ci;'
          docker exec -i l1jtw85-mysql mysql -uroot -proot '8.5' < db/8.5.sql
          TABLES="$(docker exec l1jtw85-mysql mysql -uroot -proot -N -B -e 'SELECT COUNT(*) FROM information_schema.tables WHERE table_schema="8.5";')"
          echo "DB_TABLES=$TABLES"
          test "$TABLES" -gt 0

      - name: Run repaired JAR runtime smoke
        run: |
          set -euo pipefail
          JAR="recovery/production-build/l1jserver2.repaired-test.jar"
          LOG="recovery/production-build/RUNTIME_SMOKE.log"
          RESULT="recovery/production-build/RUNTIME_SMOKE_RESULT.txt"
          : > "$LOG"
          : > "$RESULT"

          python - <<'PY'
          from pathlib import Path

          path = Path("config/server.properties")
          text = path.read_text(encoding="utf-8-sig")
          base = "URL=jdbc:mysql://localhost/8.5?useUnicode=true&characterEncoding=utf8"
          secure = base + "&useSSL=false"
          if secure not in text:
              if base not in text:
                  raise SystemExit("runtime smoke JDBC URL not found")
              text = text.replace(base, secure, 1)
              path.write_text(text, encoding="utf-8")
          print("RUNTIME_JDBC_SSL_DISABLED=YES")
          PY
          grep '^URL=' config/server.properties

          java -server -noverify \
            -XX:+UseG1GC \
            -XX:+UseStringDeduplication \
            -XX:+UseFastAccessorMethods \
            -XX:+AggressiveOpts \
            -XX:+OptimizeStringConcat \
            -XX:+UseBiasedLocking \
            -jar "$JAR" >"$LOG" 2>&1 &
          PID=$!

          cleanup_java() {
            if kill -0 "$PID" >/dev/null 2>&1; then
              kill "$PID" >/dev/null 2>&1 || true
              wait "$PID" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_java EXIT

          for i in $(seq 1 60); do
            if ! kill -0 "$PID" >/dev/null 2>&1; then
              set +e
              wait "$PID"
              RC=$?
              set -e
              echo "RUNTIME_SMOKE=FAIL" | tee -a "$RESULT"
              echo "JAVA_EXIT=$RC" | tee -a "$RESULT"
              echo "PORT_2000=NOT_LISTENING" | tee -a "$RESULT"
              cat "$LOG"
              exit 1
            fi

            if python - <<'PY'
          import socket
          with socket.create_connection(("127.0.0.1", 2000), timeout=1):
              pass
          PY
            then
              echo "RUNTIME_SMOKE=PASS" | tee -a "$RESULT"
              echo "JAVA_PROCESS=ALIVE" | tee -a "$RESULT"
              echo "PORT_2000=LISTENING" | tee -a "$RESULT"
              cat "$LOG"
              exit 0
            fi
            sleep 1
          done

          echo "RUNTIME_SMOKE=FAIL" | tee -a "$RESULT"
          echo "JAVA_PROCESS=ALIVE" | tee -a "$RESULT"
          echo "PORT_2000=NOT_LISTENING_TIMEOUT" | tee -a "$RESULT"
          cat "$LOG"
          exit 1

      - name: Upload runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: l1jtw85-runtime-smoke-3d4a3925
          if-no-files-found: warn
          retention-days: 30
          path: |
            recovery/production-build/RUNTIME_SMOKE.log
            recovery/production-build/RUNTIME_SMOKE_RESULT.txt

      - name: Cleanup runtime smoke database
        if: always()
        run: docker rm -f l1jtw85-mysql >/dev/null 2>&1 || true
