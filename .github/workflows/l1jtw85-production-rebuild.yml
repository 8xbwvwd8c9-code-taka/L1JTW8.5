name: L1JTW8.5 Production Rebuild

on:
  push:
    branches:
      - work/l1jtw85-production-jar-rebuild
    paths:
      - 'tools/production-rebuild/**'
      - '.github/workflows/l1jtw85-production-rebuild.yml'
      - 'recovery/PRODUCTION_JAR_REBUILD_DESIGN_20260924.md'
      - 'docs/superpowers/plans/2026-09-24-production-jar-rebuild.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-rebuild-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 for contract tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run inverse remap contract tests
        run: python -m unittest discover -s tools/production-rebuild/tests -p 'test_inverse_remap.py' -v

      - name: Run repaired JAR contract tests
        run: python -m unittest discover -s tools/production-rebuild/tests -p 'test_build_repaired_test_jar.py' -v

      - name: Run structural validator contract tests
        run: python -m unittest discover -s tools/production-rebuild/tests -p 'test_validate_repaired_test_jar.py' -v

      - name: Run completed repair selection contract tests
        run: python -m unittest discover -s tools/production-rebuild/tests -p 'test_select_completed_repairs.py' -v

      - name: Run deployability policy contract tests
        run: python -m unittest discover -s tools/production-rebuild/tests -p 'test_deployable_repairs.py' -v

      - name: Fetch pinned completed repair authority
        run: git fetch --no-tags --depth=1000 origin 3d4a392593d61c9203e3f22a154e752c2c51fa97

      - name: Set up Java 8 for deployability gate
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Compile deployable promoted repairs
        run: >-
          python tools/production-rebuild/compile_deployable_repairs.py
          --repo-root .
          --completed-ref 3d4a392593d61c9203e3f22a154e752c2c51fa97
          --output-dir recovery/production-build/deployable
