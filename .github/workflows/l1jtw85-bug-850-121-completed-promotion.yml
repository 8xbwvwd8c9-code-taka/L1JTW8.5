name: L1JTW8.5 BUG-850-121 Completed Promotion

on:
  push:
    branches:
      - completed/l1jtw85-core-fixes
    paths:
      - ".github/workflows/l1jtw85-bug-850-121-completed-promotion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: completed/l1jtw85-core-fixes

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Concurrency and baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin completed/l1jtw85-core-fixes work/l1jtw85-core-fixes
          test "$(git rev-parse origin/completed/l1jtw85-core-fixes)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/base/l1r/bh" "$RUNNER_TEMP/fix/l1r/bh" "$RUNNER_TEMP/bclasses" "$RUNNER_TEMP/fclasses"
          cp recovery/normalized-src-vf/l1r/bh/L1BookMark.java "$RUNNER_TEMP/base/l1r/bh/L1BookMark.java"
          echo "BUG_850_121_PRE_APPLY_CONCURRENCY=PASS"

      - name: Apply completed normalized parity only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('recovery/normalized-src-vf/l1r/bh/L1BookMark.java')
          text = path.read_text(encoding='utf-8')
          start = text.index('public static void b(L1PcInstance var0, String var1)')
          end = text.index('public static void a(L1PcInstance var0, HashMap<String, L1Location> var1)', start)
          method = text[start:end]
          logline = 'c.log(Level.SEVERE, var10.getLocalizedMessage(), var10);'
          if method.count(logline) != 1:
              raise SystemExit('FAIL normalized single-create SQLException log shape')
          lp = method.index(logline)
          fp = method.index('} finally {', lp)
          between = method[lp:fp]
          if 'return;' in between:
              print('BUG_850_121_NORMALIZED_ALREADY_FIXED=YES')
          else:
              method = method[:lp] + method[lp:].replace(logline, logline + '\n               return;', 1)
              text = text[:start] + method + text[end:]
              path.write_text(text, encoding='utf-8')
          PY

          git diff --name-only | sort > "$RUNNER_TEMP/actual"
          printf '%s\n' 'recovery/normalized-src-vf/l1r/bh/L1BookMark.java' > "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          echo "BUG_850_121_COMPLETED_EXACT_SCOPE=PASS"

      - name: Validate completed bookmark contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          n = Path('recovery/normalized-src-vf/l1r/bh/L1BookMark.java').read_text(encoding='utf-8')
          o = Path('recovered-src-obf/bh/c.java').read_text(encoding='utf-8')

          ns = n.index('public static void b(L1PcInstance var0, String var1)')
          ne = n.index('public static void a(L1PcInstance var0, HashMap<String, L1Location> var1)', ns)
          nm = n[ns:ne]
          os = o.index('public static void b(u pc, String s2)')
          oe = o.index('public static boolean a(u pc, HashMap<String, aq.u> bookmark_list)', os)
          om = o[os:oe]

          for method, label, logline, publish in (
              (nm, 'normalized', 'c.log(Level.SEVERE, var10.getLocalizedMessage(), var10);', 'var0.ba().add(var3);'),
              (om, 'obfuscated', 'c.log(Level.SEVERE, e2.getLocalizedMessage(), e2);', 'pc.ba().add(bookmark);'),
          ):
              lp = method.index(logline)
              rp = method.index('return;', lp)
              pp = method.index(publish)
              if not (lp < rp < pp):
                  raise SystemExit(f'FAIL {label} DB-failure gate ordering')
              if 'INSERT INTO character_teleport' not in method:
                  raise SystemExit(f'FAIL {label} missing durable insert')

          if 'public static boolean a(u pc, HashMap<String, aq.u> bookmark_list)' not in o:
              raise SystemExit('FAIL completed obfuscated batch repair lost')
          batch_end = o.index('public static boolean a(u pc, q item)', oe)
          if 'con.setAutoCommit(false);' not in o[oe:batch_end]:
              raise SystemExit('FAIL completed obfuscated batch transaction lost')

          print('BUG_850_121_COMPLETED_CONTRACT=PASS')
          print('COMPLETED_OBFUSCATED_STRONGER_REPAIR_PRESERVED=PASS')
          PY

      - name: Java 8 no-new-regression
        shell: bash
        run: |
          set -euo pipefail
          cp recovery/normalized-src-vf/l1r/bh/L1BookMark.java "$RUNNER_TEMP/fix/l1r/bh/L1BookMark.java"
          set +e
          javac -proc:none -encoding UTF-8 -cp recovery/l1jserver2-source-normalized.jar -d "$RUNNER_TEMP/bclasses" "$RUNNER_TEMP/base/l1r/bh/L1BookMark.java" 2> "$RUNNER_TEMP/base.err"
          BASE_RC=$?
          javac -proc:none -encoding UTF-8 -cp recovery/l1jserver2-source-normalized.jar -d "$RUNNER_TEMP/fclasses" "$RUNNER_TEMP/fix/l1r/bh/L1BookMark.java" 2> "$RUNNER_TEMP/fix.err"
          FIX_RC=$?
          set -e
          grep 'error:' "$RUNNER_TEMP/base.err" | sed -E 's#^.*error:#error:#' > "$RUNNER_TEMP/base.sig" || true
          grep 'error:' "$RUNNER_TEMP/fix.err" | sed -E 's#^.*error:#error:#' > "$RUNNER_TEMP/fix.sig" || true
          diff -u "$RUNNER_TEMP/base.sig" "$RUNNER_TEMP/fix.sig"
          echo "BASELINE_JAVAC_RC=$BASE_RC"
          echo "FIX_JAVAC_RC=$FIX_RC"
          echo "BUG_850_121_COMPLETED_NO_NEW_JAVAC_REGRESSION=PASS"

      - name: Record completed repair and remove promotion workflow
        shell: bash
        env:
          CI_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path('README.md')
          t = p.read_text(encoding='utf-8')
          row = '| BUG-850-121 | L2 | single bookmark DB/RAM/client publication ordering | PASS / PROMOTED |'
          if row not in t:
              marker = '|---|---|---|---|\n'
              t = t.replace(marker, marker + row + '\n', 1)
          heading = '## BUG-850-121 — single bookmark creation published live state after failed INSERT'
          if heading not in t:
              t += f'''\n\n{heading}\n\n### Fix\n\nSingle bookmark creation is DB-first. If `character_teleport` INSERT raises `SQLException`, the handler returns before appending the bookmark to RAM or sending `S_Bookmarks`. The completed branch's stronger obfuscated bookmark batch transaction is preserved unchanged; only normalized single-create parity was added.\n\n### Validation\n\n```text\nWORK_CI=35950791953 PASS\nCOMPLETED_CI={os.environ['CI_RUN_ID']} PASS\nEXACT_SCOPE=PASS\nSOURCE_CONTRACT=PASS\nJAVA8_NO_NEW_REGRESSION=PASS\nCOMPLETED_OBFUSCATED_STRONGER_REPAIR_PRESERVED=PASS\n```\n\n### Result\n\n```text\nBUG-850-121=L2\nSTATUS=PASS\nPROMOTED=YES\nBUG-850-117_118_CHANGED=NO\n```\n'''
          p.write_text(t, encoding='utf-8')
          PY

          git rm .github/workflows/l1jtw85-bug-850-121-completed-promotion.yml
          git diff --name-only | sort > "$RUNNER_TEMP/final-actual"
          cat > "$RUNNER_TEMP/final-expected" <<'EOF'
          .github/workflows/l1jtw85-bug-850-121-completed-promotion.yml
          README.md
          recovery/normalized-src-vf/l1r/bh/L1BookMark.java
          EOF
          sort -o "$RUNNER_TEMP/final-expected" "$RUNNER_TEMP/final-expected"
          diff -u "$RUNNER_TEMP/final-expected" "$RUNNER_TEMP/final-actual"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md recovery/normalized-src-vf/l1r/bh/L1BookMark.java
          git commit -m "repair: promote BUG-850-121 bookmark fail-closed parity"
          git push origin HEAD:completed/l1jtw85-core-fixes
